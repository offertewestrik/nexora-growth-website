 "name": "Eindhoven"}, {"@type": "City", "name": "Uden"}, {"@type": "City", "name": "Veghel"}, {"@type": "City", "name": "Wijchen"}, {"@type": "City", "name": "Vught"}, {"@type": "City", "name": "Cuijk"}, {"@type": "Country", "name": "Nederland"}], "audience": {"@type": "BusinessAudience", "name": "Ondernemers die vindbaarheid, advertenties en content willen uitbesteden en afrekenen op aanvragen"}}, {"@type": "FAQPage", "@id": "https://nextgrowthdigital.nl/dienst-marketing/#faq", "mainEntity": [{"@type": "Question", "name": "Werkt SEO ook voor een lokaal bedrijf?", "acceptedAnswer": {"@type": "Answer", "text": "Juist voor lokale bedrijven werkt het goed, omdat de concurrentie er vaak zwak is. Wie in zijn regio bovenaan staat voor 'aannemer Eindhoven' of 'veranda op maat Nijmegen', wint structureel aanvragen zonder advertentiekosten. We bouwen per dienst en per plaats een eigen pagina met echte lokale inhoud en zetten je Google Bedrijfsprofiel op orde."}}, {"@type": "Question", "name": "Kan ik ook alleen advertenties of alleen SEO afnemen?", "acceptedAnswer": {"@type": "Answer", "text": "Ja. We adviseren wat volgens ons het snelst rendeert, maar jij kiest. Sommige klanten starten met alleen Google Ads, anderen met een SEO-basis of een social-aanpak. Wat je ook kiest: je zit nergens langdurig aan vast, de accounts zijn jouw eigendom en je kunt maandelijks opzeggen."}}, {"@type": "Question", "name": "Hoe weet ik of de marketing werkt?", "acceptedAnswer": {"@type": "Answer", "text": "Omdat we het meetbaar maken tot op de aanvraag. Elke campagne, pagina en advertentie is te herleiden naar wat hij opleverde, inclusief telefoonkliks. Je krijgt geen rapport vol grafieken, maar een kort overzicht: zoveel bezoekers, zoveel aanvragen, zoveel offertes, en wat we volgende maand anders doen."}}, {"@type": "Question", "name": "Doen jullie ook social media voor restaurants en brands?", "acceptedAnswer": {"@type": "Answer", "text": "Ja. Voor restaurants, horeca, brands, webshops en creators maken we content die past bij het kanaal: reels, productvideo's en advertentiesets uit onze eigen studio, gecombineerd met influencer-samenwerkingen waar dat zinvol is. Alles landt op een pagina waar de bezoeker direct kan reserveren, bestellen of aanvragen, zodat bereik meetbaar wordt."}}, {"@type": "Question", "name": "Werken jullie landelijk of alleen in Brabant en Gelderland?", "acceptedAnswer": {"@type": "Answer", "text": "Marketing doen we landelijk; campagnes en SEO draaien overal even goed. We werken landelijk en komen langs wanneer dat helpt, waar je ook zit. Bel 06 83 90 21 92 of mail info@nextgrowthdigital.nl."}}]}, {"@type": "BreadcrumbList", "@id": "https://nextgrowthdigital.nl/dienst-marketing/#breadcrumb", "itemListElement": [{"@type": "ListItem", "position": 1, "name": "Home", "item": "https://nextgrowthdigital.nl/home"}, {"@type": "ListItem", "position": 2, "name": "Diensten", "item": "https://nextgrowthdigital.nl/home#diensten"}, {"@type": "ListItem", "position": 3, "name": "Marketing, SEO, social & influencer-samenwerkingen", "item": "https://nextgrowthdigital.nl/dienst-marketing"}]}]}}, "dienst-branding": {"title": "Branding bureau: merk, huisstijl, positionering | Next Growth", "description": "Branding bij Next Growth: positionering, huisstijl, logo en tone of voice voor bedrijven in Brabant en Gelderland. Een merk dat klopt op site en social.", "h1": "Branding die klopt, van logo tot offerte", "keywords": ["branding bureau", "huisstijl laten maken", "logo laten ontwerpen Den Bosch", "merkpositionering MKB", "branding bureau Nijmegen", "huisstijl bouwbedrijf", "rebranding Eindhoven", "creatief bureau Brabant"], "definition": "Next Growth is een landelijk werkend creatief bureau voor branding: merkpositionering, huisstijl, logo en tone of voice. We bouwen een merk dat doorwerkt in alles wat je klant ziet, van website en social media tot configurator en offerte. Geen los logo, maar een merk dat herkenbaar is voordat iemand belt en consistent blijft nadat iemand klant werd.", "intro": "Open tien websites van bedrijven in dezelfde branche en je ziet tien keer hetzelfde: een fotoslider, een opsomming van diensten en een knop 'vraag een offerte aan'. Voor de klant is er niets te kiezen, dus vergelijkt hij op het enige dat overblijft: wie het eerst en het goedkoopst reageert. Dat is een race naar de bodem die je niet wilt winnen. Branding is de uitweg: een positionering die zegt voor wie je het beste bent, een huisstijl die dat laat zien en een toon die bij jou past.\n\nWe werken vanuit het proces, niet vanuit het plaatje. Eerst bepalen we doelgroep, belofte en bewijs. Daarna volgen naam, logo, kleuren, typografie en tone of voice, uitgewerkt in de middelen die je echt gebruikt: website, social media, offertesjabloon, busbelettering, werkkleding of menukaart. Omdat wij ook de website, de configurator en de marketing bouwen, blijft het merk overal hetzelfde. Bij Lucky Zonwering zie je hoe huisstijl, site, configurator en CRM één geheel vormen.", "sections": [{"h2": "Wat is branding en waarom heeft een MKB-bedrijf het nodig?", "body": "Branding is het geheel van positionering, naam, beeld en toon waarmee een bedrijf herkenbaar wordt en vertrouwen wekt. Voor een MKB-bedrijf betekent het praktisch: een klant ziet je bus, je site en je offerte en herkent in één oogopslag hetzelfde bedrijf. In de bouw en bij vakbedrijven is vertrouwen alles; je vraagt mensen om tienduizenden euro's en wekenlang hun huis. Een merk dat klopt neemt twijfel weg voordat het gesprek begint. Voor restaurants, brands en webshops beslist het merk of iemand reserveert of bestelt, en of hij terugkomt. Voor creators is het merk het product zelf. Branding is dus geen kostenpost voor later, maar de basis waarop website en marketing beter renderen."}, {"h2": "Hoe werkt een brandingtraject bij Next Growth?", "body": "We beginnen met een strategiegesprek: wat verkoop je, aan wie, wat doe je beter dan de rest en wat kun je bewijzen. Daaruit volgt een positionering van één alinea die je zelf kunt navertellen. Daarna ontwerpen we de huisstijl: logo, kleuren, typografie, beeldstijl en tone of voice, met voorbeelden op de middelen die jij gebruikt. Je kijkt tussentijds mee, zodat de oplevering geen verrassing is. Je ontvangt een compact merkboek met regels die iedereen in je bedrijf kan toepassen, plus alle bestanden in bruikbare formaten. Het traject past in een paar weken en sluit direct aan op de website, omdat we die meestal in hetzelfde proces bouwen. Alles wat we maken is jouw eigendom."}, {"h2": "Wat kost branding of een nieuwe huisstijl?", "body": "Een brandingtraject heeft bij ons een vaste prijs die we vooraf afspreken, afhankelijk van wat je nodig hebt. Een compacte huisstijl met logo, kleuren en typografie voor een startend vakbedrijf is een ander project dan een volledige rebranding met positionering, merkboek, fotografie-richtlijnen en uitwerking op website, social en drukwerk. We noemen geen standaardbedrag, omdat dat zonder de lijst van middelen niets zegt. In tien minuten aan de telefoon hoor je wat er in jouw geval nodig is en wat het kost. Combineer je branding met een website, dan plannen we beide in één traject, zodat het merk meteen live staat op de plek waar je klanten het zien."}, {"h2": "Rebranding: wanneer is het tijd om je merk te vernieuwen?", "body": "Als je bedrijf veranderd is en je uitstraling niet. Je bent van klusbedrijf naar aannemer gegroeid, van winkel naar webshop, van eenmanszaak naar team, maar het logo stamt nog uit de begintijd en de site praat over wie je toen was. Of je concurrenten zien er inmiddels professioneler uit en je verliest offertes aan bedrijven die niet beter zijn, maar wel beter ogen. Een rebranding hoeft niet alles overboord te gooien. Vaak houden we de naam en de herkenbare elementen en scherpen we positionering, beeld en toon aan. Daarna werken we het door in website, social, offertesjablonen en Google Bedrijfsprofiel, zodat het nieuwe merk overal tegelijk live gaat."}], "features": [{"t": "Positionering", "d": "Eén alinea die zegt voor wie je het beste bent en waarom, die je zelf kunt navertellen."}, {"t": "Logo en huisstijl", "d": "Logo, kleuren, typografie en beeldstijl, geleverd in alle formaten die je nodig hebt."}, {"t": "Tone of voice", "d": "Een schrijfwijze voor site, social en offertes die herkenbaar is en bij jouw klant past."}, {"t": "Merkboek", "d": "Compacte regels die iedereen in je bedrijf kan toepassen zonder ontwerper."}, {"t": "Uitwerking op middelen", "d": "Website, social templates, offertesjabloon, busbelettering, werkkleding of menukaart."}, {"t": "Doorwerking in software", "d": "Je configurator, offerte en CRM-mails dragen dezelfde huisstijl als je site."}], "faq": [{"q": "Wat is het verschil tussen een logo en branding?", "a": "Een logo is één beeldmerk. Branding is het hele systeem eromheen: positionering, kleuren, typografie, beeldstijl, tone of voice en de manier waarop dat terugkomt op je website, social media, offertes en bus. Een logo zonder dat systeem blijft een plaatje; branding zorgt dat je klant je overal herkent."}, {"q": "Hoe lang duurt een brandingtraject?", "a": "Een compacte huisstijl staat in een paar weken. We beginnen met een strategiegesprek, leveren daarna positionering en ontwerprichtingen op, en werken de gekozen richting uit op de middelen die je gebruikt. Combineer je het met een website, dan plannen we beide in één traject zodat het merk meteen live staat."}, {"q": "Kan ik mijn bestaande logo behouden?", "a": "Vaak wel. Bij een rebranding houden we meestal de naam en herkenbare elementen en scherpen we positionering, kleuren, typografie en toon aan. Zo blijft de herkenbaarheid bij bestaande klanten overeind, terwijl je uitstraling meegroeit met wat je bedrijf nu is. Of dat in jouw geval verstandig is, zien we in het eerste gesprek."}, {"q": "Doen jullie branding voor restaurants en brands?", "a": "Ja. Voor restaurants en horeca werken we het merk uit tot en met menukaart, interieurbeeld en social templates. Voor brands en webshops tot productfotografie-richtlijnen, verpakking en campagnes. Voor creators bouwen we een persoonlijk merk dat samenwerkingen aantrekt. Werkgebied: heel Nederland, met veel klanten in Den Bosch, Nijmegen, Arnhem, Eindhoven en de rest van Brabant en Gelderland."}, {"q": "Is alles wat jullie ontwerpen mijn eigendom?", "a": "Ja. Logo, huisstijlbestanden, merkboek en alle bronbestanden zijn na betaling jouw eigendom. Je kunt ermee naar elke drukker, ontwerper of bureau. Je zit nergens aan vast. De meeste klanten laten ons daarna ook de website en marketing doen, omdat het merk dan overal consistent blijft."}], "cities": ["Den Bosch", "Nijmegen", "Arnhem", "Eindhoven", "Uden", "Veghel", "Vught"], "proof": "Lucky Zonwering laat zien hoe huisstijl, website, configurator en CRM één geheel vormen; het bedrijf staat op 5,0 op Google met 124 reviews.", "internal_links": ["dienst-webdesign", "branche-brands", "branche-restaurants-horeca"], "jsonld": {"@context": "https://schema.org", "@graph": [{"@type": "WebPage", "@id": "https://nextgrowthdigital.nl/dienst-branding/#webpage", "url": "https://nextgrowthdigital.nl/dienst-branding", "name": "Branding bureau: merk, huisstijl, positionering | Next Growth", "description": "Branding bij Next Growth: positionering, huisstijl, logo en tone of voice voor bedrijven in Brabant en Gelderland. Een merk dat klopt op site en social.", "inLanguage": "nl-NL", "isPartOf": {"@id": "https://nextgrowthdigital.nl/#website"}, "about": {"@id": "https://nextgrowthdigital.nl/#organization"}, "breadcrumb": {"@id": "https://nextgrowthdigital.nl/dienst-branding/#breadcrumb"}}, {"@type": "Service", "@id": "https://nextgrowthdigital.nl/dienst-branding/#service", "name": "Branding die klopt, van logo tot offerte", "serviceType": "Branding: merkpositionering, huisstijl en tone of voice", "description": "Next Growth is een landelijk werkend creatief bureau voor branding: merkpositionering, huisstijl, logo en tone of voice. We bouwen een merk dat doorwerkt in alles wat je klant ziet, van website en social media tot configurator en offerte. Geen los logo, maar een merk dat herkenbaar is voordat iemand belt en consistent blijft nadat iemand klant werd.", "url": "https://nextgrowthdigital.nl/dienst-branding", "provider": {"@id": "https://nextgrowthdigital.nl/#organization"}, "areaServed": [{"@type": "Country", "name": "Nederland"}, {"@type": "City", "name": "Den Bosch"}, {"@type": "City", "name": "Nijmegen"}, {"@type": "City", "name": "Arnhem"}, {"@type": "City", "name": "Eindhoven"}, {"@type": "City", "name": "Uden"}, {"@type": "City", "name": "Veghel"}, {"@type": "City", "name": "Vught"}, {"@type": "Country", "name": "Nederland"}], "audience": {"@type": "BusinessAudience", "name": "Bedrijven en brands die een herkenbaar merk willen dat doorwerkt in website, marketing en offertes"}}, {"@type": "FAQPage", "@id": "https://nextgrowthdigital.nl/dienst-branding/#faq", "mainEntity": [{"@type": "Question", "name": "Wat is het verschil tussen een logo en branding?", "acceptedAnswer": {"@type": "Answer", "text": "Een logo is één beeldmerk. Branding is het hele systeem eromheen: positionering, kleuren, typografie, beeldstijl, tone of voice en de manier waarop dat terugkomt op je website, social media, offertes en bus. Een logo zonder dat systeem blijft een plaatje; branding zorgt dat je klant je overal herkent."}}, {"@type": "Question", "name": "Hoe lang duurt een brandingtraject?", "acceptedAnswer": {"@type": "Answer", "text": "Een compacte huisstijl staat in een paar weken. We beginnen met een strategiegesprek, leveren daarna positionering en ontwerprichtingen op, en werken de gekozen richting uit op de middelen die je gebruikt. Combineer je het met een website, dan plannen we beide in één traject zodat het merk meteen live staat."}}, {"@type": "Question", "name": "Kan ik mijn bestaande logo behouden?", "acceptedAnswer": {"@type": "Answer", "text": "Vaak wel. Bij een rebranding houden we meestal de naam en herkenbare elementen en scherpen we positionering, kleuren, typografie en toon aan. Zo blijft de herkenbaarheid bij bestaande klanten overeind, terwijl je uitstraling meegroeit met wat je bedrijf nu is. Of dat in jouw geval verstandig is, zien we in het eerste gesprek."}}, {"@type": "Question", "name": "Doen jullie branding voor restaurants en brands?", "acceptedAnswer": {"@type": "Answer", "text": "Ja. Voor restaurants en horeca werken we het merk uit tot en met menukaart, interieurbeeld en social templates. Voor brands en webshops tot productfotografie-richtlijnen, verpakking en campagnes. Voor creators bouwen we een persoonlijk merk dat samenwerkingen aantrekt. Werkgebied: heel Nederland, met veel klanten in Den Bosch, Nijmegen, Arnhem, Eindhoven en de rest van Brabant en Gelderland."}}, {"@type": "Question", "name": "Is alles wat jullie ontwerpen mijn eigendom?", "acceptedAnswer": {"@type": "Answer", "text": "Ja. Logo, huisstijlbestanden, merkboek en alle bronbestanden zijn na betaling jouw eigendom. Je kunt ermee naar elke drukker, ontwerper of bureau. Je zit nergens aan vast. De meeste klanten laten ons daarna ook de website en marketing doen, omdat het merk dan overal consistent blijft."}}]}, {"@type": "BreadcrumbList", "@id": "https://nextgrowthdigital.nl/dienst-branding/#breadcrumb", "itemListElement": [{"@type": "ListItem", "position": 1, "name": "Home", "item": "https://nextgrowthdigital.nl/home"}, {"@type": "ListItem", "position": 2, "name": "Diensten", "item": "https://nextgrowthdigital.nl/home#diensten"}, {"@type": "ListItem", "position": 3, "name": "Branding", "item": "https://nextgrowthdigital.nl/dienst-branding"}]}]}}, "sales": {"title": "Sales uitbesteden bouw: betalen per opdracht | Next Growth", "description": "Sales uitbesteden voor bouwbedrijven: Next Growth brengt met een salespartner getekende opdrachten binnen op commissie. Geen resultaat, geen rekening.", "h1": "Wij vullen je agenda met getekende opdrachten", "keywords": ["sales uitbesteden bouw", "sales op commissie", "acquisitie uitbesteden aannemer", "leadgeneratie bouwbedrijf", "sales as a service bouw", "verkoop uitbesteden installatiebedrijf", "no cure no pay sales", "lead opvolging CRM bouw"], "definition": "Next Growth doet de sales voor bouwbedrijven en de verduurzamingsbranche, samen met een salespartner. Jij levert het vakwerk, wij brengen de klanten en je betaalt alleen commissie op getekende opdrachten. Geen loondienst, geen vaste kosten, geen resultaat geen rekening. Next Growth levert het systeem: leads, configurator, CRM, offertes en automatische opvolging. De salespartner levert ervaren verkopers die bellen, kwalificeren en deals sluiten.", "intro": "De meeste bouwbedrijven verkopen niet slecht, ze verkopen te weinig, omdat er niemand is die het doet. De eigenaar zit op de bouw, de werkvoorbereider zit vol, en acquisitie is wat er 's avonds bij komt als er tijd over is. Die tijd is er zelden. Het gevolg is een orderportefeuille die meebeweegt met de markt in plaats van met je plannen. Een verkoper in dienst nemen kost tienduizenden euro's per jaar, en pas na een half jaar weet je of hij werkt.\n\nDaarom werken wij op commissie. Je betaalt een vooraf afgesproken percentage over opdrachten die daadwerkelijk getekend worden, en verder niets. Geen retainer, geen opstartkosten. Het risico van leadgeneratie, opvolging en gesprekken die nergens toe leiden, ligt bij ons. Onze belangen zijn gelijk: wij groeien als jij groeit. Je kijkt live mee in één CRM: welke leads binnenkomen, welke afspraken staan en welke opdrachten getekend zijn.", "sections": [{"h2": "Hoe werkt sales uitbesteden op commissie?", "body": "In vier stappen. Eén: wij brengen de leads binnen via marketing, campagnes en ons netwerk, gericht op jouw sector en werkgebied. De basis is een configurator op je eigen site: de klant stelt zelf samen, ziet een richtprijs en stuurt een complete aanvraag. Die is al gekwalificeerd voordat er iemand belt. Twee: onze salespartner belt, kwalificeert en plant afspraken; alleen serieuze opdrachten komen bij jou. Drie: we bereiden offertes voor en begeleiden de deal tot de handtekening. Vier: jij voert de opdracht uit en pas bij een getekende opdracht rekenen we de afgesproken commissie. Het CRM doet de opvolging per e-mail, WhatsApp en telefoon op vaste momenten, zonder dat iemand eraan hoeft te denken."}, {"h2": "Wat betekent 'geen resultaat, geen rekening' precies?", "body": "Er gaat geen maandbedrag om. Je betaalt uitsluitend commissie over opdrachten die daadwerkelijk getekend worden. Geen opdracht, geen rekening. Het percentage stemmen we vooraf samen af, passend bij je marge, gemiddelde ordergrootte en sector, en het staat zwart op wit voordat we beginnen. Dat model werkt alleen als beide kanten er iets aan hebben. Daarom zijn we selectief: bij een te dunne marge of een te lange verkoopcyclus komen we er geen van beiden uit, en dat gesprek voeren we liever vooraf dan achteraf. Het past slecht bij een gemiddelde ordergrootte onder een paar duizend euro, en ook slecht als je geen capaciteit hebt om extra werk aan te nemen."}, {"h2": "Voor welke bedrijven werkt sales op commissie?", "body": "Voor twee branches met één aanpak. Bouwbedrijven: aannemers, verbouwers, prefab- en installatiebedrijven die vakmensen hebben maar geen tijd voor acquisitie. Denk aan verbouwingen, aanbouwen, renovaties, dak- en gevelprojecten, voor zakelijke en particuliere opdrachtgevers. En de verduurzamingsbranche: installateurs en leveranciers van warmtepompen, hybride systemen, zonnepanelen, isolatie en laadpalen, inclusief VvE-trajecten en subsidiegedreven vraag, waar de vraag groot maar versnipperd is. We kennen de taal van de bouw en de cijfers van verduurzaming, en verkopen daardoor niet alleen meer, maar ook de juiste opdrachten. Kortom: bedrijven met sterk vakwerk die meer opdrachten aankunnen, in Brabant, Gelderland en daarbuiten."}, {"h2": "Wat is het verschil met een leadsite of vergelijkingsportaal?", "body": "Bij een portaal koop je een naam die tegelijk aan drie concurrenten wordt doorverkocht, en het gesprek gaat daarna over prijs omdat de klant niets van je weet. Bij ons komt de aanvraag van je eigen site, via een configurator waarin de klant al gekozen heeft, en wordt hij opgevolgd door een verkoper die jouw bedrijf kent. Je betaalt niet per lead maar per getekende opdracht. Daaronder draait de software van Next Growth: leads, CRM, offertes, automatisering en dashboards. Daarbovenop werken ervaren verkopers met branchekennis. Jij hebt één aanspreekpunt en realtime inzicht in je pijplijn en getekende omzet. Bij Lucky Zonwering verving één CRM- en offertesysteem losse tools voor offerte, planning en montage."}], "features": [{"t": "Leads uit eigen kanaal", "d": "Configurator, campagnes en netwerk op jouw sector en werkgebied, geen gekochte lijsten."}, {"t": "Kwalificatie en afspraken", "d": "De salespartner belt en plant; alleen serieuze opdrachten komen bij jou."}, {"t": "Offerte voorbereid", "d": "Gegevens uit de aanvraag worden automatisch een offerte met digitaal akkoord."}, {"t": "Automatische opvolging", "d": "E-mail, WhatsApp en belmomenten op vaste tijden, zodat geen lead blijft liggen."}, {"t": "Live pijplijn", "d": "Eén CRM waarin je dagelijks ziet welke afspraken staan en wat er getekend is."}, {"t": "Alleen commissie", "d": "Geen retainer, geen opstartkosten; een vast percentage per getekende opdracht."}], "faq": [{"q": "Hoe hoog is de commissie?", "a": "Een vast percentage per getekende opdracht, dat we vooraf samen afstemmen. De hoogte hangt af van je marge, de gemiddelde ordergrootte en de sector. Alles staat zwart op wit voordat we starten, zodat er geen verrassingen achteraf zijn. Er is geen retainer en geen maandbedrag; je betaalt alleen als het raak is."}, {"q": "Betaal ik ook als er niets wordt getekend?", "a": "Nee. Je betaalt uitsluitend commissie over opdrachten die daadwerkelijk getekend worden. Geen resultaat betekent geen rekening. Het risico van leadgeneratie, opvolging en gesprekken die nergens toe leiden, ligt bij ons. Daarom zijn we vooraf eerlijk over of jouw marge en ordergrootte bij dit model passen."}, {"q": "Wie doet nu precies de verkoop?", "a": "Een samenwerking. Next Growth levert het systeem: leads, configurator, CRM, offertes, automatisering en dashboards. Onze salespartner levert ervaren verkopers met branchekennis die bellen, kwalificeren, afspreken en deals sluiten in bouw en verduurzaming. Jij hebt één aanspreekpunt en kijkt live mee in de pijplijn."}, {"q": "Voor welke bedrijven werkt dit niet?", "a": "Voor bedrijven met een gemiddelde ordergrootte onder een paar duizend euro: de commissie weegt dan niet op tegen het werk. En voor bedrijven zonder capaciteit voor extra werk; meer getekende opdrachten dan je kunt uitvoeren is geen resultaat maar een probleem. Zeg dat vooraf, dan stemmen we het tempo daarop af."}, {"q": "Krijg ik zicht op de pijplijn?", "a": "Ja. Alles loopt door één CRM waarin je live meekijkt: welke leads binnenkomen, welke afspraken staan en welke opdrachten getekend zijn. Volledige transparantie, elke dag. Wil je eerst praten, bel 06 83 90 21 92 of mail info@nextgrowthdigital.nl; tien minuten is genoeg om te weten of dit voor jou klopt."}], "cities": ["Den Bosch", "Nijmegen", "Arnhem", "Eindhoven", "Uden", "Veghel", "Cuijk", "Wijchen"], "proof": "Lucky Zonwering (één CRM- en offertesysteem, 5,0 op Google met 124 reviews) en Installatieplatform (offerte in 2 minuten) tonen de motor onder de sales.", "internal_links": ["branche-bouwbedrijven", "branche-installatiebedrijven", "dienst-marketing"], "jsonld": {"@context": "https://schema.org", "@graph": [{"@type": "WebPage", "@id": "https://nextgrowthdigital.nl/sales/#webpage", "url": "https://nextgrowthdigital.nl/sales", "name": "Sales uitbesteden bouw: betalen per opdracht | Next Growth", "description": "Sales uitbesteden voor bouwbedrijven: Next Growth brengt met een salespartner getekende opdrachten binnen op commissie. Geen resultaat, geen rekening.", "inLanguage": "nl-NL", "isPartOf": {"@id": "https://nextgrowthdigital.nl/#website"}, "about": {"@id": "https://nextgrowthdigital.nl/#organization"}, "breadcrumb": {"@id": "https://nextgrowthdigital.nl/sales/#breadcrumb"}}, {"@type": "Service", "@id": "https://nextgrowthdigital.nl/sales/#service", "name": "Wij vullen je agenda met getekende opdrachten", "serviceType": "Sales as a service voor bouw en verduurzaming op commissie", "description": "Next Growth doet de sales voor bouwbedrijven en de verduurzamingsbranche, samen met een salespartner. Jij levert het vakwerk, wij brengen de klanten en je betaalt alleen commissie op getekende opdrachten. Geen loondienst, geen vaste kosten, geen resultaat geen rekening. Next Growth levert het systeem: leads, configurator, CRM, offertes en automatische opvolging. De salespartner levert ervaren verkopers die bellen, kwalificeren en deals sluiten.", "url": "https://nextgrowthdigital.nl/sales", "provider": {"@id": "https://nextgrowthdigital.nl/#organization"}, "areaServed": [{"@type": "Country", "name": "Nederland"}, {"@type": "City", "name": "Den Bosch"}, {"@type": "City", "name": "Nijmegen"}, {"@type": "City", "name": "Arnhem"}, {"@type": "City", "name": "Eindhoven"}, {"@type": "City", "name": "Uden"}, {"@type": "City", "name": "Veghel"}, {"@type": "City", "name": "Cuijk"}, {"@type": "City", "name": "Wijchen"}, {"@type": "Country", "name": "Nederland"}], "audience": {"@type": "BusinessAudience", "name": "Bouwbedrijven, aannemers, prefab- en installatiebedrijven en de verduurzamingsbranche met capaciteit voor meer opdrachten"}}, {"@type": "FAQPage", "@id": "https://nextgrowthdigital.nl/sales/#faq", "mainEntity": [{"@type": "Question", "name": "Hoe hoog is de commissie?", "acceptedAnswer": {"@type": "Answer", "text": "Een vast percentage per getekende opdracht, dat we vooraf samen afstemmen. De hoogte hangt af van je marge, de gemiddelde ordergrootte en de sector. Alles staat zwart op wit voordat we starten, zodat er geen verrassingen achteraf zijn. Er is geen retainer en geen maandbedrag; je betaalt alleen als het raak is."}}, {"@type": "Question", "name": "Betaal ik ook als er niets wordt getekend?", "acceptedAnswer": {"@type": "Answer", "text": "Nee. Je betaalt uitsluitend commissie over opdrachten die daadwerkelijk getekend worden. Geen resultaat betekent geen rekening. Het risico van leadgeneratie, opvolging en gesprekken die nergens toe leiden, ligt bij ons. Daarom zijn we vooraf eerlijk over of jouw marge en ordergrootte bij dit model passen."}}, {"@type": "Question", "name": "Wie doet nu precies de verkoop?", "acceptedAnswer": {"@type": "Answer", "text": "Een samenwerking. Next Growth levert het systeem: leads, configurator, CRM, offertes, automatisering en dashboards. Onze salespartner levert ervaren verkopers met branchekennis die bellen, kwalificeren, afspreken en deals sluiten in bouw en verduurzaming. Jij hebt één aanspreekpunt en kijkt live mee in de pijplijn."}}, {"@type": "Question", "name": "Voor welke bedrijven werkt dit niet?", "acceptedAnswer": {"@type": "Answer", "text": "Voor bedrijven met een gemiddelde ordergrootte onder een paar duizend euro: de commissie weegt dan niet op tegen het werk. En voor bedrijven zonder capaciteit voor extra werk; meer getekende opdrachten dan je kunt uitvoeren is geen resultaat maar een probleem. Zeg dat vooraf, dan stemmen we het tempo daarop af."}}, {"@type": "Question", "name": "Krijg ik zicht op de pijplijn?", "acceptedAnswer": {"@type": "Answer", "text": "Ja. Alles loopt door één CRM waarin je live meekijkt: welke leads binnenkomen, welke afspraken staan en welke opdrachten getekend zijn. Volledige transparantie, elke dag. Wil je eerst praten, bel 06 83 90 21 92 of mail info@nextgrowthdigital.nl; tien minuten is genoeg om te weten of dit voor jou klopt."}}]}, {"@type": "BreadcrumbList", "@id": "https://nextgrowthdigital.nl/sales/#breadcrumb", "itemListElement": [{"@type": "ListItem", "position": 1, "name": "Home", "item": "https://nextgrowthdigital.nl/home"}, {"@type": "ListItem", "position": 2, "name": "Sales voor bouwbedrijven", "item": "https://nextgrowthdigital.nl/sales"}]}]}}, "dienst-configurators": {"title": "Configurator laten maken: productconfigurator op maat | Next Growth", "description": "Next Growth bouwt productconfigurators op maat: je klant stelt zelf samen, ziet direct beeld en richtprijs en stuurt een complete aanvraag. Tien configurators live.", "h1": "Je klant stelt het zelf samen, jij krijgt een complete aanvraag", "keywords": ["configurator laten maken", "productconfigurator op maat", "3D configurator website", "overkapping configurator", "uitbouw configurator", "dakkapel configurator", "zwembad configurator", "badkamer configurator", "configurator bouwbedrijf", "configurator met offerte en CRM"], "definition": "Next Growth bouwt productconfigurators op maat voor bedrijven die iets samenstelbaars verkopen: overkappingen, uitbouwen, dakkapellen, dakopbouwen, badkamers, zwembaden, poolhouses, zonwering, vloeren en zelfs jachten. Je klant kiest maat, materiaal en afwerking, ziet per keuze fotorealistisch beeld en een richtprijs, en stuurt een aanvraag met complete specificatie. Er draaien nu tien configurators live.", "intro": "Maatwerk verkopen kost tijd op het verkeerde moment: tussen de aanvraag en de offerte. Elke aanvraag begint met bellen over welke maat, welk materiaal en welke afwerking, en pas daarna kun je rekenen. Een configurator haalt dat stuk weg. De klant maakt de keuzes zelf, op jouw website, op het moment dat het hem uitkomt. Wie om elf uur 's avonds configureert, staat de volgende ochtend in je CRM met alles erbij.\n\nWij bouwen geen standaard plug-in. Elke configurator is opgebouwd uit de keuzes die jouw klant echt maakt, met beeld per keuze uit onze eigen engine. Daarom werkt dezelfde aanpak voor een houten overkapping, een dakopbouw en een jacht met sleepbare 360-gradenweergave.", "sections": [{"h2": "Wat is een productconfigurator en wat levert hij op?", "body": "Een productconfigurator is een onderdeel van je website waarin de klant zelf zijn product samenstelt: afmeting, model, materiaal, kleur en opties. Bij elke keuze verandert het beeld en de richtprijs mee. Het resultaat is geen los contactformulier, maar een aanvraag van iemand die al gekozen heeft. Je belt niet meer over wat hij ongeveer wil, je belt over wanneer het kan."}, {"h2": "Voor welke producten bouwen we configurators?", "body": "Er draaien er nu tien, voor heel verschillende producten: jachten, dakopbouwen, aanbouwen, badkamers, zwembaden, overkappingen, poolhouses, kunstgras, pvc-vloeren en tegelvloeren. De aanpak is steeds dezelfde: jouw product opgedeeld in de keuzes die je klant echt maakt, met fotorealistisch beeld per keuze. Verkoop je iets samenstelbaars, dan is er een configurator voor te bouwen."}, {"h2": "Hoe ziet het beeld eruit?", "body": "Het beeld komt uit onze eigen configurator-engine. De klant ziet zijn eigen samenstelling, geen stockfoto. Voor een overkapping betekent dat: het gekozen hout, de daksoort en de maat in één render; voor een jacht per kleurkeuze een render van het schip, tot en met een sleepbare 360-gradenweergave."}, {"h2": "Wat gebeurt er na de configuratie?", "body": "De aanvraag landt in je CRM met de volledige specificatie en richtprijs. Wil je verder, dan wordt dezelfde aanvraag automatisch een offerte met digitaal akkoord en automatische opvolging. Je kunt klein beginnen met website en configurator en CRM en automatisering later aansluiten."}], "features": [{"t": "Keuzes op maat", "d": "Jouw assortiment opgedeeld in de keuzes die de klant echt maakt, niet meer en niet minder."}, {"t": "Beeld per keuze", "d": "Fotorealistische renders uit onze eigen engine, tot en met 360 graden waar dat zinvol is."}, {"t": "Richtprijs en aanvraag", "d": "De klant ziet een richtprijs en stuurt een complete specificatie, direct je CRM in."}], "faq": [{"q": "Kan ik een configurator van Next Growth uitproberen?", "a": "Ja. Op deze pagina staan compacte, werkende mini-demo's van onze configurators: uitbouw, dakopbouw, nokverhoging, dakrenovatie, gevelrenovatie, overkapping, kunstgras en jacht. Je kiest een optie en ziet direct de bijbehorende render. Elke demo linkt naar de volledige configurator met richtprijs en aanvraag."}, {"q": "Wat kost het om een configurator te laten maken?", "a": "Dat hangt af van wat je verkoopt. Een configurator wordt op maat begroot: het aantal keuzes in je product en het beeldwerk bepalen de prijs. In een kennismaking rekenen we het concreet voor."}, {"q": "Werkt een productconfigurator ook voor mijn branche?", "a": "Er draaien er nu tien, voor producten van jachten tot tegelvloeren. Verkoop je iets dat de klant samenstelt uit maten, materialen of opties, dan is er een configurator voor te bouwen."}, {"q": "Wat levert een configurator op?", "a": "Aanvragen van mensen die al gekozen hebben, met specificatie en richtprijs erbij. Bij Prefab Select leverde een configurator met offerteflow en CRM-koppeling 212 procent meer aanvragen op."}, {"q": "Zit er ook een offerte en CRM aan vast?", "a": "Dat kan. Dezelfde aanvraag wordt automatisch een offerte, komt in het CRM en krijgt automatische opvolging. Je kunt ook starten met alleen website en configurator."}], "cities": ["Den Bosch", "Nijmegen", "Arnhem", "Eindhoven", "Uden", "Veghel", "Vught"], "proof": "Tien configurators draaien live. Bij Prefab Select leverde de combinatie van configurator, offerteflow en CRM-koppeling 212 procent meer aanvragen op.", "internal_links": ["dienst-crm", "dienst-automatisering", "branche-overkapping-veranda"], "kort": {"wat": "Productconfigurator op maat met beeld en richtprijs", "waar": "Heel Nederland, op locatie en op afstand", "prijs": "Op maat begroot", "doorlooptijd": "Afhankelijk van keuzes en beeldwerk", "voorwie": "Bedrijven die iets samenstelbaars verkopen", "eigendom": "Code, data en beeld zijn van jou"}, "jsonld": {"@context": "https://schema.org", "@graph": [{"@type": "WebPage", "@id": "https://nextgrowthdigital.nl/dienst-configurators/#webpage", "url": "https://nextgrowthdigital.nl/dienst-configurators", "name": "Configurator laten maken: productconfigurator op maat | Next Growth", "description": "Next Growth bouwt productconfigurators op maat: je klant stelt zelf samen, ziet direct beeld en richtprijs en stuurt een complete aanvraag. Tien configurators live.", "inLanguage": "nl-NL", "isPartOf": {"@id": "https://nextgrowthdigital.nl/#website"}, "about": {"@id": "https://nextgrowthdigital.nl/#organization"}, "breadcrumb": {"@id": "https://nextgrowthdigital.nl/dienst-configurators/#breadcrumb"}}, {"@type": "Service", "@id": "https://nextgrowthdigital.nl/dienst-configurators/#service", "name": "Je klant stelt het zelf samen, jij krijgt een complete aanvraag", "serviceType": "Productconfigurators op maat met beeld en richtprijs", "description": "Next Growth bouwt productconfigurators op maat voor bedrijven die iets samenstelbaars verkopen: overkappingen, uitbouwen, dakkapellen, dakopbouwen, badkamers, zwembaden, poolhouses, zonwering, vloeren en zelfs jachten. Je klant kiest maat, materiaal en afwerking, ziet per keuze fotorealistisch beeld en een richtprijs, en stuurt een aanvraag met complete specificatie. Er draaien nu tien configurators live.", "url": "https://nextgrowthdigital.nl/dienst-configurators", "provider": {"@id": "https://nextgrowthdigital.nl/#organization"}, "areaServed": [{"@type": "Country", "name": "Nederland"}, {"@type": "City", "name": "Den Bosch"}, {"@type": "City", "name": "Nijmegen"}, {"@type": "City", "name": "Arnhem"}, {"@type": "City", "name": "Eindhoven"}, {"@type": "City", "name": "Uden"}, {"@type": "City", "name": "Veghel"}, {"@type": "City", "name": "Vught"}, {"@type": "Country", "name": "Nederland"}], "audience": {"@type": "BusinessAudience", "name": "Bedrijven die een samenstelbaar product verkopen en complete aanvragen willen"}}, {"@type": "FAQPage", "@id": "https://nextgrowthdigital.nl/dienst-configurators/#faq", "mainEntity": [{"@type": "Question", "name": "Kan ik een configurator van Next Growth uitproberen?", "acceptedAnswer": {"@type": "Answer", "text": "Ja. Op deze pagina staan compacte, werkende mini-demo's van onze configurators: uitbouw, dakopbouw, nokverhoging, dakrenovatie, gevelrenovatie, overkapping, kunstgras en jacht. Je kiest een optie en ziet direct de bijbehorende render. Elke demo linkt naar de volledige configurator met richtprijs en aanvraag."}}, {"@type": "Question", "name": "Wat kost het om een configurator te laten maken?", "acceptedAnswer": {"@type": "Answer", "text": "Dat hangt af van wat je verkoopt. Een configurator wordt op maat begroot: het aantal keuzes in je product en het beeldwerk bepalen de prijs. In een kennismaking rekenen we het concreet voor."}}, {"@type": "Question", "name": "Werkt een productconfigurator ook voor mijn branche?", "acceptedAnswer": {"@type": "Answer", "text": "Er draaien er nu tien, voor producten van jachten tot tegelvloeren. Verkoop je iets dat de klant samenstelt uit maten, materialen of opties, dan is er een configurator voor te bouwen."}}, {"@type": "Question", "name": "Wat levert een configurator op?", "acceptedAnswer": {"@type": "Answer", "text": "Aanvragen van mensen die al gekozen hebben, met specificatie en richtprijs erbij. Bij Prefab Select leverde een configurator met offerteflow en CRM-koppeling 212 procent meer aanvragen op."}}, {"@type": "Question", "name": "Zit er ook een offerte en CRM aan vast?", "acceptedAnswer": {"@type": "Answer", "text": "Dat kan. Dezelfde aanvraag wordt automatisch een offerte, komt in het CRM en krijgt automatische opvolging. Je kunt ook starten met alleen website en configurator."}}]}, {"@type": "BreadcrumbList", "@id": "https://nextgrowthdigital.nl/dienst-configurators/#breadcrumb", "itemListElement": [{"@type": "ListItem", "position": 1, "name": "Home", "item": "https://nextgrowthdigital.nl/"}, ead waar hij staat en wat de volgende actie is."}, {"h2": "Hoe werkt de offerteflow?", "body": "Gegevens uit de aanvraag of configuratie worden automatisch de basis van de offerte: calculatie, offerteregels, btw, voorwaarden. De klant krijgt de offerte digitaal, kan hem online akkoord geven en ontvangt automatische herinneringen als hij nog niet gereageerd heeft."}, {"h2": "Wat gebeurt er na het akkoord?", "body": "Een getekende offerte wordt een opdracht: de map, planning en materiaalstaat staan klaar, de klant krijgt een bevestiging en de status in het CRM verandert mee. Dat is de stap naar procesautomatisering, die je later kunt aansluiten."}, {"h2": "Moet ik overstappen van mijn huidige systemen?", "body": "Nee. Waar een koppeling mogelijk is, sluiten we aan op wat er al draait: boekhouding, agenda, WhatsApp, e-mail. Je houdt wat werkt en vervangt alleen wat niet werkt."}], "features": [{"t": "Eén inbox voor alle aanvragen", "d": "Website, configurator, telefoon en mail komen op één plek binnen met de juiste velden."}, {"t": "Offerte met digitaal akkoord", "d": "Calculatie, offerte, online akkoord en herinneringen in één flow."}, {"t": "Verkopers weten wie ze bellen", "d": "Per lead een status, een eigenaar en een volgende actie."}], "faq": [{"q": "Wat kost een CRM op maat?", "a": "Een website met CRM begint bij € 6.995. CRM met automatisering van opvolging en offertes begint bij € 11.995. Beide zijn vaste prijzen voor een afgebakende inrichting; uitbreidingen worden apart begroot."}, {"q": "Is dit een abonnement of koop ik het?", "a": "Je koopt de inrichting; code en data zijn van jou. Voor hosting, beheer en doorontwikkeling zijn er onderhoudsplannen vanaf € 99 per maand."}, {"q": "Hoe snel staat het CRM?", "a": "Dat hangt af van je proces en koppelingen. Een website met CRM-inrichting zetten we in weken live, niet in maanden."}, {"q": "Kan het CRM samenwerken met mijn configurator?", "a": "Ja. Een configuratie landt met specificatie en richtprijs direct in he pe": "ListItem", "position": 2, "name": "Maatwerk software die jouw manier van verkopen vastlegt", "item": "https://nextgrowthdigital.nl/dienst-software"}]}]}}, "lokaal-webdesign-uden": {"title": "Website laten maken Uden vanaf € 2.995 | Next Growth", "description": "Website laten maken in Uden en Maashorst: concreter dan de concurrentie uit Veghel en Den Bosch. Vanaf € 2.995, live in twee weken, jouw eigendom.", "h1": "Website laten maken in Uden", "keywords": ["website laten maken Uden", "webdesign Uden", "webdesign bureau Uden", "website Maashorst", "website bouwen Uden", "website Loopkant-Liessent", "zonwering configurator Uden", "website laten maken Volkel"], "definition": "Next Growth is een landelijk werkend webdesignbureau dat websites bouwt voor bedrijven in Uden en de gemeente Maashorst. Een website kost vanaf € 2.995, staat in twee weken live en is jouw eigendom. We bouwen sites die concreter zijn dan de concurrentie uit drie richtingen: met prijsindicatie, echt werk in beeld en een aanvraag die compleet binnenkomt.", "intro": "Uden ligt precies midden in de driehoek Eindhoven, Nijmegen en Den Bosch, aan de A50. Commercieel is dat een sterke plek: binnen een half uur zit je in drie steden, en dat verklaart de omvang van Loopkant-Liessent, een terrein van zo'n 130 hectare met maakindustrie, groothandel, transport en techniek. Online is die ligging lastig. Een klant in Uden die een aannemer of installateur zoekt, krijgt net zo goed bedrijven uit Veghel, Den Bosch en Nijmegen te zien, want die rijden hier ook naartoe.\n\nLokale bekendheid beschermt hier dus minder dan in een geïsoleerde plaats. Wat het verschil maakt, is of je site een concreter antwoord geeft dan de partij uit de stad ernaast: wat kost het ongeveer, hoe lang duurt het, en heb je dit eerder gedaan bij een woning die op de mijne lijkt. Dat is precies wat wij bouwen, vanaf € 2.995 en in twee weken live. Sinds Uden en Landerd samen Maashorst zijn, nemen we Volkel, Odiliapeel, Schaijk, Reek en Zeeland standaard mee als werkgebied.", "sections": [{"h2": "Hoe val je in Uden op tegen bedrijven uit drie richtingen?", "body": "Door niet hetzelfde te zeggen als de rest. 'Vakmanschap, kwaliteit en service' staat op de site van elk bouwbedrijf tussen hier en Eindhoven, en het overtuigt niemand meer. Wat wel werkt is specifiek zijn: welk werk je doet, welk werk je niet doet, hoe lang het duurt en wat het ongeveer kost. Dat is ongemakkelijker om op te schrijven en het levert meer en betere aanvragen op. De meeste sites in deze regio stoppen bij 'vraag een vrijblijvende offerte aan'. Wie op de site al laat zien wat iets ongeveer kost, wint de aanvraag van wie dat pas in een gesprek doet. Een configurator met je eigen opties en prijzen is daarvoor het concreetste middel: de bezoeker heeft iets gedaan wat hij bij de andere vier niet kon, en dat is de reden om terug te komen en te bellen."}, {"h2": "Voor welke bedrijven in Uden en Maashorst bouwen we?", "body": "De woningvoorraad in Uden is naar verhouding jong, en dat verschuift het werk van vervangen naar verbeteren. Aannemers die naoorlogse woningen uitbreiden in plaats van vervangen. Klusbedrijven in de kernen, waar snelheid van reageren de opdracht bepaalt. Zonweringbedrijven, want de ruime kavels en de nieuwbouw uit de jaren tachtig en negentig maken dit een grote markt voor buitenzonwering. Zwembadbouwers, omdat de tuinen op de Maashorst groter zijn dan de omvang van de plaats doet vermoeden. Vloerenzaken voor woningen uit de jaren zeventig tot negentig die aan hun tweede of derde vloer toe zijn. En de technische bedrijven op Loopkant-Liessent, Hoogveld en Goorkens die aan andere bedrijven leveren en een site nodig hebben die op de longlist van een inkoper komt."}, {"h2": "Wat kost een website laten maken in Uden?", "body": "Vanaf € 2.995 voor een zakelijke website en vanaf € 6.995 voor een website met CRM, als vaste prijs die vooraf vaststaat. Teksten, mobiel ontwerp, SEO-basis en formulieren zitten erin. Of er een configurator of een koppeling met je systeem bij moet, bepaalt het uiteindelijke bedrag; een zwembad- of zonweringconfigurator begroten we apart. Voor een klein bedrijf in Uden is dat geen speelgoed voor de grote jongens uit Den Bosch, eerder andersom: de grote bedrijven winnen op naamsbekendheid, jij wint op iets wat zij niet aanbieden. Een configurator met je eigen opties en prijzen kost minder dan een jaar advertenties en werkt daarna elke dag. In twintig minuten hoor je wat er in jouw geval nodig is, en je zit daarna nergens aan vast."}, {"h2": "Waarom je werkgebied groter is dan je site laat zien", "body": "De gemeente heet sinds 1 januari 2022 Maashorst, gevormd uit Uden en Landerd. Voor een bedrijf betekent dat een groter thuisgebied: Volkel, Odiliapeel, Schaijk, Reek en Zeeland horen er nu bij. Veel lokale sites lopen daar nog op achter en noemen alleen Uden. Dat is een gemiste kans, want mensen in die kernen zoeken op hun eigen plaatsnaam en willen weten of je daar ook komt. We maken het werkgebied expliciet in de structuur van de site, zonder voor elke kern een aparte dunne pagina te maken; dat werkt niet meer en kost je eerder ranking dan dat het iets oplevert. Een configurator neemt het werkgebied gewoon mee: de klant vult zijn plaats in en de aanvraag komt binnen met afstand en plaats erbij, zodat je zelf beslist wat je aanneemt."}], "features": [{"t": "Concreter dan de concurrentie", "d": "Prijsindicatie, echt werk in beeld en een aanvraagroute die niet op een leeg formulier uitkomt."}, {"t": "Vaste prijs vanaf € 2.995", "d": "Website met CRM vanaf € 6.995. Geen verrassingen achteraf, geen licentie per gebruiker."}, {"t": "Live in twee weken", "d": "Eerst de pagina's die verkopen, daarna de rest. Een configurator loopt parallel."}, {"t": "Heel Maashorst als werkgebied", "d": "Volkel, Odiliapeel, Schaijk, Reek en Zeeland expliciet in de structuur, zonder dunne dorpspagina's."}, {"t": "Configurator voor grote producten", "d": "Zonwering, overkapping en zwembad: de klant kiest zelf en ziet direct beeld en richtprijs."}, {"t": "Jouw eigendom", "d": "Code, data en design zijn van jou. We komen langs als dat handiger is."}], "faq": [{"q": "Wat kost een website laten maken in Uden?", "a": "Een zakelijke website kost vanaf € 2.995 en een website met CRM vanaf € 6.995, als vaste prijs die vooraf vaststaat. Een zonwering- of zwembadconfigurator begroten we apart op basis van je opties en prijslogica. In een gesprek van twintig minuten hoor je wat er in jouw situatie nodig is en wat dat kost."}, {"q": "Hoe lang duurt het?", "a": "Een zakelijke website staat in twee weken live. We beginnen met de pagina's die aanvragen opleveren en bouwen de rest daarna af. Een configurator loopt parallel aan de site, dus die hoeft de livegang niet op te houden. Wil je eerst alleen de site en later de configurator, dan kan dat ook."}, {"q": "Wie is de eigenaar van de site?", "a": "Jij. Code, content, design en data zijn jouw eigendom, met alle toegangen op jouw naam. Er zit geen licentie per gebruiker in en geen contract dat je vasthoudt. Onderhoud is een los abonnement dat je zelf kiest. Vertrek je, dan neem je alles mee."}, {"q": "Zitten jullie in Uden?", "a": "Nee, we werken landelijk. Overleg gaat digitaal en we komen langs wanneer dat helpt. We komen regelmatig in Uden en kunnen langskomen wanneer dat handiger is dan videobellen. Een vestigingsadres huren om lokaal te lijken doen we niet. Wat je aan een bureau hebt, hangt af van of ze je markt kennen en of ze opnemen als je belt."}, {"q": "Wij werken in heel Maashorst. Kan dat op de site?", "a": "Ja, en dat is verstandiger dan alleen Uden noemen. Sinds 2022 horen Volkel, Odiliapeel, Schaijk, Reek en Zeeland bij dezelfde gemeente, en mensen daar zoeken op hun eigen plaatsnaam. We benoemen het werkgebied expliciet in de structuur van de site, zonder aparte dunne pagina per kern, want dat werkt niet meer."}, {"q": "Is een configurator niet iets voor grote bedrijven?", "a": "Andersom. G , in twee weken.", "h1": "Website laten maken in Veghel", "keywords": ["website laten maken Veghel", "webdesign Veghel", "webdesign bureau Veghel", "website Meierijstad", "website toeleverancier Veghel", "website De Dubbelen Doornhoek", "website bouwen Veghel", "website laten maken Erp"], "definition": "Next Growth is een landelijk werkend webdesignbureau dat websites bouwt voor technische en bouwbedrijven in Veghel en Meierijstad. Een website kost vanaf € 2.995, staat in twee weken live en is jouw eigendom. Voor Veghel bouwen we sites met twee routes: specificaties voor de inkoper op De Dubbelen, een lage drempel voor de particulier in Erp of Zijtaart.", "intro": "Veghel is een plaats van een paar duizend inwoners met de bedrijvigheid van een stad. Het is het economische zwaartepunt van Meierijstad en draait op food en logistiek: hoofdkantoren en distributiecentra van landelijke namen op De Dubbelen, met daaromheen een dichte laag toeleveranciers op Doornhoek in technische dienstverlening, transport, verpakking, machinebouw en installatiewerk. Dat is een B2B-markt met professionele inkoop. Een website haalt daar zelden de order binnen, maar bepaalt wel of je op de longlist komt.\n\nDe Noordkade is het andere gezicht van Veghel, en de kernen Erp, Zijtaart, Mariaheide en Eerde zijn een derde: een consumentenmarkt waar mond-tot-mond nog veel doet, maar waar de site het werk moet afmaken dat de aanbeveling begint. Veel Veghelse bedrijven bedienen beide markten tegelijk. Daarom bouwen wij hier sites met twee duidelijk gescheiden routes, vanaf € 2.995 en in twee weken live. Veghel is bovendien de enige van onze oude stadspagina's die echte vertoningen kreeg, en daarom is deze pagina gebleven en verdiept.", "sections": [{"h2": "Wat moet een website voor een Veghels bedrijf kunnen?", "body": "Als je levert aan bedrijven die zelf in processen en cijfers denken, moet je site dat ook doen. Concreet: geen vage claims maar specificaties, geen stockfoto's maar het werk zelf, en een aanvraagroute die de gegevens ophaalt die je nodig hebt om te offreren. Een aanvraag met maatvoering, aantallen en een termijn beantwoord je dezelfde dag. Een aanvraag met alleen een naam en 'graag contact' kost een week heen en weer voordat je weet of het past. Voor de consumentenkant in de kernen geldt bijna het omgekeerde. Iemand die op zaterdagochtend op de bank een uitbouw zit te bekijken, wil geen formulier van twaalf velden; die wil zien wat het ongeveer kost en dan pas praten. Dat zijn twee routes op dezelfde site, en het loont om ze allebei goed te maken."}, {"h2": "Voor welke bedrijven in Veghel bouwen we?", "body": "Vooral voor de technische en bouwbedrijven die zowel aan de industrie als aan particulieren leveren. Aannemers met werk in de kernen en in de naoorlogse wijken, met De Bunders als grootste vijver. Klusbedrijven in Erp, Zijtaart en Eerde, waar de site vaak de enige vindbare etalage is. Dakdekkers die bedrijfsdaken op De Dubbelen en Doornhoek doen naast particuliere daken in de wijken: twee heel verschillende klanten op één site. Zonweringbedrijven met een scherp seizoen, waarbij de site de piek moet aankunnen en het dal opvullen. Vloerenzaken voor woningen uit de jaren zeventig en tachtig die aan hun tweede vloer toe zijn. Voor de allergrootste partijen op De Dubbelen zelf, met een eigen inkoopafdeling, is dit een ander traject en daar zijn we eerlijk in als het niet past."}, {"h2": "Wat kost een website laten maken in Veghel?", "body": "Vanaf € 2.995 voor een zakelijke website, vanaf € 6.995 voor een website met CRM; beide als vaste prijs die vooraf vaststaat. Teksten, mobiel ontwerp, SEO-basis en formulieren zitten erin. Wat het bedrag bepaalt, is of er een configurator of een koppeling met je systeem in moet. Voor Veghelse bedrijven met een eigen ERP of offertepakket is die koppeling vaak de reden om het te doen: een aanvraag is gestructureerde data en die zetten we via een API door naar je CRM, je offertepakket of een e-mail in het format dat je wilt. Geen overtypen, geen dubbele invoer. Bij Installatieplatform ging de offerte zo van een avond rekenwerk naar twee minuten. In twintig minuten hoor je wat jouw situatie vraagt en wat dat kost."}, {"h2": "Heeft lokale vindbaarheid in Veghel zin?", "body": "Op de plaatsnaam alleen is het volume beperkt, en het zou oneerlijk zijn om te doen alsof dat anders is. De winst zit in de combinatie: wat je doet, plus waar je het doet, plus dat je in Meierijstad en de omliggende kernen ook gevonden wordt. We bouwen per dienst een pagina die diep genoeg is om te ranken en maken het werkgebied daarbinnen expliciet: Erp, Zijtaart, Mariaheide, Eerde, Schijndel en Sint-Oedenrode. Geen aparte dunne pagina per dorp, want die worden gecrawld en niet getoond. Daarnaast zetten we je Google Bedrijfsprofiel op orde, want voor een klusbedrijf of dakdekker in de kernen is dat vaak de eerste plek waar de klant kijkt. Prefab Select haalde met vindbaarheid, site en configurator als één keten 212 procent meer aanvragen."}], "features": [{"t": "Twee routes op één site", "d": "Specificaties en orderregel voor de inkoper, beeld en richtprijs voor de particulier in de kernen."}, {"t": "Vaste prijs vanaf € 2.995", "d": "Website met CRM vanaf € 6.995. Geen licentie per stoel, geen verrassingen."}, {"t": "Live in twee weken", "d": "Eerst de pagina's die verkopen, daarna de rest. Koppelingen bouwen we parallel."}, {"t": "Koppeling met je systeem", "d": "Aanvragen gaan via een API zonder overtypen naar je CRM of offertepakket."}, {"t": "Werkgebied Meierijstad", "d": "Erp, Zijtaart, Mariaheide en Eerde expliciet benoemd, zonder dunne dorpspagina's."}, {"t": "Jouw eigendom", "d": "Code, data en design zijn van jou. Langskomen kan."}], "faq": [{"q": "Wat kost een website laten maken in Veghel?", "a": "Een zakelijke website kost vanaf € 2.995 en een website met CRM vanaf € 6.995, als vaste prijs die vooraf vaststaat. Een koppeling met je eigen ERP of offertepakket, of een configurator, begrote n Bijsterhuizen"], "definition": "Next Growth is een landelijk werkend webdesignbureau dat websites bouwt voor bouw-, installatie- en dienstverlenende bedrijven in Nijmegen en de regio. Een website kost vanaf € 2.995, staat in twee weken live en is jouw eigendom. Westrik Bouw & Installaties uit Nijmegen staat live als voorbeeld: website, offerteaanvraag en SEO in één geheel.", "intro": "Nijmegen heeft een kritische markt: veel hoogopgeleide bewoners, een grote studentenstad en een techsector rond Winkelsteeg en de Novio Tech Campus die zelf weet hoe software werkt. Daar kom je niet weg met mooie praatjes, en dat is prima, want daar moeten wij het ook niet van hebben. Naast die kenniseconomie is er de gewone stad: bouwbedrijven, installateurs en hoveniers die werken voor Dukenburg, Lindenholt, de vooroorlogse wijken en de nieuwbouw in Lent en de Waalsprong.\n\nDie consumentenmarkt is groot en koopkrachtig, met veel verbouwvraag. De vooroorlogse woningen in Bottendaal en het Willemskwartier worden al twintig jaar aangepakt, en de Waalsprong levert een gestage stroom mensen die net verhuisd zijn en nog van alles willen. Voor die bedrijven valt de beslissing op de website. Wij bouwen die site vanaf € 2.995, in twee weken live, met een offerteaanvraag die compleet binnenkomt. Westrik Bouw & Installaties uit Nijmegen laat zien hoe bouw en installatie op één site staan zonder dat de bezoeker verdwaalt.", "sections": [{"h2": "Wat moet een website in Nijmegen anders doen?", "body": "Nijmegen is een stad waar mensen doorklikken. Er wordt vergeleken, gelezen en op prijs gelet zonder dat prijs alleen beslist. Wie een uitbouw in de Waalsprong of een dakkapel op de stuwwal wil, bekijkt drie sites, leest wat erop staat en beslist pas daarna wie hij belt. Voor een bouw- of installatiebedrijf betekent dat: wie een concreet antwoord geeft op wat iets ongeveer kost, wordt serieus genomen, en wie alleen 'neem contact op voor een vrijblijvende offerte' heeft, wordt overgeslagen. Het tweede punt is de techsector. In elke klantenkring zit hier wel iemand die weet hoe een site in elkaar zit. Dat is een reden om het goed te doen, niet om het duur te doen: schone code, snelle laadtijd, geen tracker-carrousel. Onze pagina's scoren 100 op toegankelijkheid en SEO, en dat kun je zelf nameten."}, {"h2": "Voor welke bedrijven in Nijmegen bouwen we?", "body": "In Nijmegen zit de vraag vooral bij bedrijven die aan bestaande woningen werken. Aannemers, want de vooroorlogse wijken worden al twintig jaar verbouwd en verbouwing en uitbouw zijn hier de kern. Kozijnenbedrijven, voor de vele woningen uit de jaren twintig tot vijftig met kozijnen die aan vervanging toe zijn. Dakdekkers met oude daken op de stuwwal en platte daken in Dukenburg en Lindenholt: twee verschillende verhalen op één site. Schilders, omdat de grote voorraad houten kozijnen en gevels structureel onderhoud vraagt. Klusbedrijven die uit de studentenstad en de Waalsprong veel kleinere opdrachten halen waar snelheid telt. En de zakelijke kant op Bijsterhuizen, Winkelsteeg en Mercator Science Park, waar de site een visitekaartje is dat tot in het detail moet kloppen voor partners, personeel en investeerders."}, {"h2": "Wat kost een website laten maken in Nijmegen?", "body": "Een zakelijke website kost vanaf € 2.995, een website met CRM vanaf € 6.995, als vaste prijs die vooraf vaststaat. Teksten, mobiel ontwerp, SEO-basis en een offerteaanvraag zitten erin. Wat het bedrag bepaalt, is of er een configurator of een koppeling met je systeem in moet. Een marketingsite die goed verkoopt is een ander bedrag dan een site die het offerteproces overneemt, en dat verschil is groter dan het verschil tussen bureaus. De topografie maakt een configurator hier interessanter dan elders: een dakopbouw op de stuwwal is een ander verhaal dan dezelfde dakopbouw in Lent, met andere fundering en andere welstand. De klant kiest zijn wijk aan het begin en krijgt de opties en richtprijs die daar gelden. In twintig minuten hoor je wat jouw situatie vraagt."}, {"h2": "Wat bouwden we al in Nijmegen?", "body": "Westrik Bouw & Installaties uit Nijmegen kreeg een website met offerteaanvraag en SEO. Westrik doet bouw én installatie, en de site laat zien hoe twee takken naast elkaar staan zonder dat de bezoeker verdwaalt: per dienst een eigen pagina, per werkgebied een eigen verhaal, en één aanvraagroute die compleet binnenkomt. Je kunt de site openen en de aanvraag zelf proberen. Dezelfde opzet leverde bij Prefab Select 212 procent meer aanvragen op en bij Installatieplatform een offerte in twee minuten in plaats van een avond rekenwerk. Inmiddels draaien er tien configurators live, van dakopbouw en aanbouw tot zwembad. Voor de site van Westrik en de 194 lokale pagina's die we voor onze eigen vindbaarheid bouwden, geldt hetzelfde: het is te controleren, niet alleen te lezen."}], "features": [{"t": "Gebouwd voor vergelijkers", "d": "Concreet over prijs, duur en werk, zodat je niet wordt overgeslagen door wie drie sites bekijkt."}, {"t": "Vaste prijs vanaf € 2.995", "d": "Website met CRM vanaf € 6.995. Geen licentie per gebruiker, geen verrassingen."}, {"t": "Live in twee weken", "d": "Eerst de pagina's die het geld verdienen, daarna de rest. Een configurator loopt parallel."}, {"t": "Schone code, 100 op toegankelijkheid", "d": "In een techstad ziet een deel van je publiek het als de site niet klopt. Nameetbaar in elke browser."}, {"t": "Stuwwal en Waalsprong apart", "d": "De klant kiest zijn wijk en krijgt de opties en richtprijs die daar gelden."}, {"t": "Jouw eigendom", "d": "Code, data en design zijn van jou, met een CMS naar keuze en toegang tot alles."}], "faq": [{"q": "Wat kost een website laten maken in Nijmegen?", "a": "Een zakelijke website kost vanaf € 2.995 en een website met CRM vanaf € 6.995, als vaste prijs die vooraf vaststaat. Een configurator of een koppeling met je systeem begroten we apart. In een strategiegesprek van twintig minuten hoor je wat er nodig is, wat het kost en wat het naar verwachting oplevert."}, {"q": "Hoe lang duurt het?", "a": "Een zakelijke website staat in twee weken live. We beginnen niet met een strategiedocument maar met de pagina's die het geld verdienen, en bouwen de rest daarna af. Zit er een configurator in, dan loopt die parallel: de site kan live terwijl de configurator wordt afgemaakt."}, {"q": "Wie is de eigenaar van de site?", "a": "Jij. Je krijgt de site in eigendom, met een CMS naar keuze en toegang tot alles: code, content, design en data. Teksten en beelden wijzig je zelf. Voor technisch werk kun je bij ons terecht zonder dat je vastzit aan een contract dat je niet kunt opzeggen."}, {"q": "Zitten jullie in Nijmegen?", "a": "Nee, we werken landelijk. Overleg gaat digitaal en we komen langs wanneer dat helpt. We werken hier wekelijks en komen langs wanneer dat nodig is. Dat is eerlijker dan een vestigingsadres huren om er lokaal uit te zien. Wat je aan een bureau hebt, hangt niet af van de postcode maar van of ze je markt kennen en opnemen als je belt."}, {"q": "Welk bedrijf uit Nijmegen hebben jullie een site gebouwd?", "a": "Westrik Bouw & Installaties: website, offerteaanvraag en SEO. Westrik doet bouw en installatie, en de site laat zien hoe twee takken op één site staan zonder dat de bezoeker verdwaalt. De site staat live, je kunt hem openen en de aanvraag zelf proberen om te zien hoe die binnenkomt."}, {"q": "Kan de site rekening houden met de stuwwal en de Waalsprong?", "a": "Ja. De klant kiest zijn plaats of wijk aan het begin, en daarmee de opties en richtprijs die daar gelden: andere fundering in Lent, andere welstand in de Benedenstad en op de Hunnerberg. Zo krijg je geen aanvraag voor iets wat op die plek niet kan, en scheelt het bezoeken aan klussen die je toch niet aanneemt."}], "cities": ["Nijmegen", "Lent", "Oosterhout", "Berg en Dal", "Malden", "Bemmel", "Beuningen", "Elst", "Groesbeek", "Wijchen"], "proof": "Westrik Bouw & Installaties uit Nijmegen staat live met website, offerteaanv o. Een website kost vanaf € 2.995, staat in twee weken live en is jouw eigendom. Den Bosch heeft een kritische zakelijke markt en een industriële westkant, en wij bouwen voor allebei, maar niet met dezelfde site.", "intro": "Den Bosch is een dienstenstad met een industriële rand. Als provinciehoofdstad zit er veel zakelijke en financiële dienstverlening, overheid, zorg en onderwijs, met een sterke binnenstad en een groeiende data- en techsector rond de campus. Voor die markt is een website vooral een geloofwaardigheidsvraag: wie hier een opdracht van vijf cijfers gunt, kijkt eerst of je site eruitziet alsof je die opdracht aankunt. Dat is een ontwerpvraag.\n\nAan de westkant ligt een andere stad. Op De Rietvelden en richting Empel en Maaspoort zit maakindustrie, groothandel, logistiek en de brede laag installateurs en bouwbedrijven die de regio bedient. Daar telt geloofwaardigheid ook, maar het beslissende moment is anders: de partij die als eerste een concreet antwoord geeft op wat iets kost en wanneer het kan, wint. Dat is wat een goed opgezette offerteflow doet. Wij bouwen voor beide markten, vanaf € 2.995 en in twee weken live, zonder stadstoeslag omdat je in de duurste binnenstad van Brabant zit.", "sections": [{"h2": "Wat gaat er in Den Bosch vaak mis met websites?", "body": "Den Bosch heeft een dure binnenstad en een kritische zakelijke markt, en daar hoort een probleem bij dat je in kleinere plaatsen minder ziet: de lat voor hoe iets eruitziet ligt hoog, en dat verleidt tot sites die mooi zijn en niets doen. Een site die er duur uitziet maar drie klikken nodig heeft voordat iemand weet wat je verkoopt, verliest van een simpelere site die dat in één scherm regelt. Wij ontwerpen daarom vanaf het doel: wat moet de bezoeker doen, en wat staat daartussen. Dat mag er uitstekend uitzien, zolang de vorm het doel dient. Voor zakelijke kopers geldt daarbij dat de beslissing niet op de site valt maar daarna, in een gesprek. De site moet dus zorgen dat je op de lijst komt en dat de aanvraag compleet binnenkomt, niet dat er ter plekke wordt afgerekend."}, {"h2": "Voor welke bedrijven in Den Bosch bouwen we?", "body": "Vooral voor bedrijven die aan huis en gebouw werken, want dat is de markt waar een prijsindicatie op de site het verschil maakt tussen een aanvraag en een gemiste klik. Aannemers, met veel vraag uit de stad en uit Rosmalen, Empel en Vught, waar verbouwing en uitbouw de boventoon voeren. Kozijnenbedrijven voor de vooroorlogse wijken en de naoorlogse schil, waar een maatconfigurator met de kleur tegen de gevel bezoeken scheelt. Dakdekkers met spoedwerk en gepland werk door elkaar, die de site moet scheiden. Zonweringbedrijven, seizoensgevoelig en visueel. Vloerenzaken waar het showroombezoek online begint. Daarnaast de zakelijke dienstverleners op De Brand en in de binnenstad, waar de site een geloofwaardigheidsvraag is en we klein en scherp bouwen in plaats van groot en compleet."}, {"h2": "Wat kost een website laten maken in Den Bosch?", "body": "Minder dan een bureau in de binnenstad en meer dan een sjabloon van het internet, maar dat is niet het nuttige antwoord. Het nuttige antwoord: een zakelijke website kost vanaf € 2.995, een website met CRM vanaf € 6.995, als vaste prijs die vooraf vaststaat. We rekenen geen stadstoeslag. Teksten, mobiel ontwerp, SEO-basis en formulieren zitten erin. Wat het bedrag bepaalt, is of er een configurator of een koppeling met je systeem in moet; een marketingsite is een ander bedrag dan een site die het offerteproces overneemt. Verwacht je klant in Den Bosch iets moois, dan maken we per keuze een render in plaats van een schuifje met een bedrag: het kozijn tegen de gevel, de vloer in de kamer. Het rekenwerk zit eronder, het beeld zit erop."}, {"h2": "Hoe richten we de regio rond Den Bosch in?", "body": "Den Bosch heeft een regiofunctie. Veel bedrijven hier werken net zo goed in Rosmalen, Vught, Berlicum, Vlijmen en Zaltbommel, en zoeken dus niet alleen op de stadsnaam. Een site die alleen op 'Den Bosch' is ingericht laat de helft van de vraag liggen. We bouwen de structuur daarom op wat je doet, met per dienst een pagina die diep genoeg is om te ranken, en maken het werkgebied daarbinnen expliciet. Niet met een aparte pagina per dorp: dunne pagina's die onderling bijna gelijk zijn, worden gecrawld en niet getoond, en dat heeft op ons eigen domein al eens aantoonbaar niets opgeleverd. Alleen voor plaatsen waar je echt een eigen verhaal hebt, maakt een eigen pagina zin. Een configurator krijgt het werkgebied mee: de klant vult zijn plaats in en de aanvraag landt met reistijd en richtprijs erbij."}], "features": [{"t": "Ontworpen vanaf het doel", "d": "Mooi mag, zolang de bezoeker in één scherm weet wat je verkoopt en wat hij moet doen."}, {"t": "Vaste prijs vanaf € 2.995", "d": "Website met CRM vanaf € 6.995. Geen stadstoeslag, geen licentie per gebruiker."}, {"t": "Live in twee weken", "d": "Eerst de pagina's die verkopen, daarna de rest. Een configurator loopt parallel."}, {"t": "Renders per keuze", "d": "Het kozijn tegen de gevel of de vloer in de kamer, voor een markt die op presentatie let."}, {"t": "Regio in de structuur", "d": "Rosmalen, Vught, Berlicum en Zaltbommel expliciet benoemd, zonder dunne dorpspagina's."}, {"t": "Jouw eigendom", "d": "Code, data en design zijn van jou. Langskomen kan."}], "faq": [{"q": "Wat kost een website laten maken in Den Bosch?", "a": "Een zakelijke website kost vanaf € 2.995 en een website met CRM vanaf € 6.995, als vaste prijs zonder stadstoeslag. Of er een configurator of een koppeling met je systeem in moet, bepaalt het uiteindelijke bedrag. In een gesprek van twintig minuten hoor je wat er in jouw geval nodig is en wat dat kost."}, {"q": "Hoe snel staat de site live?", "a": "In twee weken. Dat kan omdat we niet beginnen met een strategiedocument maar met de pagina's die het geld verdienen, en de rest daarna afbouwen. Als er een configurator in moet, loopt die parallel: de site kan live terwijl de configurator wordt afgebouwd, zodat je niet maanden wacht."}, {"q": "Wie is de eigenaar van de site?", "a": "Jij. Code, content, design en data zijn jouw eigendom, met alle toegangen op jouw naam. Geen licentie per gebruiker en geen contract waar je niet uit komt. Onderhoud is een los maandabonnement dat nooit verplicht is. Vertrek je, dan neem je alles mee en valt er niets om."}, {"q": "Wij werken in de hele regio, niet alleen in Den Bosch. Hoe richten jullie dat in?", "a": "Niet met een aparte pagina per dorp, want dunne pagina's die bijna gelijk zijn, worden niet getoond. We bouwen per dienst een pagina die diep genoeg is om te ranken en benoemen daarin Rosmalen, Vught, Berlicum, Vlijmen en Zaltbommel concreet. Alleen waar je echt een eigen verhaal hebt, krijgt een plaats een eigen pagina."}, {"q": "Onze klanten zijn zakelijk. Moet de site er dan anders uitzien?", "a": "Minder dan mensen denken: zakelijke kopers zijn ook mensen met een telefoon in de hand. Wat verschilt is het beslismoment. Bij een consument valt de beslissing op de site, bij een zakelijke koper daarna in een gesprek. De site moet dus zorgen dat je op de lijst komt en dat de aanvraag compleet binnenkomt."}, {"q": "Wordt een configurator geen goedkoop rekentooltje?", "a": "Daarom maken we per keuze een render in plaats van een schuifje met een bedrag. De klant ziet zijn kozijn tegen zijn gevel of zijn vloer in zijn kamer; het rekenwerk zit eronder. Er draaien nu tien configurators live, van dakopbouw tot zwembad, en je kunt ze zelf proberen voordat je iets beslist."}], "cities": ["Den Bosch", "Rosmalen", "Empel", "Engelen", "Nuland", "Vinkel", "Vught", "Vlijmen", "Sint-Michielsgestel", "Berlicum", "Kerkdriel"], "proof": "Tien configurators draaien live met renders per keuze; bij Installatieplatform ging de offerte van een avond rekenwerk naar twee minuten.", "internal_links": ["dienst-webdesign", "branche-bouwbedrijven", "lokaal-marketing-den-bosch"], "jsonld": {"@context": "https://schema.org", "@graph  goedkoop rekentooltje?", "acceptedAnswer": {"@type": "Answer", "text": "Daarom maken we per keuze een render in plaats van een schuifje met een bedrag. De klant ziet zijn kozijn tegen zijn gevel of zijn vloer in zijn kamer; het rekenwerk zit eronder. Er draaien nu tien configurators live, van dakopbouw tot zwembad, en je kunt ze zelf proberen voordat je iets beslist."}}]}, {"@type": "BreadcrumbList", "@id": "https://nextgrowthdigital.nl/lokaal-webdesign-den-bosch/#breadcrumb", "itemListElement": [{"@type": "ListItem", "position": 1, "name": "Home", "item": "https://nextgrowthdigital.nl/home"}, {"@type": "ListItem", "position": 2, "name": "Webdesign", "item": "https://nextgrowthdigital.nl/dienst-webdesign"}, {"@type": "ListItem", "position": 3, "name": "Website laten maken in Den Bosch", "item": "https://nextgrowthdigital.nl/lokaal-webdesign-den-bosch"}]}]}, "kort": {"wat": "Zakelijke website, ontworpen vanaf het doel, met renders", "waar": "Den Bosch en Rosmalen", "prijs": "vanaf € 2.995", "doorlooptijd": "live in twee weken", "voorwie": "bouw, kozijnen, zonwering, vloeren en zakelijke dienstverleners", "eigendom": "code, data en design zijn van jou"}}, "lokaal-webdesign-eindhoven": {"title": "Website laten maken Eindhoven vanaf € 2.995 | Next Growth", "description": "Website laten maken in Eindhoven, de drukste markt van Zuid-Nederland: win met betere antwoorden, niet met een mooiere homepage. Vanaf € 2.995.", "h1": "Website laten maken in Eindhoven", "keywords": ["website laten maken Eindhoven", "webdesign Eindhoven", "webdesign bureau Eindhoven", "website bouwen Eindhoven", "website aannemer Woensel", "dakopbouw configurator Eindhoven", "website De Hurk Ekkersrijt", "website laten maken Veldhoven"], "definition": "Next Growth is een landelijk werkend webdesignbureau dat websites bouwt voor bouw-, installatie- en technische bedrijven in Eindhoven en de regio. Een website kost vanaf € 2.995, staat in twee weken live en is jouw eigendom. In de drukste markt van ons werkgebied win je niet met een mooiere homepage maar met betere antwoorden, en daar bouwen we de site op.", "intro": "Eindhoven is de zwaarste markt van ons werkgebied. Er zitten meer bureaus dan waar ook in Zuid-Nederland, de lat voor ontwerp ligt hoog en de klant is technisch onderlegd. De campus, de toeleveranciers en de designtraditie bepalen de reputatie van de stad, en voor die markt is een website een streng beoordeeld visitekaartje: laadtijd, werkt het zonder muis, is de code schoon. Slordigheid is hier duurder dan elders.\n\nOnder die laag ligt een heel gewone stad met tweehonderdvijftigduizend inwoners en de bijbehorende vraag naar bouw, onderhoud en installatie. Woensel alleen al telt duizenden vrijwel identieke rijtjeswoningen uit de jaren zestig en zeventig, die al twee decennia worden verbouwd, geïsoleerd en van nieuwe kozijnen voorzien. Het probleem daar is niet de vraag maar de drukte: op elke zoekterm staan tien concurrenten en drie advertenties. Wij bouwen sites die in die drukte winnen met concrete antwoorden, vanaf € 2.995 en in twee weken live, zonder stadstoeslag.", "sections": [{"h2": "Hoe win je in Eindhoven tussen tien concurrenten en drie advertenties?", "body": "Niet met een betere homepage maar met betere antwoorden. Wie een dakopbouw in Woensel zoekt, wil weten of het bij zijn type woning kan, wat het ongeveer kost en hoe lang het duurt. De partij die dat op de site beantwoordt, krijgt de aanvraag; de partij met 'vraag een vrijblijvende offerte aan' krijgt de klik en verder niets. Dat is precies waarom wij met configurators zijn begonnen: niet als speeltje, maar omdat het de goedkoopste manier is om die vraag te beantwoorden zonder er zelf bij te zitten. Het tweede is lokale kennis. Eindhoven kent welstandsvrije gebieden in een deel van de naoorlogse wijken, terwijl in Philipsdorp, Drents Dorp en Lakerlopen een streng regime geldt. Een bouwbedrijf dat op zijn site uitlegt waar wat mag, wint vertrouwen bij precies de bezoeker die daarover twijfelt, en dat is nauwelijks te kopiëren."}, {"h2": "Voor welke bedrijven in Eindhoven bouwen we?", "body": "Vooral voor bedrijven die aan de naoorlogse woningvoorraad werken. Die is enorm, uniform en al twintig jaar in verbouwing: een markt met volume, maar ook met de meeste concurrentie. Aannemers die Woensel bedienen, de grootste herhalende verbouwmarkt van ons werkgebied. Kozijnenbedrijven, want de naoorlogse woningen zijn massaal aan hun tweede set kozijnen toe. Dakdekkers met platte daken in de naoorlogse wijken en pannendaken in de vooroorlogse buurten. Zonweringbedrijven, omdat grote uniforme rijen herhaalbaar werk en een sterke visuele verkoop betekenen. Vloerenzaken waar het showroombezoek vrijwel altijd online begint. En de technische bedrijven op De Hurk en Ekkersrijt, waar de site wordt gelezen door mensen die zien of de code klopt. Onze pagina's scoren 100 op toegankelijkheid en SEO, en dat kun je nameten met de tool die in elke browser zit."}, {"h2": "Wat kost een website laten maken in Eindhoven?", "body": "Hetzelfde als in de rest van ons werkgebied; we rekenen geen stadstoeslag. Een zakelijke website kost vanaf € 2.995 en een website met CRM vanaf € 6.995, als vaste prijs die vooraf vaststaat. Teksten, mobiel ontwerp, SEO-basis en formulieren zitten erin. Wat het bedrag bepaalt, is of er een configurator of koppeling in moet. Woensel maakt Eindhoven de beste plek in ons werkgebied voor een configurator: als tien klanten dezelfde woning hebben, is een dakopbouw of uitbouw geen maatwerk meer maar een keuze uit opties. De klant kiest zijn woningtype uit een korte lijst met foto's, de hoekwoning of de tussenwoning uit de jaren zestig, en krijgt alleen de opties en een richtprijs die daarop passen. Een aannemer hoeft dan niet meer voor elke aanvraag langs."}, {"h2": "Waarom een landelijk bureau als er hier tientallen zitten?", "body": "Omdat wij geen bureau zijn dat er een configurator bij doet, maar een bedrijf dat uit configurators en offertesystemen komt en daar de site omheen bouwt. Voor een marketingsite zonder rekenwerk zijn er in Eindhoven prima partijen dichterbij, en dat zeggen we liever meteen. Als je wilt dat je site het offerteproces overneemt en aan je systeem hangt, wordt de lijst een stuk korter. Het bewijs staat live: tien configurators, Prefab Select met 212 procent meer aanvragen, Installatieplatform met een offerte in twee minuten in plaats van een avond rekenwerk, en Lucky Zonwering op 5,0 op Google met 124 reviews. Het meeste overleg gaat digitaal en we komen langs wanneer het nodig is. Het meeste overleg gaat digitaal en we komen langs wanneer het nodig is. Wil je een bureau dat elke week aanschuift, dan zijn wij niet de juiste keuze."}], "features": [{"t": "Betere antwoorden, geen mooiere homepage", "d": "Kan het bij mijn woningtype, wat kost het, hoe lang duurt het: de site beantwoordt het zelf."}, {"t": "Vaste prijs vanaf € 2.995", "d": "Website met CRM vanaf € 6.995. Geen stadstoeslag, geen licentie per gebruiker."}, {"t": "Live in twee weken", "d": "Eerst de pagina's die verkopen, daarna de rest. Een configurator loopt parallel."}, {"t": "Woningtype herkennen", "d": "De klant kiest zijn Woensel-type uit foto's en krijgt alleen de opties die erbij passen."}, {"t": "Welstand aan het begin", "d": "Philipsdorp of welstandsvrij: de configurator maakt het onderscheid voordat de aanvraag strandt."}, {"t": "Jouw eigendom", "d": "Code, data en design zijn van jou. Schone code die een technisch publiek kan nameten."}], "faq": [{"q": "Wat kost een website laten maken in Eindhoven?", "a": "Hetzelfde als in de rest van ons werkgebied: een zakelijke website vanaf € 2.995 en een website met CRM vanaf € 6.995, als vaste prijs zonder stadstoeslag. Een configurator of koppeling begroten we apart. In twintig minuten hoor je wat er in jouw geval nodig is en wat dat kost."}, {"q": "Hoe lang duurt het?", "a": "Een zakelijke website staat in twee weken live. We beginnen met de pagina's die het geld verdienen en bouwen de rest daarna af. Een configurator loopt parallel aan de site, zodat de livegang er niet op hoeft te wachten en je niet maanden zonder werkende site zit."}, {"q": "Wie is de eigenaar van de site?", "a": "Jij. Code, content, design en data zijn jouw eigendom, met alle toegangen op jouw naam. Geen licentie per gebruiker en geen contract waar je niet uit komt. Onderhoud is een los maandabonnement dat nooit verplicht is. Vertrek je, dan neem je alles mee."}, {"q": "Er zitten in Eindhoven tientallen bureaus. Waarom jullie?", "a": "Omdat wij uit configurators en offertesystemen komen en daar de site omheen bouwen. Voor een marketingsite zonder rekenwerk zijn er hier prima partijen dichterbij. Wil je dat je site het offerteproces overneemt en aan je systeem hangt, dan wordt de lijst kort. Tien configurators draaien live als bewijs."}, {"q": "Onze klanten zijn technisch. Zien ze het als de site niet klopt?", "a": "Ja, en dat is in deze stad geen theorie. Laadtijd, toegankelijkheid en schone code zijn zichtbaar voor een deel van je publiek. Onze pagina's scoren 100 op toegankelijkheid en SEO, en dat is geen marketingclaim maar iets wat je zelf nameet met de tool die in elke browser zit."}, {"q": "Kan een configurator het woningtype in Woensel herkennen?", "a": "De klant kiest het type uit een korte lijst met foto's: de hoekwoning, de tussenwoning uit de jaren zestig, het type met de uitbouw aan de achterzijde. Daarna krijgt hij alleen de opties en de richtprijs die daarop passen. Voor een markt met zoveel gelijke woningen is dat de snelste weg naar een aanvraag die klopt."}], "cities": ["Eindhoven", "Veldhoven", "Nuenen", "Geldrop", "Son en Breugel", "Best", "Helmond"], "proof": "Tien configurators draaien live; Prefab Select haalde 212 procent meer aanvragen en Installatieplatform maakt een offerte in twee minuten in plaats van een avond rekenwerk.", "internal_links": ["dienst-webdesign", "branche-bouwbedrijven", "lokaal-marketing-eindhoven"], "jsonld": {"@con
