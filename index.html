t je doet.", "intro": "Arnhem is provinciehoofdstad, energiestad en modestad tegelijk. Op Industriepark Kleefse Waard en Arnhems Buiten, het voormalige KEMA-terrein, zit een concentratie van energie- en cleantechbedrijven, en de kunsthogeschool levert al generaties ontwerpers. Dat maakt dat de lat voor vormgeving hier hoog ligt, en dat mensen het zien als je die lat niet haalt. Een lelijke site is in deze stad een echt nadeel.\n\nOnder die laag zit een grote, gewone markt: bouwbedrijven, installateurs, dakdekkers en hoveniers die werken voor een woningvoorraad die om onderhoud vraagt. De vooroorlogse wijken Sint Marten, Klarendal en het Spijkerkwartier worden al jaren aangepakt, de jaren-dertig wijken tegen de Veluwezoom hebben grote tuinen, en ten zuiden van de Rijn zijn Malburgen en Schuytgraaf de afgelopen twintig jaar sterk vernieuwd. Voor die bedrijven is de website de belangrijkste verkoper die ze hebben. Wij bouwen hem vanaf € 2.995, in twee weken live, en we werken wekelijks in Arnhem.", "sections": [{"h2": "Wat moet een website in Arnhem anders doen?", "body": "In een stad met deze ontwerptraditie is een lelijke site een nadeel, maar een mooie site zonder richting is dat net zo goed. Het vaakst zien we hier het tweede: veel wit, grote foto's, een sfeervolle openingszin, en pas na drie schermen iets concreets. Dat is geen ontwerp maar uitstel. Wij ontwerpen vanaf de vraag wat de bezoeker moet doen en wat daartussen staat, en dat mag er uitstekend uitzien zolang de vorm het doel dient en niet andersom. Onze pagina's halen 100 op toegankelijkheid en SEO en laden snel, en dat gaat prima samen met een ontwerp dat er scherp uitziet. Die twee sluiten elkaar niet uit; ze worden alleen zelden allebei goed gedaan. Een configurator moet hier ook tegen de lat kunnen: een lelijk rekentooltje op een site in Arnhem kost geloofwaardigheid."}, {"h2": "Voor welke bedrijven in Arnhem bouwen we?", "body": "Vooral voor bedrijven die aan de bestaande woningvoorraad werken. Die is oud, gevarieerd en ligt deels op een helling, en dat maakt goed uitleggen wat je doet belangrijker dan elders. Aannemers, want de vooroorlogse wijken en de jaren-dertig buurten leveren een gestage stroom verbouwwerk op. Dakdekkers met oude pannendaken op de hellingen en platte daken in de naoorlogse wijken, die de site allebei moet aankunnen. Schilders, omdat een grote voorraad houten gevels en kozijnen structureel onderhoudswerk betekent. Kozijnenbedrijven voor vooroorlogse woningen met enkel glas en jaren-dertig panden waar de detaillering telt. Hoveniers en verandabouwers die op de hellingen boven de stad met keerwanden en niveauverschil te maken hebben. En vloerenzaken in een koopkrachtige markt in de noordelijke wijken, waar showroombezoek online begint."}, {"h2": "Wat kost een website laten maken in Arnhem?", "body": "Een zakelijke website kost vanaf € 2.995 en een website met CRM vanaf € 6.995, als vaste prijs die vooraf vaststaat. Teksten, mobiel ontwerp, SEO-basis en formulieren zitten erin. Wat het bedrag bepaalt, is of er een configurator of een koppeling met je systeem in moet; een marketingsite is een ander bedrag dan een site die het offerteproces overneemt. Het hoogteverschil is de reden dat een configurator hier meer oplevert dan elders. Wie op de hellingen boven de stad een overkapping of tuinmuur wil, heeft met keerwanden te maken; wie ten zuiden van de Rijn werkt, met vlakke kavels. Een configurator die die situatie aan het begin uitvraagt, geeft een richtprijs die klopt en een aanvraag die niet na het eerste bezoek opnieuw begint. Dat scheelt de hovenier precies de ritten die hier het duurst zijn."}, {"h2": "Waarom werkt de tweedeling van Arnhem in je voordeel?", "body": "Arnhem valt sterk in tweeën. Wie op de hellingen boven de stad werkt, heeft met hoogteverschillen, keerwanden en grote tuinen te maken; wie ten zuiden van de Rijn werkt, met vlakke percelen, rivierklei en een andere woningvoorraad. Bedrijven die dat onderscheid op hun site maken, krijgen aanvragen die beter passen. Dat scheelt vooral tijd: minder bezoeken aan klussen die je toch niet aanneemt. Hetzelfde geldt voor het werkgebied eromheen: Oosterbeek, Velp, Westervoort, Huissen, Elst en Duiven zoeken op hun eigen plaatsnaam. We benoemen dat werkgebied expliciet in de structuur, zonder een dunne pagina per dorp. Het bewijs dat deze aanpak werkt, staat live: tien configurators, Prefab Select met 212 procent meer aanvragen en Installatieplatform met een offerte in twee minuten."}], "features": [{"t": "Vorm die het doel dient", "d": "Scherp ontwerp dat binnen één scherm vertelt wat je doet, in een stad die vormgeving ziet."}, {"t": "Vaste prijs vanaf € 2.995", "d": "Website met CRM vanaf € 6.995. Geen licentie per gebruiker, geen verrassingen."}, {"t": "Live in twee weken", "d": "Eerst de pagina's die verkopen, daarna de rest. Een configurator loopt parallel."}, {"t": "Helling of vlak aan het begin", "d": "De klant geeft niveauverschil en maat op; de richtprijs klopt en het eerste bezoek is geen tweede intake."}, {"t": "100 op toegankelijkheid en SEO", "d": "Snelle, nette pagina's die een kritisch publiek kan nameten."}, {"t": "Jouw eigendom", "d": "Code, data en design zijn van jou. We werken wekelijks in Arnhem."}], "faq": [{"q": "Wat kost een website laten maken in Arnhem?", "a": "Een zakelijke website kost vanaf € 2.995 en een website met CRM vanaf € 6.995, als vaste prijs die vooraf vaststaat. Of er een configurator of een koppeling met je systeem in moet, bepaalt het uiteindelijke bedrag. In twintig minuten hoor je wat er in jouw geval nodig is en wat dat kost."}, {"q": "Hoe lang duurt het voordat we live zijn?", "a": "Twee weken. We beginnen met de pagina's die het geld verdienen en bouwen de rest daarna af. Zit er een configurator in, dan loopt dat parallel: de site kan live terwijl de configurator wordt afgemaakt. Je zit dus niet maanden te wachten op een site die er al had kunnen staan."}, {"q": "Wie is de eigenaar van de site?", "a  een concentratie van bedrijven in diervoeding, genetica en voedingstechnologie die internationaal werkt. Daaromheen ligt de laag die dat mogelijk maakt: machinebouw, technische dienstverlening, transport, installatie en onderhoud.\n\nSinds 1 januari 2022 zijn Boxmeer, Cuijk, Grave, Mill en Sint Hubert en Sint Anthonis één gemeente. Voor een bedrijf uit Cuijk is het thuisgebied daarmee van één kern naar tientallen kernen gegroeid, van Beugen tot Escharen. Veel lokale sites lopen daar nog op achter: ze noemen alleen Cuijk, terwijl de klant in Haps of Vianen op zijn eigen plaatsnaam zoekt. Dat is laaghangend fruit dat opvallend vaak blijft hangen. Wij bouwen de site die dat werkgebied wel meeneemt, vanaf € 2.995 en in twee weken live.", "sections": [{"h2": "Wat moet een website in Cuijk kunnen?", "body": "Voor bedrijven die aan de agrifoodsector leveren geldt: je site wordt gelezen door inkopers die technisch onderlegd zijn en weinig geduld hebben. Wat werkt is specificatie boven sfeer: wat je maakt, in welke tolerantie, met welke certificering en binnen welke termijn. Een aanvraagroute die die gegevens meteen ophaalt, scheelt een week heen en weer, en dat is in deze markt vaak het verschil tussen wel of niet meedoen. Voor de bedrijven die particulieren bedienen is het andere uiterste waar. Die klant zit in Cuijk, Haps of Beers, zoekt op zijn eigen plaatsnaam en beslist grotendeels op de site. Daar telt of je concreet bent: wat kost het ongeveer, hoe lang duurt het, heb je dit eerder gedaan bij een woning die op de mijne lijkt. De meeste concurrenten hier stoppen bij 'vraag vrijblijvend een offerte aan'."}, {"h2": "Voor welke bedrijven in Land van Cuijk bouwen we?", "body": "Voor bedrijven die zowel particulier als zakelijk werk doen, en die combinatie vraagt om een site met twee duidelijk gescheiden routes. Aannemers met naoorlogse wijken die aan uitbreiding toe zijn en oudere linten langs de Maas met ander werk. Dakdekkers die bedrijfsdaken op Laarakker en De Beijerd doen naast particuliere daken in de kernen. Klusbedrijven, want in de kernen bepaalt snelheid van reageren de opdracht. Kozijnenbedrijven voor een naoorlogse voorraad die massaal aan vervanging toe is. Schilders met onderhoudswerk dat structureel terugkomt en een duidelijk seizoenspatroon heeft. En de toeleveranciers op Laarakker, De Beijerd en De Haven die aan de voedingsmiddelenindustrie leveren: daar bouwen we een rekenmodule zonder sfeerbeeld, met specificaties, staffels, levertijd en een aanvraag die de inkoper als orderregel kan doorzetten."}, {"h2": "Wat kost een website laten maken in Cuijk?", "body": "Een zakelijke website kost vanaf € 2.995 en een website met CRM vanaf € 6.995, als vaste prijs die vooraf vaststaat. Teksten, mobiel ontwerp, SEO-basis en formulieren zitten erin. Wat het bedrag bepaalt, is of er een configurator of een koppeling met je systeem in moet; een marketingsite is een ander bedrag dan een site die het offerteproces overneemt. Voor Cuijk bouwen we twee varianten van dezelfde configurator. De zakelijke voor Laarakker: richtprijs uit je eigen staffelmodel, aanvraag als orderregel. De particuliere voor de kernen: beeld per keuze en een richtprijs inclusief montage. Hetzelfde principe, een ander gezicht. Bij Installatieplatform ging de offerte zo van een avond rekenwerk naar twee minuten. In twintig minuten hoor je wat jouw situatie vraagt en je zit daarna nergens aan vast."}, {"h2": "Wat betekent de gemeente Land van Cuijk voor je site?", "body": "Vooral dat je werkgebied groter is dan je site waarschijnlijk laat zien. Mensen in Haps, Vianen, Katwijk, Beers of Linden zoeken nog steeds op hun eigen kern, dus het loont om die kernen concreet te benoemen. Niet met een pagina per dorp, want dunne pagina's die bijna gelijk zijn, worden gecrawld en niet getoond. Wel als expliciet werkgebied binnen je dienstpagina's, met echte voorbeelden uit die kernen. Een configurator neemt het werkgebied mee: de klant vult zijn plaats in en de aanvraag komt binnen met afstand en plaats erbij. Voor de kozijnenbedrijven die de naoorlogse voorraad vervangen en de dakdekkers die bedrijfsdaken én particuliere daken doen, is dat het verschil tussen een aanvraag uit Cuijk en een aanvraag uit het hele Land van Cuijk."}], "features": [{"t": "Twee routes op één site", "d": "Specificaties en orderregel voor de inkoper op Laarakker, beeld en richtprijs voor de kernen."}, {"t": "Vaste prijs vanaf € 2.995", "d": "Website met CRM vanaf € 6.995. Geen licentie per gebruiker, geen verrassingen."}, {"t": "Live in twee weken", "d": "Eerst de pagina's die verkopen, daarna de rest. Een configurator loopt parallel."}, {"t": "Heel Land van Cuijk als werkgebied", "d": "Haps, Beers, Katwijk, Vianen en Linden expliciet benoemd, zonder dunne dorpspagina's."}, {"t": "Rekenmodule voor inkopers", "d": "Richtprijs uit je eigen staffelmodel, aanvraag als orderregel in je systeem."}, {"t": "Jouw eigendom", "d": "Code, data en design zijn van jou. Langskomen kan."}], "faq": [{"q": "Wat kost een website laten maken in Cuijk?", "a": "Een zakelijke website kost vanaf € 2.995 en een website met CRM vanaf € 6.995, als vaste prijs die vooraf vaststaat. Een configurator of rekenmodule voor inkopers begroten we apart. In een gesprek van twintig minuten hoor je wat er in jouw geval nodig is en wat dat kost, en je zit daarna nergens aan vast."}, {"q": "Hoe lang duurt het?", "a": "Een zakelijke website staat in twee weken live. We beginnen met de pagina's die aanvragen opleveren en bouwen de rest daarna af. Een configurator of koppeling met je systeem loopt parallel, zodat de livegang er niet op hoeft te wachten. Grotere systemen leveren we in fases op."}, {"q": "Wie is de eigenaar van de site?", "a": "Jij. Code, content, design en data zijn jouw eigendom, met alle toegangen op jouw naam. Geen licentie per gebruiker, geen contract waar je niet uit komt. Onderhoud is een los maandabonnement dat nooit verplicht is. Vertrek je, dan neem je alles mee en valt er nie tps://nextgrowthdigital.nl/lokaal-webdesign-cuijk/#breadcrumb", "itemListElement": [{"@type": "ListItem", "position": 1, "name": "Home", "item": "https://nextgrowthdigital.nl/home"}, {"@type": "ListItem", "position": 2, "name": "Webdesign", "item": "https://nextgrowthdigital.nl/dienst-webdesign"}, {"@type": "ListItem", "position": 3, "name": "Website laten maken in Cuijk", "item": "https://nextgrowthdigital.nl/lokaal-webdesign-cuijk"}]}]}, "kort": {"wat": "Zakelijke website met route voor inkoper en particulier", "waar": "Cuijk en Land van Cuijk", "prijs": "vanaf € 2.995", "doorlooptijd": "live in twee weken", "voorwie": "toeleveranciers, bouw, daken, kozijnen en klusbedrijven", "eigendom": "code, data en design zijn van jou"}}, "lokaal-webdesign-grave": {"title": "Website laten maken Grave vanaf € 2.995 | Next Growth", "description": "Website laten maken in Grave: een moderne site valt hier meteen op en laat een klein bedrijf meedoen in een groter gebied. Vanaf € 2.995, in twee weken.", "h1": "Website laten maken in Grave", "keywords": ["website laten maken Grave", "webdesign Grave", "website klusbedrijf Grave", "website bouwen Grave", "website laten maken Velp Escharen Gassel", "webdesign Land van Cuijk", "website eenmanszaak Grave", "schutting configurator"], "definition": "Next Growth is een landelijk werkend webdesignbureau dat websites bouwt voor kleine bouw- en technische bedrijven in Grave en de kernen Velp, Escharen en Gassel. Een website kost vanaf € 2.995, staat in twee weken live en is jouw eigendom. In een kleine plaats is een moderne, concrete site de goedkoopste voorsprong die er is, omdat de concurrentie er vaak nog geen heeft.", "intro": "Grave is klein, en dat is online een handicap en een kans tegelijk. Een handicap omdat het zoekvolume op de plaatsnaam beperkt is. Een kans omdat je concurrentie hier vaak nog helemaal geen fatsoenlijke site heeft. Het bedrijfsleven bestaat grotendeels uit kleine ondernemingen: bouw- en installatiebedrijven, ambacht, detailhandel, horeca en een flinke laag zelfstandigen. Het enige echte bedrijventerrein is Wisseveld aan de noordkant, en verder zit de bedrijvigheid verspreid over de vestingstad en de kernen Velp, Escharen en Gassel.\n\nDe eerlijkste analyse is hier ook de nuttigste: op 'Grave' alleen ga je het niet redden, want het volume is er simpelweg niet. Wat wel werkt is meedoen in een groter gebied op de dienst die je levert, en lokaal winnen waar dat wél telt: bij mensen die je naam al hoorden en je opzoeken. Daar bouwen wij de site voor, vanaf € 2.995 en in twee weken live. Veel bedrijven in Grave hebben een site uit 2015 of alleen een pagina op een verzamelsite; daartussen valt een snelle, concrete site meteen op.", "sections": [{"h2": "Levert een website in Grave genoeg op?", "body": "Op de plaatsnaam alleen niet, en het zou oneerlijk zijn om iets anders te beweren. Waar het wel loont: je concurrentie hier heeft vaak nog geen goede site, dus de voorsprong is goedkoop te pakken. Een moderne site die snel laadt, op de telefoon werkt en concreet is over wat je doet, valt in dat veld meteen op. Dat is de goedkoopste voorsprong die er is, en hij is nergens zo makkelijk te pakken als in een kleine markt. Daarnaast is je werkgebied groter dan de plaats. Sinds 2022 hoort Grave bij de gemeente Land van Cuijk, en Cuijk en Wijchen liggen binnen twintig minuten. Er is dus genoeg vraag om op mee te doen, zolang je site niet alleen 'Grave' zegt maar de dienst centraal zet en het werkgebied concreet benoemt."}, {"h2": "Voor welke bedrijven in Grave bouwen we?", "body": "Vooral voor kleinere bouw- en technische bedrijven. Daar is de website vaak de enige verkoper, en dus telt hij zwaarder dan bij een bedrijf met een buitendienst. Klusbedrijven zijn de grootste groep: kleine bedrijven waarvoor de site de enige etalage is. Aannemers met werk in de naoorlogse wijken buiten de vesting en in de kernen. Schilders, want de vestingstad heeft veel oud houtwerk met onderhoud dat blijft terugkomen. Dakdekkers met oude daken binnen de wallen en gewone particuliere daken erbuiten. Vloerenzaken in een kleine markt waar online zichtbaarheid het verschil maakt met de zaak in Cuijk. En de horeca en detailhandel binnen de wallen, waar bezoekers zoeken op wat er te doen is en niet op een bedrijfsnaam. Wie in dat moment niet gevonden wordt, bestaat niet."}, {"h2": "Wat kost een website laten maken in Grave?", "body": "Een zakelijke website kost vanaf € 2.995 en een website met CRM vanaf € 6.995, als vaste prijs die vooraf vaststaat. Voor een klein bedrijf met een duidelijke dienst is dit een compacter project dan voor een bedrijf met tien diensten en een configurator, en dat zie je terug in wat er nodig is. Teksten, mobiel ontwerp, SEO-basis en een contactroute zitten er standaard in. Heb je al een site maar is die oud, dan is vervangen meestal niet de duurste keuze: een site van tien jaar oud stapelen met reparaties kost vaak meer dan opnieuw beginnen op een snelle basis, en je houdt de beperkingen. We kijken er eerst naar voordat we iets adviseren; soms is een grondige opknapbeurt genoeg. In twintig minuten hoor je wat jouw situatie vraagt."}, {"h2": "Loont een configurator voor een eenmanszaak in Grave?", "body": "Als het product uit keuzes bestaat wel. Een schutting, een dakkapel of een traprenovatie heeft drie tot vijf keuzes die de prijs bepalen, en dat is precies wat een kleine configurator aankan. De klant kiest maat, materiaal en uitvoering, ziet een beeld per keuze en een richtprijs, en jij krijgt een aanvraag die compleet binnenkomt terwijl je op de bouw staat. Daarmee heeft een klusbedrijf uit Grave of Velp iets wat de grotere concurrent in Cuijk of Nijmegen vaak niet heeft. Hij hoeft niet groot te zijn: drie of vier keuzes is voor een klusbedrijf of schilder genoeg. Het rekenmodel komt van jou; de rest bouwen wij. Hij kost minder dan een jaar advertenties en werkt daarna elke dag. Er draaien er nu tien live, van overkapping tot zwembad, en je kunt ze zelf proberen."}], "features": [{"t": "Meteen opvallen in een kleine markt", "d": "Snel, mobiel en concreet, tussen sites uit 2015 en vermeldingen op verzamelsites."}, {"t": "Vaste prijs vanaf € 2.995", "d": "Website met CRM vanaf € 6.995. Compact project voor een klein bedrijf met een duidelijke dienst."}, {"t": "Live in twee weken", "d": "Eerst de pagina's die verkopen, daarna de rest. Geen traject van maanden."}, {"t": "Groter werkgebied dan Grave", "d": "Land van Cuijk en Wijchen binnen twintig minuten, expliciet in de structuur."}, {"t": "Kleine configurator", "d": "Schutting, dakkapel of traprenovatie: drie tot vijf keuzes, beeld en richtprijs."}, {"t": "Jouw eigendom", "d": "Code, data en design zijn van jou. Langskomen kan."}], "faq": [{"q": "Wat kost een website laten maken in Grave?", "a": "Een zakelijke website kost vanaf € 2.995 en een website met CRM vanaf € 6.995, als vaste prijs die vooraf vaststaat. Voor een klein bedrijf met een duidelijke dienst is dit een compacter project. In een gesprek van twintig minuten hoor je wat er in jouw geval nodig is en wat dat kost; je zit daarna nergens aan vast."}, {"q": "Hoe lang duurt het?", "a": "Een zakelijke website staat in twee weken live. We beginnen met de pagina's die aanvragen opleveren en bouwen de rest daarna af. Een kleine configurator loopt parallel, dus die hoeft de livegang niet op te houden. Voor een klein bedrijf is het meestal een kort en overzichtelijk traject."}, {"q": "Wie is de eigenaar van de site?", "a": "Jij. Code, content, design en data zijn jouw eigendom, met alle toegangen op jouw naam. Geen licentie per gebruiker, geen contract waar je niet uit komt. Onderhoud is een los maandabonnement dat nooit verplicht is. Vertrek je, dan neem je alles mee en valt er niets om."}, {"q": "Grave is klein. Levert een website hier genoeg op?", "a": "Op de plaatsnaam alleen niet, en dat zeggen we eerlijk. Waar het wel loont: je concurrentie hier heeft vaak nog geen goede site, dus de voorsprong is goedkoop. En je werkgebied is groter dan de plaats, met Land van Cuijk eromheen en Cuijk en Wijchen binnen twintig minuten."}, {"q": "Wij zitten in Velp, Escharen of Gassel. Maakt dat uit voor de site?", "a": "Voor de vindbaarheid wel: mensen zoeken op hun eigen kern, dus het loont om die kernen concreet te benoemen. Wat niet loont is voor elke kern een aparte pagina maken; dat zijn dunne pagina's die op elkaar lijken, en dat werkt inmiddels averechts. We benoemen het werkgebied binnen je dienstpagina's."}, {"q": "Wij hebben al een site, maar die is oud. Vervangen of aanpassen?", "a": "Meestal vervangen, en dat is niet de duurste keuze zoals mensen denken. Een site van tien jaar oud stapelen met reparaties kost vaak meer dan opnieuw beginnen op een snelle basis, en je houdt de beperkingen. We kijken er eerst naar voordat we adviseren; soms is een grondige opknapbeurt inderdaad genoeg."}], "cities": ["Grave", "Velp", "Escharen", "Gassel", "Ravenstein", "Wijchen", "Herpen", "Schaijk", "Zeeland", "Mill", "Cuijk"], "proof": "Tien configurators draaien live, ook kleine varianten met drie tot vijf keuzes; Lucky Zonwering staat met configurator en CRM op 5,0 op Google met 124 reviews.", "internal_links": ["dienst-webdesign", "branche-bouwbedrijven", "lokaal-webdesign-cuijk"], "jsonld": {"@context": "https://schema.org", "@graph": [{"@type": "WebPage", "@id": "https://nextgrowthdigital.nl/lokaal-webdesign-grave/#webpage", "url": "https://nextgrowthdigital.nl/lokaal-webdesign-grave", "name": "Website laten maken Grave vanaf € 2.995 | Next Growth", "description": "Website laten maken in Grave: een moderne site valt hier meteen op en laat een klein bedrijf meedoen in een groter gebied. Vanaf € 2.995, in twee weken.", "inLanguage": "nl-NL", "isPartOf": {"@id": "https://nextgrowthdigital.nl/#website"}, "about": {"@id": "https://nextgrowthdigital.nl/#organization"}, "breadcrumb": {"@id": "https://nextgrowthdigital.nl/lokaal-webdesign-grave/#breadcrumb"}}, {"@type": "Service", "@id": n de site?", "acceptedAnswer": {"@type": "Answer", "text": "Jij. Code, content, design en data zijn jouw eigendom, met alle toegangen op jouw naam. Geen licentie per gebruiker, geen contract waar je niet uit komt. Onderhoud is een los maandabonnement dat nooit verplicht is. Vertrek je, dan neem je alles mee en valt er niets om."}}, {"@type": "Question", "name": "Grave is klein. Levert een website hier genoeg op?", "acceptedAnswer": {"@type": "Answer", "text": "Op de plaatsnaam alleen niet, en dat zeggen we eerlijk. Waar het wel loont: je concurrentie hier heeft vaak nog geen goede site, dus de voorsprong is goedkoop. En je werkgebied is groter dan de plaats, met Land van Cuijk eromheen en Cuijk en Wijchen binnen twintig minuten."}}, {"@type": "Question", "name": "Wij zitten in Velp, Escharen of Gassel. Maakt dat uit voor de site?", "acceptedAnswer": {"@type": "Answer", "text": "Voor de vindbaarheid wel: mensen zoeken op hun eigen kern, dus het loont om die kernen concreet te benoemen. Wat niet loont is voor elke kern een aparte pagina maken; dat zijn dunne pagina's die op elkaar lijken, en dat werkt inmiddels averechts. We benoemen het werkgebied binnen je dienstpagina's."}}, {"@type": "Question", "name": "Wij hebben al een site, maar die is oud. Vervangen of aanpassen?", "acceptedAnswer": {"@type": "Answer", "text": "Meestal vervangen, en dat is niet de duurste keuze zoals mensen denken. Een site van tien jaar oud stapelen met reparaties kost vaak meer dan opnieuw beginnen op een snelle basis, en je houdt de beperkingen. We kijken er eerst naar voordat we adviseren; soms is een grondige opknapbeurt inderdaad genoeg."}}]}, {"@type": "BreadcrumbList", "@id": "https://nextgrowthdigital.nl/lokaal-webdesign-grave/#breadcrumb", "itemListElement": [{"@type": "ListItem", "position": 1, "name": "Home", "item": "https://nextgrowthdigital.nl/home"}, {"@type": "ListItem", "position": 2, "name": "Webdesign", "item": "https://nextgrowthdigital.nl/dienst-webdesign"}, {"@type": "ListItem", "position": 3, "name": "Website laten maken in Grave", "item": "https://nextgrowthdigital.nl/lokaal-webdesign-grave"}]}]}, "kort": {"wat": "Compacte zakelijke website die in een kleine markt opvalt", "waar": "Grave, Velp, Escharen en Gassel", "prijs": "vanaf € 2.995", "doorlooptijd": "live in twee weken", "voorwie": "klusbedrijven, aannemers, schilders, dakdekkers en zelfstandigen", "eigendom": "code, data en design zijn van jou"}}, "lokaal-webdesign-vught": {"title": "Website laten maken Vught vanaf € 2.995 | Next Growth", "description": "Website laten maken in Vught, een markt die op vertrouwen koopt en niet op de laagste prijs. Past bij grote woningen, vanaf € 2.995, live in twee weken.", "h1": "Website laten maken in Vught", "keywords": ["website laten maken Vught", "webdesign Vught", "webdesign bureau Vught", "website bouwen Vught", "website aannemer Vught", "website zwembadbouwer Vught", "website laten maken Helvoirt Cromvoirt", "zwembad configurator"], "definition": "Next Growth is een landelijk werkend webdesignbureau dat websites bouwt voor bedrijven die in Vught, Helvoirt en Cromvoirt aan huis en tuin werken. Een website kost vanaf € 2.995, staat in twee weken live en is jouw eigendom. Vught koopt niet op de laagste prijs maar op vertrouwen, en de site moet daarom kwaliteit uitstralen in plaats van scherpte in prijs.", "intro": "Vught heeft weinig industrie en veel koopkracht. Dat maakt het een ongewone markt: het geld zit hier niet op een bedrijventerrein maar achter de voordeuren, en dat verandert waar een website voor moet dienen. Er is één bescheiden bedrijventerrein aan de Industrieweg; de rest van het bedrijfsleven bestaat uit zorg, onderwijs, zakelijke dienstverlening en een groot aantal zelfstandigen en adviesbureaus die vanuit huis of een klein kantoor werken. Het lokale netwerk via MKB Vught doet hier nog echt iets.\n\nWaar het commercieel interessant wordt, is de particuliere markt. Vught heeft ruime kavels, veel vrijstaande en halfvrijstaande woningen en een koopkrachtige bevolking, en dat vertaalt zich in bovengemiddelde bestedingen aan verbouwing, tuin, interieur en onderhoud. Voor een aannemer, hovenier, zwembadbouwer of installateur is dit een aantrekkelijk werkgebied, mits je online overkomt als een partij die bij dit soort woningen past. Daar struikelen de meeste sites in deze branche: ze presenteren zich als goedkoop en snel, terwijl deze klant iets anders zoekt. Wij bouwen die site vanaf € 2.995, in twee weken live.", "sections": [{"h2": "Wat moet een website in Vught uitstralen?", "body": "Voor wie de particuliere markt in Vught bedient, is de website vooral een geloofwaardigheidsvraag. Deze klant vergelijkt niet op de laagste prijs maar op of hij vertrouwt dat het goed komt, en dat oordeel valt binnen enkele seconden op je site. Wat dan telt: echt werk in beeld in plaats van stockfoto's, herkenbare woningen uit deze omgeving, en een toon die past bij een opdracht van tienduizenden euro's. Een prijsindicatie mag daarbij best; hij hoeft alleen niet te schreeuwen dat je de goedkoopste bent. Voor de zakelijke dienstverleners geldt iets anders. Veel van hen halen hun werk uit hun netwerk en denken daarom geen website nodig te hebben. Dat klopt tot iemand je naam doorkrijgt en je opzoekt, en dat gebeurt bij elke aanbeveling. Op dat moment is een verouderde of ontbrekende site schadelijker dan een middelmatige."}, {"h2": "Voor welke bedrijven in Vught bouwen we?", "body": "Vooral voor bedrijven die aan huis en tuin werken. De kavels zijn ruim, de woningen groot en de klant kritisch, en dat vraagt om een site die kwaliteit uitstraalt in plaats van scherpte in prijs. Aannemers, want grote woningen met verouderde indelingen maken verbouwing binnen de bestaande gevels hier een sterke markt. Zwembadbouwers, omdat ruime kavels en koopkracht dit een van de betere werkgebieden in de regio maken. Vloerenzaken in een markt die op materiaal en afwerking let en daar ook naar betaalt. Schilders met veel houtwerk aan grote woningen en onderhoud dat structureel terugkomt. Kozijnenbedrijven voor panden waar de detaillering telt en waar de welstandstoets meekijkt. En voor de netwerkbedrijven, de consultants en adviesbureaus, bouwen we vaak klein en scherp: een site die bevestigt dat je bent wie je zegt te zijn."}, {"h2": "Wat kost een website laten maken in Vught?", "body": "Een zakelijke website kost vanaf € 2.995 en een website met CRM vanaf € 6.995, als vaste prijs die vooraf vaststaat. Wat hij moet doen bepaalt het bedrag: een compacte site die je netwerk bevestigt is een ander project dan een site die zelf aanvragen moet binnenhalen, en een zwembadconfigurator begroten we apart. Een configurator past hier beter dan het lijkt, zolang hij niet op de laagste prijs stuurt. Een klant met een ruime kavel die een zwembad of een verbouwing binnen de bestaande gevels overweegt, wil eerst weten of het kan en wat het ongeveer kost voordat hij iemand over de vloer haalt. Een samensteller die laat zien wat er mogelijk is, de afwerking van de badrand, het materiaal van de vloer, verkoopt de duurdere optie op beeld in plaats van op een verkooppraatje."}, {"h2": "Hoe werkt het samen met persoonlijk contact?", "body": "Klanten in Vught verwachten persoonlijk contact, en een configurator staat daar niet haaks op maar ervoor. De klant komt met een richting en een richtprijs in zijn hoofd aan tafel, en jij doet daar wat je goed doet: het echte advies. Wat verdwijnt is het eerste bezoek dat alleen diende om te horen wat hij ongeveer wilde. De aanvraag landt in een CRM met alle keuzes erin, zodat het eerste gesprek over de uitvoering gaat en niet over de intake. Het werkgebied nemen we mee: Helvoirt hoort sinds 2021 bij de gemeente en Cromvoirt al langer, en mensen daar zoeken op hun eigen plaatsnaam. Het bewijs dat deze aanpak werkt, staat live: tien configurators, waaronder zwembad en aanbouw, en Lucky Zonwering dat met configurator en CRM op 5,0 op Google staat met 124 reviews."}], "features": [{"t": "Gebouwd voor vertrouwen", "d": "Echt werk in beeld, herkenbare woningen en een toon die past bij een opdracht van tienduizenden euro's."}, {"t": "Vaste prijs vanaf € 2.995", "d": "Website met CRM vanaf € 6.995. Compact voor netwerkbedrijven, compleet voor wie aanvragen wil."}, {"t": "Live in twee weken", "d": "Eerst de pagina's die het vertrouwen dragen, daarna de rest."}, {"t": "Samensteller zonder prijsvechten", "d": "Laat zien wat er kan en welke keuzes het bedrag beïnvloeden, zonder dat prijs het hele verhaal wordt."}, {"t": "Helvoirt en Cromvoirt erbij", "d": "Het hele thuisgebied expliciet in de structuur, zonder dunne dorpspagina's."}, {"t": "Jouw eigendom", "d": "Code, data en design zijn van jou. Langskomen kan."}], "faq": [{"q": "Wat kost een website laten maken in Vught?", "a": "Een zakelijke website kost vanaf € 2.995 en een website met CRM vanaf € 6.995, als vaste prijs die vooraf vaststaat. Een compacte site die je netwerk bevestigt is een ander project dan een site die zelf aanvragen moet binnenhalen. In twintig minuten hoor je wat jouw situatie vraagt, en je zit daarna nergens aan vast."}, {"q": "Hoe lang duurt het?", "a": "Een zakelijke website staat in twee weken live. We beginnen met de pagina's die het vertrouwen dragen, projecten en werkwijze, en bouwen de rest daarna af. Een zwembad- of aanbouwconfigurator loopt parallel aan de site, zodat die de livegang niet ophoudt."}, {"q": "Wie is de eigenaar van de site?", "a": "Jij. Code, content, design en data zijn jouw eigendom, met alle toegangen op jouw naam. Geen licentie per gebruiker, geen contract waar je niet uit komt. Onderhoud is een los maandabonnement dat nooit verplicht is. Vertrek je, dan neem je alles mee en valt er niets om."}, {"q": "Wij halen ons werk uit ons netwerk. Hebben we dan een website nodig?", "a": "Waarschijnlijk een kleinere dan je denkt, maar wel een. Bij elke aanbeveling zoekt iemand je op, en dat moment bepaalt of het gesprek er komt. Een verouderde site doet daar meer kwaad dan geen enkele. Voor netwerkbedrijven bouwen we iets compacts dat vooral bevestigt dat je bent wie je zegt te zijn."}, {"q": "Onze klanten kijken niet naar prijs. Moet er dan een configurator op?", "a": "Niet per se, en soms juist niet. Een configurator die op de laagste prijs stuurt, past slecht bij deze markt. Wat wel werkt is een samensteller die laat zien wat er mogelijk is en welke keuzes het bedrag beïnvloeden, zonder dat prijs het hele verhaal wordt. Dat is een ontwerpkeuze, geen technische."}, {"q": "Werken jullie ook voor Helvoirt en Cromvoirt?", "a": "Ja. Die horen bij dezelfde gemeente, Helvoirt sinds 1 januari 2021 toen de gemeente Haaren werd opgeheven. Voor een bedrijf betekent dat een groter thuisgebied dan alleen Vught, en het loont om dat op de site te benoemen omdat mensen daar op hun eigen plaatsnaam zoeken."}], "cities": ["Vught", "Helvoirt", "Cromvoirt", "Sint-Michielsgestel", "Den Bosch", "Berlicum", "Boxtel", "Vlijmen", "Rosmalen"], "proof": "Lucky Zonwering verkoopt met configurator en CRM op beeld en staat op 5,0 op Google met 124 reviews; tien configurators draaien live, waaronder zwembad en aanbouw.", "internal_links": ["dienst-webdesign", "branche-hoveniers", "lokaal-webdesign-den-bosch"], "jsonld": {"@context": "https://schema.org", "@graph": [{"@type": "WebPage", "@id": "https://nextgrowthdigital.nl/lokaal-webdesign-vught/#webpage", "url": "https://nextgrowthdigital.nl/lokaal-webdesign-vught", "name": "Website laten maken Vught vanaf € 2.995 | Next Growth", "description": "Website laten maken in Vught, een markt die op vertrouwen koopt en niet op de laagste prijs. Past bij grote woningen, vanaf € 2.995, live in twee weken.", "inLanguage": "nl-NL", "isPartOf": {"@id": "https://nextgrowthdigital.nl/#website"}, "about": {"@id": "https://nextgrowthdigital.nl/#organization"}, "breadcrumb": {"@id": "https://nextgrowthdigital.nl/lokaal-webdesign-vught/#breadcrumb"}}, {"@type": "Service", "@id": "https://nextgrowthdigit ontent, design en data zijn jouw eigendom, met alle toegangen op jouw naam. Geen licentie per gebruiker, geen contract waar je niet uit komt. Onderhoud is een los maandabonnement dat nooit verplicht is. Vertrek je, dan neem je alles mee en valt er niets om."}}, {"@type": "Question", "name": "Wij halen ons werk uit ons netwerk. Hebben we dan een website nodig?", "acceptedAnswer": {"@type": "Answer", "text": "Waarschijnlijk een kleinere dan je denkt, maar wel een. Bij elke aanbeveling zoekt iemand je op, en dat moment bepaalt of het gesprek er komt. Een verouderde site doet daar meer kwaad dan geen enkele. Voor netwerkbedrijven bouwen we iets compacts dat vooral bevestigt dat je bent wie je zegt te zijn."}}, {"@type": "Question", "name": "Onze klanten kijken niet naar prijs. Moet er dan een configurator op?", "acceptedAnswer": {"@type": "Answer", "text": "Niet per se, en soms juist niet. Een configurator die op de laagste prijs stuurt, past slecht bij deze markt. Wat wel werkt is een samensteller die laat zien wat er mogelijk is en welke keuzes het bedrag beïnvloeden, zonder dat prijs het hele verhaal wordt. Dat is een ontwerpkeuze, geen technische."}}, {"@type": "Question", "name": "Werken jullie ook voor Helvoirt en Cromvoirt?", "acceptedAnswer": {"@type": "Answer", "text": "Ja. Die horen bij dezelfde gemeente, Helvoirt sinds 1 januari 2021 toen de gemeente Haaren werd opgeheven. Voor een bedrijf betekent dat een groter thuisgebied dan alleen Vught, en het loont om dat op de site te benoemen omdat mensen daar op hun eigen plaatsnaam zoeken."}}]}, {"@type": "BreadcrumbList", "@id": "https://nextgrowthdigital.nl/lokaal-webdesign-vught/#breadcrumb", "itemListElement": [{"@type": "ListItem", "position": 1, "name": "Home", "item": "https://nextgrowthdigital.nl/home"}, {"@type": "ListItem", "position": 2, "name": "Webdesign", "item": "https://nextgrowthdigital.nl/dienst-webdesign"}, {"@type": "ListItem", "position": 3, "name": "Website laten maken in Vught", "item": "https://nextgrowthdigital.nl/lokaal-webdesign-vught"}]}]}, "kort": {"wat": "Zakelijke website die vertrouwen uitstraalt bij grote woningen", "waar": "Vught, Helvoirt en Cromvoirt", "prijs": "vanaf € 2.995", "doorlooptijd": "live in twee weken", "voorwie": "aannemers, zwembadbouwers, vloeren, schilders en adviesbureaus", "eigendom": "code, data en design zijn van jou"}}, "lokaal-webdesign-wijchen": {"title": "Website laten maken Wijchen vanaf € 2.995 | Next Growth", "description": "Website laten maken in Wijchen: opvallen naast Nijmegen, lokaal waar dat telt en op de dienst waar het volume zit. Vanaf € 2.995, live in twee weken.", "h1": "Website laten maken in Wijchen", "keywords": ["website laten maken Wijchen", "webdesign Wijchen", "webdesign bureau Wijchen", "website bouwen Wijchen", "website Bijsterhuizen", "website kozijnenbedrijf Wijchen", "website laten maken Bergharen Hernen", "website aannemer Wijchen"], "definition": "Next Growth is een landelijk werkend webdesignbureau dat websites bouwt voor bedrijven in Wijchen en de dorpen Alverna, Bergharen, Hernen, Batenburg, Niftrik en Balgoij. Een website kost vanaf € 2.995, staat in twee weken live en is jouw eigendom. We bouwen sites waarmee een Wijchens bedrijf opvalt naast Nijmegen: lokaal waar dat waarde heeft, op de dienst waar het volume zit.", "intro": "Wijchen heeft meer bedrijvigheid dan de meeste mensen denken: ruim tweeduizend bedrijven en zo'n vijftienduizend arbeidsplaatsen. Het zwaartepunt ligt op Bijsterhuizen, het grote terrein aan de A73 dat Wijchen en Nijmegen samen hebben ontwikkeld, met maakindustrie, agri-food en logistiek. Daarnaast zijn er Wijchen-Oost, Breekwagen en Loonse Waard, dat als enige een spoor- en wateraansluiting heeft. Voor een gemeente van deze omvang is dat ongewoon compleet.\n\nDe online werkelijkheid is een andere. Wie in dit gebied zoekt naar een aannemer, installateur of dienstverlener, krijgt overwegend Nijmeegse bedrijven te zien: die zijn groter, ze zijn er eerder mee begonnen, en de stad domineert de zoekresultaten. Een Wijchens bedrijf dat alleen op de eigen plaatsnaam mikt, vist in een kleine vijver; een bedrijf dat niets lokaals doet, verdwijnt tussen de Nijmeegse concurrentie. De winst zit in de combinatie, en daar bouwen wij de site op: vanaf € 2.995, in twee weken live, met iets wat de Nijmeegse concurrent niet aanbiedt.", "sections": [{"h2": "Waar wil je als Wijchens bedrijf gevonden worden?", "body": "Dat is de belangrijkste keuze. Komen je klanten vooral uit Wijchen en de dorpen, Alverna, Bergharen, Hernen, Batenburg, Leur, Niftrik en Balgoij, dan is lokale nadruk logisch en levert die aanvragen op die dichtbij zitten en dus rendabel zijn. Werk je net zo goed in Nijmegen en Beuningen, dan moet de site dat ook uitstralen, want anders lijk je kleiner dan je bent en kom je niet in beeld bij opdrachten waar je prima aan kunt. Het praktische deel is dat je die twee niet moet mengen in vage taal. 'Wij werken in de regio' zegt niets en zoekt naar niets. Wat wel werkt is de dienst centraal zetten, met daaronder helder waar je komt en wat je daar hebt gedaan. Dat leest voor een klant als concreet en het is voor een zoekmachine een structuur die iets betekent."}, {"h2": "Voor welke bedrijven in Wijchen bouwen we?", "body": "Voor bedrijven die zowel het dorp als de stad bedienen, want die dubbele markt is de kern van het vraagstuk hier. Aannemers, waar de naoorlogse schil en de dorpen verbouwwerk leveren en Nijmegen volume. Klusbedrijven, veel kleinere bedrijven waarvoor de site de enige echte etalage is. Kozijnenbedrijven voor naoorlogse woningen die aan vervanging toe zijn en oudere panden in de dorpskernen waar de detaillering telt. Dakdekkers met werk in de kernen en op de bedrijfspanden van Bijsterhuizen en Wijchen-Oost. Zonweringbedrijven, want de ruime kavels in de naoorlogse wijken en de dorpen maken dit een grotere markt dan de omvang doet vermoeden. En de bedrijven op Bijsterhuizen zelf, die volume uit Nijmegen willen en een site nodig hebben die niet kleiner oogt dan ze zijn."}, {"h2": "Wat kost een website laten maken in Wijchen?", "body": "Een zakelijke website kost vanaf € 2.995 en een website met CRM vanaf € 6.995, als vaste prijs die vooraf vaststaat. Teksten, mobiel ontwerp, SEO-basis en formulieren zitten erin. Wat het bedrag bepaalt, is of er een configurator of een koppeling met je systeem in moet. Tegen de naamsbekendheid van Nijmeegse bedrijven win je niet met een mooiere homepage, wel met iets wat zij niet aanbieden. Een bezoeker uit Alverna of Bergharen die op de site van een Wijchens kozijnenbedrijf zijn eigen kozijnen kan samenstellen en direct ziet wat het kost, heeft een reden om daar te blijven. Het werkgebied is daarbij een instelling, geen tweede bouw: strak voor wie de dorpen bedient, breed met een richtprijs die de reistijd meerekent voor wie volume uit Nijmegen wil."}, {"h2": "Moeten we een pagina maken voor Bergharen, Batenburg en de andere dorpen?", "body": "Nee, niet als aparte pagina's. Zeven bijna gelijke dorpspagina's zijn precies wat zoekmachines inmiddels als dun herkennen. Op ons eigen domein is dat al eens gebeurd en het leverde nul kliks op; die les nemen we mee. Beter is één sterke pagina per dienst waarin het werkgebied concreet benoemd staat, met echte voorbeelden uit die kernen: een dakkapel in Hernen, kozijnen in Batenburg, zonwering in Balgoij. Dat is voor de klant herkenbaar en voor Google een structuur die iets betekent. Lokale aanvragen converteren doorgaans beter en liggen dichterbij, terwijl je voor volume op de dienst zelf moet concurreren. Wie alleen het één doet, laat de andere helft liggen. Het bewijs staat live: tien configurators, Prefab Select met 212 procent meer aanvragen en 194 lokale pagina's die we voor onze eigen vindbaarheid bouwden."}], "features": [{"t": "Opvallen naast Nijmegen", "d": "Lokaal waar dat waarde heeft, op de dienst waar het volume zit, zonder vage regio-taal."}, {"t": "Vaste prijs vanaf € 2.995", "d": "Website met CRM vanaf € 6.995. Geen licentie per gebruiker, geen verrassingen."}, {"t": "Live in twee weken", "d": "Eerst de pagina's die verkopen, daarna de rest. Een configurator loopt parallel."}, {"t": "Werkgebied als instelling", "d": "Strak voor de dorpen of breed richting Nijmegen, met een richtprijs die de reistijd meerekent."}, {"t": "Geen dunne dorpspagina's", "d": "Eén sterke pagina per dienst met Alverna, Bergharen, Hernen en Batenburg concreet benoemd."}, {"t": "Jouw eigendom", "d": "Code, data en design zijn van jou. Langskomen kan."}], "faq": [{"q": "Wat kost een website laten maken in Wijchen?", "a": "Een zakelijke website kost vanaf € 2.995 en een website met CRM vanaf € 6.995, als vaste prijs die vooraf vaststaat. Of er een configurator of een koppeling met je systeem in moet, bepaalt het uiteindelijke bedrag. In een gesprek van twintig minuten hoor je wat er nodig is en wat dat kost."}, {"q": "Hoe lang duurt het?", "a": "Een zakelijke website staat in twee weken live. We beginnen met de pagina's die aanvragen opleveren en bouwen de rest daarna af. Een configurator loopt parallel aan de site, zodat de livegang er niet op hoeft te wachten. Geen trajecten van maanden; je hebt snel iets dat werkt."}, {"q": "Wie is de eigenaar van de site?", "a": "Jij. Code, content, design en data zijn jouw eigendom, met alle toegangen op jouw naam. Geen licentie per gebruiker, geen contract waar je niet uit komt. Onderhoud is een los maandabonnement dat nooit verplicht is. Vertrek je, dan neem je alles mee en valt er niets om."}, {"q": "Heeft lokale vindbaarheid in Wijchen zin met Nijmegen zo dichtbij?", "a": "Ja, maar niet als enige strategie. Op de plaatsnaam alleen is het volume klein. De winst zit erin dat lokale aanvragen beter converteren en dichterbij liggen, terwijl je voor volume op de dienst zelf moet concurreren. Wie alleen het één doet, laat de andere helft liggen. De site doet daarom allebei."}, {"q": "Wij zitten op Bijsterhuizen en willen ook Nijmeegse klanten. Kan dat met één site?", "a": "Ja. Het werkgebied is een instelling, geen tweede bouw. De klant vult zijn plaats in, de richtprijs rekent de reistijd mee en de aanvraag komt binnen met plaats en afstand, zodat je zelf beslist wat je aanneemt. Dezelfde site en configurator, met andere instellingen die van jou komen."}, {"q": "Zitten jullie in Wijchen?", "a": "Nee, we werken landelijk en regelmatig in dit gebied. Overleg gaat digitaal en we komen langs wanneer dat helpt. We komen langs wanneer dat handiger is dan videobellen. Een vestigingsadres huren om lokaal te lijken doen we niet; wat je aan een bureau hebt, hangt af van of ze je markt kennen en opnemen als je belt."}], "cities": ["Wijchen", "Alverna", "Bergharen", "Hernen", "Batenburg", "Niftrik", "Balgoij", "Beuningen", "Ravenstein", "Grave", "Malden"], "proof": "Prefab Select haalde 212 procent meer aanvragen met site, vindbaarheid en configurator als één keten; 194 lokale pagina's staan live als bewijs van onze eigen aanpak.", "internal_links": ["dienst-webdesign", "branche-bouwbedrijven", "lokaal-webdesign-nijmegen"], "jsonld": {"@context": "https://schema.org", "@graph": [{"@type": "WebPage", "@id": "https://nextgrowthdigital.nl/lokaal-webdesign-wijchen/#webpage", "url": "https://nextgrowthdigital.nl/lokaal-webdesign-wijchen", "name": "Website laten maken Wijchen vanaf € 2.995 | Next Growth", "description": "Website laten maken in Wijchen: opvallen naast Nijmegen, lokaal waar dat telt en op de dienst waar het volume zit. Vanaf € 2.995, live in twee weken.", "inLanguage": "nl-NL", "isPartOf": {"@id": "https://nextgrowthdigital.nl/#website"}, "about": {"@id": "https://nextgrowthdigital.nl/#organization"}, "breadcrumb": {"@id": "https://nextgrowthdigital.nl/lokaal-webdesign-wijchen/#breadcrumb"}}, {"@type": "Service", "@id": "https://nextgrowthdigital.nl/lokaal-webdesign-wijchen/#service", "name": "Website laten maken in Wijchen", "serviceType": "Website laten maken in Wijchen", "description": "Next Growth is een gen", "waar": "Wijchen, Bijsterhuizen en de dorpen", "prijs": "vanaf € 2.995", "doorlooptijd": "live in twee weken", "voorwie": "aannemers, kozijnen, daken, zonwering en klusbedrijven", "eigendom": "code, data en design zijn van jou"}}, "lokaal-marketing-uden": {"title": "Online marketing bureau Uden | Next Growth", "description": "Online marketing bureau voor Uden en Maashorst: gevonden worden tegen concurrentie uit Veghel en Den Bosch. Vaste maandprijs, maandelijks opzegbaar.", "h1": "Online marketing bureau Uden", "keywords": ["online marketing bureau Uden", "marketing bureau Uden", "SEO Uden", "Google Ads Uden", "online marketing Maashorst", "social media marketing Uden", "vindbaar in Google Uden", "marketing bureau Volkel Schaijk"], "definition": "Next Growth is een landelijk werkend online marketingbureau dat SEO, Google Ads, social media en content regelt voor bedrijven in Uden en de gemeente Maashorst. We rekenen af in aanvragen en offertes, niet in bereik, en koppelen elke campagne aan je website en CRM. Vaste maandprijs, maandelijks opzegbaar, accounts op jouw naam. Bewijs: Prefab Select +212% aanvragen.", "intro": "Uden ligt midden in de driehoek Eindhoven, Nijmegen en Den Bosch, aan de A50. Commercieel een sterke plek, en dat verklaart de omvang van Loopkant-Liessent en het ongewoon sterke winkelcentrum met een verzorgingsgebied dat ver buiten de gemeentegrens reikt. Online heeft die ligging een keerzijde die je meteen voelt. Een klant in Uden die een installateur of hovenier zoekt, krijgt net zo goed bedrijven uit Veghel, Den Bosch en Nijmegen te zien, want die rijden hier ook naartoe.\n\nLokale bekendheid beschermt hier dus minder dan elders, en dat maakt marketing in Uden anders dan in een geïsoleerde plaats. Je wint niet door hetzelfde te roepen als de rest, maar door concreter te zijn in de zoekresultaten en op de pagina erachter: een prijsindicatie, echt werk in beeld en een aanvraag die niet op een leeg formulier uitkomt. Daar bouwen wij de campagnes en de vindbaarheid op, voor heel Maashorst, tegen een vaste maandprijs die je maandelijks kunt opzeggen, met de accounts op jouw naam.", "sections": [{"h2": "Hoe word je in Uden gevonden tegen concurrentie uit drie richtingen?", "body": "Door specifiek te zijn waar de rest algemeen is. 'Vakmanschap, kwaliteit en service' staat op de site van elk bouwbedrijf tussen hier en Eindhoven, en Google kan dat niet onderscheiden van de rest, net zomin als je klant. Wat wel onderscheidt: per dienst een pagina die de vragen beantwoordt die mensen in Uden echt stellen, met welk werk je doet, welk werk je niet doet, hoe lang het duurt en wat het ongeveer kost. Dat is ongemakkelijker om op te schrijven en het levert meer en betere aanvragen op. Daarbij hoort een Google Bedrijfsprofiel dat leeft, met recente foto's en beantwoorde reviews, want bij 'installateur Uden' kijkt de klant eerst naar de kaart. Zo kom je in beeld naast de partij uit Veghel of Den Bosch, en win je op de pagina erachter."}, {"h2": "Waarom is Maashorst je werkgebied en niet alleen Uden?", "body": "Sinds 1 januari 2022 vormen Uden en Landerd samen de gemeente Maashorst: Volkel, Odiliapeel, Schaijk, Reek en Zeeland horen erbij. Mensen in die kernen zoeken op hun eigen plaatsnaam en willen weten of je daar ook komt. Veel lokale sites noemen alleen Uden, en dat is een gemiste kans die je met vindbaarheid goedkoop pakt. We benoemen het werkgebied expliciet in de structuur van de site en in de campagnes, zonder voor elke kern een aparte dunne pagina, want dat kost eerder ranking dan dat het oplevert. In Google Ads richten we het gebied in op reistijd: de kernen van Maashorst plus Nistelrode, Heesch en Veghel waar je rendabel werkt, en niet de hele driehoek waar je toch niet naartoe rijdt. Zo betaal je alleen voor kliks die een opdracht kunnen worden."}, {"h2": "Wat kost online marketing in Uden en wat krijg je ervoor?", "body": "Het advertentiebudget is van jou; onze aanpak heeft een vaste prijs per maand die je ijstad: vindbaarheid voor toeleveranciers en lokale bedrijven, gemeten tot de aanvraag. Vaste maandprijs.", "h1": "Online marketing bureau Veghel", "keywords": ["online marketing bureau Veghel", "marketing bureau Veghel", "SEO Veghel", "Google Ads Veghel", "online marketing Meierijstad", "marketing toeleverancier Veghel", "social media marketing Veghel", "vindbaar in Google Meierijstad"], "definition": "Next Growth is een landelijk werkend online marketingbureau dat SEO, Google Ads, social media en content regelt voor technische, bouw- en lokale bedrijven in Veghel en Meierijstad. We rekenen af in aanvragen en offertes, niet in bereik, en koppelen elke campagne aan je website en CRM. Vaste maandprijs, maandelijks opzegbaar, accounts op jouw naam. Bewijs: Installatieplatform, offerte in twee minuten.", "intro": "Veghel is een plaats van een paar duizend inwoners met de bedrijvigheid van een stad. Het economische zwaartepunt van Meierijstad draait op food en logistiek: distributiecentra en hoofdkantoren op De Dubbelen, met daaromheen een dichte laag toeleveranciers op Doornhoek. Dat is een markt die in processen en cijfers denkt, en er ook zo naar kijkt. Marketing die likes rapporteert, overtuigt hier niemand; marketing die laat zien wat een aanvraag kostte en opleverde wel.\n\nDaarnaast zijn er de kernen Erp, Zijtaart, Mariaheide en Eerde, een consumentenmarkt waar mond-tot-mond nog veel doet maar waar de zoekopdracht het werk afmaakt dat de aanbeveling begint. Veghel is bovendien de enige van onze oude stadspagina's die echte vertoningen kreeg, dus we weten dat hier gezocht wordt. Voor beide markten bouwen we vindbaarheid en campagnes die eindigen in een aanvraag met maatvoering, aantallen en termijn erin, tegen een vaste maandprijs die je maandelijks kunt opzeggen, met de accounts op jouw naam.", "sections": [{"h2": "Hoe werkt online marketing voor een toeleverancier in Veghel?", "body": "Anders dan voor een consumentenbedrijf. Een inkoper op De Dubbelen of een technisch bedrijf op Doornhoek vindt je zelden via een advertentie met een aanbieding; hij zoekt op specificatie, certificering en capaciteit, en hij wil daarna geen week heen en weer mailen. Vindbaarheid bouwen we daarom op de dienst en de toepassing: per product of bewerking een pagina die de vragen van een technisch onderlegde lezer beantwoordt, met tolerantie, termijn en referenties in dezelfde sector. De aanvraagroute haalt meteen de gegevens op die je nodig hebt om te offreren, zodat een aanvraag dezelfde dag beantwoord is. LinkedIn en gerichte Google Ads op zakelijke zoektermen vullen dat aan. Het doel is niet de order op de site, maar op de longlist komen met een aanvraag die compleet binnenkomt."}, {"h2": "Hoe word je gevonden in de kernen van Meierijstad?", "body": "Op de plaatsnaam Veghel alleen is het volume beperkt, en het zou oneerlijk zijn om anders te doen. De winst zit in de combinatie: wat je doet, plus waar je het doet, plus dat je in Erp, Zijtaart, Mariaheide, Eerde, Schijndel en Sint-Oedenrode ook gevonden wordt. We bouwen per dienst een pagina die diep genoeg is om te ranken en benoemen het werkgebied daarbinnen, zonder dunne pagina per dorp. Je Google Bedrijfsprofiel zetten we op orde, want voor een klusbedrijf of dakdekker in de kernen is dat de eerste plek waar de klant kijkt. Voor de consumentenkant moet de drempel laag: iemand die op zaterdagochtend een uitbouw zit te bekijken, wil zien wat het ongeveer kost en dan pas praten. Een advertentie die daar eindigt, levert meer op dan een die naar een contactformulier stuurt."}, {"h2": "Wat kost online marketing in Veghel?", "body": "Het advertentiebudget is van jou; onze aanpak heeft een vaste prijs per maand die je maandelijks kunt opzeggen. We beginnen compact, één kanaal goed in plaats van vijf kanalen half, en schalen op wat aantoonbaar aanvragen oplevert. Voor Veghelse bedrijven met een eigen ERP of offertepakket zit de grootste winst vaak niet in meer verkeer maar in wat er met een aanvraag Den Bosch", "marketing bouwbedrijf Den Bosch", "vindbaar in Google Den Bosch", "online marketing Rosmalen"], "definition": "Next Growth is een landelijk werkend online marketingbureau dat SEO, Google Ads, social media en content regelt voor bedrijven in 's-Hertogenbosch, Rosmalen en de regio. We rekenen af in aanvragen en offertes, niet in bereik, en koppelen elke campagne aan je website en CRM. Vaste maandprijs, maandelijks opzegbaar, accounts op jouw naam. Bewijs: Installatieplatform, offerte in twee minuten.", "intro": "Den Bosch is een dienstenstad met een industriële rand, en dat zijn twee heel verschillende markten voor marketing. In de binnenstad, op De Brand en rond de campus zit zakelijke dienstverlening, overheid, zorg en een groeiende techsector; daar is marketing een geloofwaardigheidsvraag en valt de beslissing in een gesprek, niet op een pagina. Op De Rietvelden, in Empel en Maaspoort zit maakindustrie, groothandel en de brede laag installateurs en bouwbedrijven die de regio bedient; daar wint de partij die als eerste een concreet antwoord geeft op wat iets kost en wanneer het kan.\n\nDe Brabantse marketingbureaus die je in Google tegenkomt, zitten vrijwel allemaal in het westen van de provincie. Den Bosch en de oostkant zijn onderbezet, en dat is voor jou een voordeel. Wij bouwen vindbaarheid en campagnes voor beide Bossche markten, met een regiofunctie erin, want een Bosch bedrijf werkt net zo goed in Rosmalen, Vught en Berlicum. Vaste maandprijs, maandelijks opzegbaar, accounts op jouw naam, en elke aanvraag herleidbaar tot de offerte.", "sections": [{"h2": "Hoe verschilt marketing voor de binnenstad van marketing voor De Rietvelden?", "body": "Voor de zakelijke dienstverlener in de binnenstad of op De Brand is de vraag of je op de lijst komt. Wie hier een opdracht van vijf cijfers gunt, kijkt eerst of je site en je zichtbaarheid eruitzien alsof je die opdracht aankunt. Marketing betekent daar: gevonden worden op je specialisme, een LinkedIn-aanwezigheid die klopt en een aanvraagroute die compleet binnenkomt, zodat het gesprek daarna over de inhoud gaat. Voor de installateur of het bouwbedrijf op De Rietvelden of in Empel is het beslismoment anders: de klant in Rosmalen of Maaspoort wil nu weten wat een uitbouw of nieuwe kozijnen ongeveer kosten. Daar sturen we Google Ads naar een pagina met een richtprijs of een configurator, en bouwen we vindbaarheid per dienst en per wijk. Twee markten, twee aanpakken, één systeem erachter."}, {"h2": "Hoe richten we de regio rond Den Bosch in?", "body": "Den Bosch heeft een regiofunctie. Veel bedrijven hier werken net zo goed in Rosmalen, Vught, Berlicum, Vlijmen, Sint-Michielsgestel en Zaltbommel, en zoeken dus niet alleen op de stadsnaam. Marketing die alleen op 'Den Bosch' is ingericht, laat de helft van de vraag liggen. We bouwen de vindbaarheid op wat je doet, met per dienst een pagina die diep genoeg is om te ranken, en maken het werkgebied daarbinnen expliciet. Niet met een aparte pagina per dorp: dunne pagina's worden gecrawld en niet getoond, en dat heeft op ons eigen domein al eens aantoonbaar niets opgeleverd. In Google Ads richten we het gebied in op reistijd, zodat je betaalt voor kliks uit Rosmalen en Vught en niet uit Tilburg. Je Google Bedrijfsprofiel krijgt recente foto's en beantwoorde reviews, want bij 'aannemer Den Bosch' kijkt de klant eerst naar de kaart."}, {"h2": "Wat kost online marketing in Den Bosch?", "body": "Het advertentiebudget is van jou; onze aanpak heeft een vaste prijs per maand die je maandelijks kunt opzeggen. We rekenen geen stadstoeslag omdat je in de duurste binnenstad van Brabant zit. We beginnen compact, één kanaal goed in plaats van vijf kanalen half, en schalen op wat aantoonbaar aanvragen oplevert. Een Bossche klant let op presentatie, en dat geldt ook voor advertenties en landingspagina's: een configurator met een render per keuze, het kozijn tegen de gevel of de vloer in de kamer, doet hier meer dan een schuifje met een bedrag. Je krijgt per maand een kort overzicht: bezoekers, aanvragen, offertes en wat we volgende maand anders doen. Een bedrag noemen we na een gesprek van twintig minuten, als we weten welke dienst het snelst rendeert."}, {"h2": "Waarom marketing en opvolging bij ons aan elkaar hangen", "body": "Het grootste verlies in marketing zit niet in de campagnes maar erna: aanvragen die te laat worden opgevolgd en leads die in een mailbox verdwijnen. In een kritische zakelijke markt als Den Bosch is een aanvraag die drie dagen blijft liggen een aanvraag die naar een concurrent is gegaan. Daarom landt elke aanvraag met bron en campagne in een CRM met pijplijn, zodat je ziet wie gebeld moet worden. Bij Installatieplatform ging de offerte daarmee van een avond rekenwerk naar twee minuten, en bij Prefab Select leverde de keten van vindbaarheid, campagnes en configurator 212 procent meer aanvragen op. Omdat website, software en marketing bij ons uit één hand komen, wijst niemand naar een ander als iets beter kan. Dat is het verschil tussen een maandelijkse gok en een systeem dat voorspelbaar aanvragen produceert."}], "features": [{"t": "Twee Bossche markten, één systeem", "d": "Op de lijst komen voor de dienstenstad, een concreet antwoord voor de westkant."}, {"t": "Vaste maandprijs", "d": "Compact beginnen met één kanaal, opschalen wat aanvragen oplevert. Geen stadstoeslag."}, {"t": "Maandelijks opzegbaar", "d": "Geen jaarcontract. We verdienen het elke maand opnieuw."}, {"t": "Accounts op jouw naam", "d": "Google Ads, LinkedIn, Bedrijfsprofiel en alle data blijven van jou."}, {"t": "Regio op reistijd", "d": "Rosmalen, Vught, Berlicum en Vlijmen in structuur en campagnes, zonder dunne dorpspagina's."}, {"t": "Gekoppeld aan je CRM", "d": "Elke aanvraag landt met bron en campagne in een pijplijn, zodat niets blijft liggen."}], "faq": [{"q": "Wat kost een online marketing bureau in Den Bosch?", "a": "Het advertentiebudget is van jou; onze aanpak heeft een vaste prijs per maand, zonder ng bureau Eindhoven", "marketing bureau Eindhoven", "SEO bureau Eindhoven", "Google Ads Eindhoven", "marketing bouwbedrijf Eindhoven", "social media marketing Eindhoven", "vindbaar in Google Woensel", "online marketing Veldhoven"], "definition": "Next Growth is een landelijk werkend online marketingbureau dat SEO, Google Ads, social media en content regelt voor bouw-, installatie- en technische bedrijven in Eindhoven en de regio. We rekenen af in aanvragen en offertes, niet in bereik, en koppelen elke campagne aan je website en CRM. Vaste maandprijs, maandelijks opzegbaar, accounts op jouw naam. Bewijs: Prefab Select +212% aanvragen.", "intro": "Eindhoven is de zwaarste markt van ons werkgebied. Er zitten meer bureaus dan waar ook in Zuid-Nederland, en de klant is technisch onderlegd. Wij zijn er niet om generiek met die bureaus te concurreren; voor een marketingsite zonder rekenwerk zijn er hier prima partijen dichterbij. Waar wij het verschil maken, is bij bedrijven die aan de naoorlogse woningvoorraad werken. Woensel alleen al telt duizenden vrijwel identieke rijtjeswoningen uit de jaren zestig en zeventig, en die worden al twee decennia verbouwd, geïsoleerd en van nieuwe kozijnen voorzien.\n\nHet probleem in die markt is niet de vraag maar de drukte: op elke zoekterm staan tien concurrenten en drie advertenties. Daar win je niet met meer budget maar met betere antwoorden: kan het bij mijn woningtype, wat kost het, hoe lang duurt het. We bouwen vindbaarheid en campagnes die daar eindigen, in een configurator die het woningtype herkent en een richtprijs geeft, tegen een vaste maandprijs die je maandelijks kunt opzeggen. De accounts staan op jouw naam en elke aanvraag is herleidbaar tot de offerte.", "sections": [{"h2": "Hoe win je in Eindhoven tussen tien concurrenten en drie advertenties?", "body": "Niet met een hoger bod per klik maar met een beter antwoord na de klik. Wie een dakopbouw in Woensel zoekt, klikt op drie advertenties en belt de partij die op de pagina al zegt of het bij zijn type woning kan en wat het ongeveer kost. De andere twee kregen de klik en verder niets. Daarom sturen we campagnes niet naar een homepage maar naar een configurator die het woningtype herkent, de hoekwoning of de tussenwoning uit de jaren zestig, en alleen de opties en richtprijs toont die daarop passen. Het tweede is lokale kennis in de inhoud: Eindhoven kent welstandsvrije gebieden in een deel van de naoorlogse wijken, terwijl in Philipsdorp, Drents Dorp en Lakerlopen een streng regime geldt. Een pagina die uitlegt waar wat mag, wint vertrouwen bij de bezoeker die twijfelt, en dat kopieert niemand."}, {"h2": "Hoe word je gevonden in een stad die het ziet als je code niet klopt?", "body": "Eerst de techniek, want in Eindhoven is dat geen detail. Laadtijd, toegankelijkheid en schone code zijn hier zichtbaar voor een deel van je publiek; in elke klantenkring zit iemand die het nameet met de tool die in elke browser zit. Onze pagina's scoren 100 op toegankelijkheid en SEO, en dat is de basis waarop vindbaarheid wordt gebouwd. Dan de inhoud: per dienst een pagina die de vragen beantwoordt die mensen in Woensel, Stratum, Tongelre, Meerhoven en Blixembosch echt stellen, en het werkgebied expliciet benoemd tot Veldhoven, Nuenen, Geldrop, Best en Son en Breugel, zonder dunne pagina per plaats. Een Google Bedrijfsprofiel dat leeft, met recente foto's en beantwoorde reviews. Anders dan advertenties stapelt dit zich op: in de grootste herhaalmarkt van ons werkgebied blijft een goede positie jaren aanvragen opleveren."}, {"h2": "Wat kost online marketing in Eindhoven?", "body": "Hetzelfde als in de rest van ons werkgebied; we rekenen geen stadstoeslag. Het advertentiebudget is van jou en onze aanpak heeft een vaste prijs per maand die je maandelijks kunt opzeggen. In Eindhoven is de prijs per klik op bouwtermen hoger dan elders, en daarom beginnen we compact: één dienst en één woningtype goed, bijvoorbeeld dakopbouw in Woensel, en we schalen op wat aantoonbaar aanvragen oplevert. Een duurdere klik die eindigt in een complete aanvraag met richtprijs is goedkoper dan een goedkope klik die eindigt in niets. Je krijgt per maand een kort overzicht: bezoekers, aanvragen, offertes en wat we volgende maand anders doen. Werkt een campagne niet, dan zie je dat binnen weken en sturen we bij of stoppen we. Een bedrag noemen we na een gesprek van twintig minuten."}, {"h2": "Waarom website, marketing en opvolging uit één hand komen", "body": "Het grootste verlies in marketing zit niet in de campagnes maar erna. In een markt met tien concurrenten per zoekterm is een aanvraag die een dag blijft liggen een aanvraag die naar de volgende advertentie is gegaan. Daarom landt elke aanvraag met bron, campagne en woningtype in een CRM, zodat je ziet wie gebeld moet worden terwijl je op de bouw staat. Bij Prefab Select leverde de keten van vindbaarheid, campagnes en configurator 212 procent meer aanvragen op; bij Installatieplatform ging de offerte van een avond rekenwerk naar twee minuten. Tien configurators draaien live als bewijs. Omdat website, software en marketing bij ons uit één hand komen, wijst niemand naar een ander als iets beter kan. Het meeste overleg gaat digitaal en we komen langs wanneer het nodig is."}], "features": [{"t": "Betere antwoorden, geen hoger bod", "d": "Campagnes eindigen in een configurator die het woningtype herkent en een richtprijs geeft."}, {"t": "Vaste maandprijs", "d": "Compact beginnen met één dienst en één woningtype, opschalen wat aanvragen oplevert. Geen stadstoeslag."}, {"t": "Maandelijks opzegbaar", "d": "Geen jaarcontract. We verdienen het elke maand opnieuw."}, {"t": "Accounts op jouw naam", "d": "Google Ads, Bedrijfsprofiel en social blijven van jou, inclusief alle data."}, {"t": "Techniek die een techstad kan nameten", "d": "100 op toegankelijkheid en SEO als basis voor vindbaarheid."}, {"t": "Gekoppeld aan je CRM", "d": "Elke aanvraag landt met bron, campagne en woningtype, zodat niets b }

/* video's: alleen afspelen in beeld, met fallback op eerste interactie */
(function(){
  function prep(v){v.muted=true;v.setAttribute('muted','');v.setAttribute('playsinline','');v.setAttribute('webkit-playsinline','');v.loop=true;v.setAttribute('loop','')}
  function tryPlay(v){prep(v);if(v.preload==='none')v.preload='auto';var pr=v.play();if(pr&&pr.catch)pr.catch(function(){})}
  var io=('IntersectionObserver' in window)?new IntersectionObserver(function(es){es.forEach(function(e){var v=e.target;if(e.isIntersecting){tryPlay(v)}else{v.pause()}})},{rootMargin:'15% 0px'}):null;
  function scan(){document.querySelectorAll('video[data-auto]:not([data-io])').forEach(function(v){v.setAttribute('data-io','1');prep(v);if(io)io.observe(v);else tryPlay(v)})}
  var root=document.getElementById('root');
  new MutationObserver(function(){scan()}).observe(root,{childList:true,subtree:true});scan();
  function kick(){document.querySelectorAll('video[data-auto]').forEach(function(v){var r=v.getBoundingClientRect();if(r.bottom>0&&r.top<innerHeight&&v.paused)tryPlay(v)})}
  ['pointerdown','touchstart','keydown','scroll'].forEach(function(ev){addEventListener(ev,kick,{passive:true})});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)kick()});
  setTimeout(kick,1500);setTimeout(kick,4000);
})();
/* cursor */
if(matchMedia('(pointer:fine)').matches){
  var cur=document.getElementById('cursor'),cx=0,cy=0,tx=0,ty=0;
  addEventListener('pointermove',function(e){tx=e.clientX;ty=e.clientY;cur.style.opacity=1});
  document.addEventListener('mouseleave',function(){cur.style.opacity=0});
  document.addEventListener('pointerover',function(e){cur.classList.toggle('big',!!e.target.closest('[data-hover],a,button,.opt,.card'))});
  (function loop(){cx+=(tx-cx)*.22;cy+=(ty-cy)*.22;cur.style.transform='translate('+(cx-50)+'%,'+(cy-50)+'%) translate('+cx+'px,'+cy+'px)';cur.style.transform='translate('+cx+'px,'+cy+'px) translate(-50%,-50%)';requestAnimationFrame(loop)})();
}
