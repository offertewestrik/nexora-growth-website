<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0A0A0A">

<meta name="description" content="Next Growth is een landelijk werkend creatief groeibureau voor branding, webdesign, marketing en configurators met CRM, voor bedrijven die maatwerk verkopen.">
<link rel="canonical" href="https://nextgrowthdigital.nl/">
<meta property="og:title" content="Creatief groeibureau: branding, webdesign, marketing | Next Growth">
<meta property="og:description" content="Next Growth is een landelijk werkend creatief groeibureau voor branding, webdesign, marketing en configurators met CRM, voor bedrijven die maatwerk verkopen.">
<meta property="og:image" content="https://nextgrowthdigital.nl/assets/hero.webp">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,900;125,900&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Yantramanav:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: pikzwart canvas, één hi-vis signaalkleur, enorme uitgebouwde hoofdletters. Het product (configurator, websites) als beeldmateriaal. Alles single-theme, bewust donker. */
:root{
  --bg:#0A0A0A; --bg-2:#111111; --bg-3:#181818; --line:#262626;
  --fg:#EDEDEA; --muted:#9A9A96;
  --sig:#FFC400; --sig-ink:#0A0800;
  --cream:#E9E8E3; --cream-ink:#0A0A0A; --cream-muted:#5E5E5A; --cream-line:#D3D2CC;
  --display:'Archivo','Arial Black','Helvetica Neue',Arial,sans-serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{overflow-x:clip;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:500 17px/1.6 var(--body);overflow-x:clip;-webkit-font-smoothing:antialiased;cursor:none}
@media(pointer:coarse){body{cursor:auto}}
.wrap{max-width:1440px;margin-inline:auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:900;font-stretch:100%;text-transform:uppercase;line-height:.92;letter-spacing:-.025em;text-wrap:balance}
.sig{color:var(--sig)}
p{margin:0}
a{color:inherit}
img{display:block;max-width:100%;height:auto}
button{font:inherit}
:focus-visible{outline:3px solid var(--sig);outline-offset:3px}
.mono{font:500 11.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase}
.eyebrow{display:flex;align-items:center;gap:12px;color:var(--sig)}
.eyebrow::before{content:"";width:10px;height:10px;background:var(--sig)}
.btn{display:inline-flex;align-items:center;gap:12px;font:700 15px var(--body);padding:16px 26px;border-radius:999px;border:1.5px solid transparent;text-decoration:none;cursor:none;white-space:nowrap;background:var(--sig);color:var(--sig-ink)}
@media(pointer:coarse){.btn{cursor:pointer}}
.btn.ghost{background:transparent;border-color:rgba(244,241,234,.3);color:var(--fg)}
.btn.ink{background:var(--cream-ink);color:var(--cream)}
.btn .i{width:30px;height:30px;border-radius:50%;background:var(--sig-ink);color:var(--sig);display:grid;place-items:center;font-size:14px;margin:-6px -10px -6px 2px}
.btn.ghost .i{background:var(--fg);color:var(--bg)}
.btn.ink .i{background:var(--sig);color:var(--sig-ink)}

/* cursor */
#cursor{position:fixed;left:0;top:0;width:14px;height:14px;border-radius:50%;background:var(--sig);pointer-events:none;z-index:200;mix-blend-mode:difference;transform:translate(-50%,-50%)}
#cursor.big{width:72px;height:72px;background:var(--fg)}
@media(pointer:coarse){#cursor{display:none}}

/* intro */
.intro{position:fixed;inset:0;z-index:100;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;justify-content:space-between;padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
.intro .top{display:flex;justify-content:space-between;align-items:center}
.intro .word{font:900 clamp(56px,15vw,220px)/.85 var(--display);font-stretch:125%;text-transform:uppercase;letter-spacing:-.02em;display:flex;flex-wrap:wrap;gap:0 .25em}
.intro .word span{display:inline-block;overflow:hidden}
.intro .word i{display:inline-block;font-style:normal}
.intro .count{font:900 clamp(40px,8vw,120px)/1 var(--display);font-stretch:125%;color:var(--sig);font-variant-numeric:tabular-nums}
.intro .bar{height:3px;background:var(--line);margin-top:20px;overflow:hidden}
.intro .bar b{display:block;height:100%;background:var(--sig);transform-origin:left}
.intro .bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.intro button{background:none;border:1.5px solid var(--line);color:var(--fg);border-radius:999px;padding:10px 18px;font:600 13px var(--body);cursor:pointer}

/* nav */
.nav{position:fixed;top:0;left:0;right:0;z-index:50;color:#fff;background:rgba(10,10,10,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.nav .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.nav .brand-l{display:flex;align-items:center;gap:10px;text-decoration:none}
.nav .brand-l .ring{width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);display:grid;place-items:center;font:900 15px var(--display)}
.nav .brand-l div{font:600 12px/1.25 var(--body)}.nav .brand-l small{display:block;font-weight:400;color:var(--muted)}
.nav .mark{width:44px;height:44px;border-radius:10px;background:var(--sig);display:grid;place-items:center;justify-self:center;text-decoration:none;transform:rotate(-4deg)}
.nav .mark svg{width:26px;height:26px}
.nav .right{display:flex;justify-content:flex-end;align-items:center;gap:26px}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:900 18px var(--display);font-stretch:125%;text-transform:uppercase;letter-spacing:-.01em}
.brand .m{width:28px;height:28px;background:var(--sig);border-radius:6px;display:grid;place-items:center}
.brand .m svg{width:18px;height:18px}
.nav nav{display:flex;gap:26px;font:500 14px var(--body)}
.nav nav a{text-decoration:none;opacity:.75}.nav nav a:hover{opacity:1}
.nav .cta{display:flex;align-items:center;gap:14px}
.nav .tel{font:500 13px var(--mono);text-decoration:none;opacity:.75}
.nav .pill{border:1.5px solid rgba(255,255,255,.6);border-radius:999px;padding:10px 18px;font:700 14px var(--body);text-decoration:none}
#menuBtn{display:none;background:none;border:1.5px solid #fff;color:#fff;border-radius:999px;padding:9px 16px;font:700 13px var(--body);cursor:pointer}
@media(max-width:1100px){.nav nav,.nav .tel,.nav .pill{display:none}#menuBtn{display:block}.nav .brand-l div{display:none}}
.menu{position:fixed;inset:0;z-index:60;background:var(--sig);color:var(--sig-ink);padding:calc(24px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px));display:flex;flex-direction:column}
.menu .close{align-self:flex-end;background:none;border:1.5px solid var(--sig-ink);border-radius:999px;padding:9px 16px;font:700 13px var(--body);cursor:pointer}
.menu a{font:900 clamp(30px,8vw,72px)/1 var(--display);font-stretch:125%;text-transform:uppercase;text-decoration:none;padding:10px 0;border-bottom:2px solid var(--sig-ink)}
.menu .ft{margin-top:auto;font:500 13px var(--mono)}

/* hero */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;isolation:isolate}
.hero .bg{position:absolute;inset:0;z-index:-2}
.hero .bg img{width:100%;height:100%;object-fit:cover;object-position:55% 50%}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(7,7,7,.55) 0%,rgba(7,7,7,.25) 40%,rgba(7,7,7,.85) 100%)}
.hero .top{padding-top:140px}
.hero h1{font-size:clamp(36px,5.2vw,78px);max-width:11em}
.hero .lead{max-width:30em;color:rgba(244,241,234,.8);margin-top:24px;font-size:clamp(16px,1.3vw,19px)}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.hero .giant{font:900 clamp(56px,11.6vw,176px)/.8 var(--display);font-stretch:125%;text-transform:uppercase;letter-spacing:-.03em;white-space:nowrap;margin-top:48px;margin-bottom:-.06em;color:var(--fg);display:flex;justify-content:space-between}
.hero .giant span{display:inline-block}
.hero .meta{display:flex;justify-content:space-between;gap:16px;padding:18px 0 22px;border-top:1px solid rgba(244,241,234,.2);margin-top:12px;color:rgba(244,241,234,.7)}
@media(max-width:700px){.hero .meta{flex-direction:column;gap:6px}}

/* zwevende elementen in hero */
.float{position:absolute;z-index:3;pointer-events:none}
.chip{background:var(--fg);color:var(--bg);border-radius:12px;padding:12px 16px;font:600 13px/1.3 var(--body);box-shadow:0 30px 60px -20px rgba(0,0,0,.7);display:flex;gap:12px;align-items:center;min-width:220px}
.chip .ic{width:34px;height:34px;border-radius:50%;background:var(--sig);display:grid;place-items:center;font:900 13px var(--display);color:var(--sig-ink);flex:none}
.chip small{display:block;font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#6B6B66;margin-bottom:2px}
.chip.sigc{background:var(--sig);color:var(--sig-ink)}.chip.sigc .ic{background:var(--sig-ink);color:var(--sig)}.chip.sigc small{color:rgba(10,8,0,.6)}
.win{width:min(40vw,420px);border-radius:14px;overflow:hidden;border:1px solid rgba(244,241,234,.25);background:var(--bg-2);box-shadow:0 50px 100px -30px rgba(0,0,0,.9);pointer-events:auto}
.win .wb{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--bg);font:500 11px var(--mono);color:var(--muted);letter-spacing:.06em}
.win .wb i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.win .wb span{margin-left:auto;color:#3DFF8C}
.win video{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}
.f1{right:max(24px,env(safe-area-inset-right,0px));top:14%}
.f2{right:12%;top:52%}
.f3{right:23%;top:72%}
.f4{right:5%;top:66%}
@media(max-width:1100px){.win{width:min(50vw,360px)}.f3{display:none}}
@media(max-width:860px){.float{display:none}}

/* draaiende badge */
.badge{width:150px;height:150px;position:relative;flex:none}
.badge svg{width:100%;height:100%;overflow:visible}
.badge text{font:900 13.5px var(--display);letter-spacing:.2em;text-transform:uppercase;fill:currentColor}
.badge .c{position:absolute;inset:0;display:grid;place-items:center;font:900 34px var(--display);font-stretch:125%}

/* engine filmstrip */
.strip{background:var(--bg);padding-block:clamp(60px,8vw,110px) 0;overflow:hidden}
.strip .wrap{margin-bottom:34px}
.film{display:flex;gap:16px;width:max-content;padding-bottom:clamp(60px,8vw,110px)}
.frame{width:min(70vw,420px);flex:none;border-radius:14px;overflow:hidden;background:var(--bg-3);border:1px solid var(--line);position:relative}
.frame video{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.frame .lbl{position:absolute;left:12px;bottom:12px;background:rgba(7,7,7,.75);backdrop-filter:blur(6px);color:var(--fg);padding:7px 11px;border-radius:6px;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.frame .lbl b{color:var(--sig);font-weight:500}

/* video in kaarten & cases */
.card .shot video{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.case .vid{margin:-28px -28px 0;aspect-ratio:16/9;background:#000;overflow:hidden;border-bottom:1px solid rgba(244,241,234,.12)}
.case .vid video{width:100%;height:100%;object-fit:cover;display:block}
.case{min-height:0}

/* pijlen */
.arrow-draw{position:absolute;pointer-events:none;color:var(--sig)}
.arrow-draw path{fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.contact .arrow-draw{right:46%;top:12%;width:120px;color:var(--sig-ink);transform:rotate(20deg)}
.prob{position:relative}
.prob .arrow-draw{left:46%;top:-20px;width:110px;transform:rotate(60deg)}
@media(max-width:860px){.arrow-draw{display:none}}

/* ticker */
.ticker{background:var(--sig);color:var(--sig-ink);overflow:hidden;padding:16px 0;border-top:3px solid var(--sig-ink)}
.ticker .row{display:flex;width:max-content;font:900 clamp(20px,2.6vw,34px) var(--display);font-stretch:125%;text-transform:uppercase;white-space:nowrap}
.ticker .row span{padding-right:.8em}
.ticker .row span::after{content:"•";padding-left:.8em;opacity:.5}

/* generic sections */
section{padding-block:clamp(80px,10vw,150px)}
.cream{background:var(--cream);color:var(--cream-ink)}
.cream .eyebrow{color:var(--cream-ink)}.cream .eyebrow::before{background:var(--sig)}
.head{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,.55fr);gap:40px;align-items:end;margin-bottom:clamp(40px,5vw,72px)}
.head h2{font-size:clamp(38px,5.4vw,88px)}
.head p{font-size:18px;max-width:28em;color:var(--muted)}
.cream .head p{color:var(--cream-muted)}
.head .eyebrow{margin-bottom:24px}
@media(max-width:860px){.head{grid-template-columns:1fr;gap:20px}}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:3px solid var(--cream-ink)}
.stat{padding:34px 24px 34px 0;border-bottom:1px solid var(--cream-line)}
.stat+.stat{border-left:1px solid var(--cream-line);padding-left:24px}
.stat b{display:block;font:900 clamp(44px,5.6vw,92px)/.9 var(--display);font-stretch:125%;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{display:block;margin-top:14px;color:var(--cream-muted);font-size:15px;max-width:16em}
@media(max-width:860px){.stats{grid-template-columns:1fr 1fr}.stat:nth-child(3){border-left:0;padding-left:0}}
@media(max-width:480px){.stats{grid-template-columns:1fr}.stat+.stat{border-left:0;padding-left:0}}

/* probleem */
.prob{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(30px,6vw,90px);align-items:start}
.prob h2{font-size:clamp(38px,5.2vw,84px)}
.prob .list{border-top:3px solid var(--fg)}
.prob .row{display:grid;grid-template-columns:60px 1fr;gap:16px;padding:26px 0;border-bottom:1px solid var(--line);font-size:clamp(17px,1.5vw,22px);font-weight:600}
.prob .row span{font:500 12px/2.2 var(--mono);color:var(--sig)}
.prob .punch{margin-top:30px;font:900 clamp(24px,2.6vw,36px)/1 var(--display);font-stretch:125%;text-transform:uppercase}
@media(max-width:860px){.prob{grid-template-columns:1fr}}

/* demo */
.demo{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--bg-2)}
.demo .bar{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);color:var(--muted)}
.demo .bar .url{flex:1;background:var(--bg);border-radius:6px;padding:7px 12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:400 12.5px var(--mono)}
.demo .bar .live{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.demo .bar .live::before{content:"";width:8px;height:8px;border-radius:50%;background:#3DFF8C;box-shadow:0 0 0 4px rgba(61,255,140,.15)}
.demo .grid{display:grid;grid-template-columns:minmax(0,1fr) 340px}
.stage{position:relative;aspect-ratio:3/2;background:var(--bg-3);overflow:hidden}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage .tag{position:absolute;left:18px;bottom:18px;background:var(--sig);color:var(--sig-ink);padding:9px 14px;border-radius:6px;font:700 13px var(--body)}
.opts{padding:24px;display:flex;flex-direction:column;gap:8px;border-left:1px solid var(--line)}
.opts h3{font-size:30px;margin:6px 0 10px}
.opt{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--fg);text-align:left;font:600 15px var(--body);cursor:none;width:100%}
@media(pointer:coarse){.opt{cursor:pointer}}
.opt img{width:48px;height:32px;object-fit:cover;border-radius:4px;flex:none}
.opt .hl{position:absolute;inset:-1px;border-radius:10px;background:var(--sig);z-index:-1}
.opt[aria-pressed=true]{color:var(--sig-ink);border-color:var(--sig)}
.opts .desc{color:var(--muted);font-size:14px;margin-top:6px;min-height:3em}
.opts .btn{margin-top:auto;justify-content:center}
@media(max-width:900px){.demo .grid{grid-template-columns:1fr}.opts{border-left:0;border-top:1px solid var(--line)}.opts .desc{min-height:0}}

/* fan / werk */
.fan-wrap{position:relative;overflow:hidden;padding-block:20px 10px}
.fan{display:flex;gap:22px;width:max-content;padding-inline:max(24px,env(safe-area-inset-left,0px));cursor:grab}
.fan:active{cursor:grabbing}
.card{width:min(78vw,560px);flex:none;background:var(--bg-2);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-decoration:none;color:var(--fg)}
.card .shot{position:relative;aspect-ratio:8/5;background:var(--bg-3);overflow:hidden}
.card .shot img.lap{width:100%;height:100%;object-fit:cover;object-position:top}
.card .shot img.ph{position:absolute;right:6%;bottom:-8%;width:23%;border-radius:10px;box-shadow:0 24px 50px -16px rgba(0,0,0,.8)}
.card .meta{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 20px}
.card .meta b{font:900 20px var(--display);font-stretch:125%;text-transform:uppercase}
.card .meta span{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right}
.fan-ctl{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.fan-ctl button{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:none;color:var(--fg);font-size:18px;cursor:pointer}
.fan-ctl button:hover{background:var(--sig);color:var(--sig-ink);border-color:var(--sig)}

/* story (pinned) */
.story{position:relative;height:300vh;padding:0}
.story .pin{position:sticky;top:0;height:100svh;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.story h2{font-size:clamp(34px,5.6vw,88px)}
.story .ticket{margin-top:36px;border:1px solid var(--line);border-radius:14px;background:var(--bg-2);overflow:hidden}
.story .tt{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:16px 22px;border-bottom:1px solid var(--line);font:500 13px var(--mono);color:var(--muted)}
.story .tt b{color:var(--fg);font-weight:500}
.story .steps{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));padding:26px 22px 28px;position:relative}
.story .track{position:absolute;left:22px;right:22px;top:38px;height:2px;background:var(--line)}
.story .track b{display:block;height:100%;background:var(--sig);transform-origin:left}
.story .st{position:relative;padding-right:12px}
.story .st i{display:block;width:12px;height:12px;border-radius:50%;background:var(--bg-2);border:2px solid var(--line);margin-bottom:16px;position:relative;z-index:1}
.story .st span{display:block;font:500 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.story .st small{display:block;font-size:13px;color:var(--muted);margin-top:6px}
.story .big{margin-top:30px;font:900 clamp(20px,2.4vw,32px)/1 var(--display);font-stretch:125%;text-transform:uppercase;min-height:1.2em}
@media(max-width:960px){.story .steps{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:24px}.story .track{display:none}.story{height:300vh}}
@media(max-width:520px){.story .steps{grid-template-columns:1fr 1fr}.story .st small{display:none}}

/* sectoren */
.sect{display:flex;flex-wrap:wrap;gap:10px}
.sect span{display:inline-block;padding:14px 22px;border:1.5px solid var(--cream-ink);border-radius:999px;font:900 clamp(16px,1.6vw,22px) var(--display);font-stretch:125%;text-transform:uppercase;color:var(--cream-ink)}
/* collabs */
.collab{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.85fr) minmax(0,.85fr);gap:18px}
.ct{border-radius:16px;overflow:hidden;text-decoration:none;color:var(--fg);display:flex;flex-direction:column;background:var(--bg-2);border:1px solid var(--line);min-height:380px}
.ct-vid video{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;display:block}
.ct-meta{padding:22px}
.ct b{display:block;font:900 clamp(24px,2.4vw,34px)/1 var(--display);font-stretch:125%;text-transform:uppercase;margin:10px 0 12px}
.ct p{color:var(--muted);font-size:15px}
.ct .mono{color:var(--muted)}
.ct-sig{background:var(--sig);color:var(--sig-ink);border-color:var(--sig);padding:24px}
.ct-sig .mono,.ct-sig p{color:rgba(10,8,0,.7)}
.ct-sig ul{list-style:none;margin:auto 0 0;padding:0;display:grid;gap:10px;font-weight:600;font-size:15px}
.ct-sig li{border-top:1.5px solid rgba(10,8,0,.25);padding-top:10px}
.ct-you{padding:24px;border:2px dashed var(--line);background:transparent;justify-content:flex-end}
.ct-you .go{width:56px;height:56px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:22px;margin-top:20px}
.logos{overflow:hidden;margin-top:44px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 0}
.logos .row{display:flex;width:max-content;gap:0;font:900 clamp(18px,2vw,26px) var(--display);font-stretch:125%;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.logos .row span{padding-right:1.2em}.logos .row span::after{content:"✦";color:var(--sig);padding-left:1.2em}
@media(max-width:960px){.collab{grid-template-columns:1fr 1fr}.ct-vid{grid-column:1/-1}}
@media(max-width:560px){.collab{grid-template-columns:1fr}}
/* cases */
.cases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.case{background:var(--cream-ink);color:var(--cream);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:18px;min-height:380px}
.case .who{display:flex;justify-content:space-between;font:500 12px var(--mono);letter-spacing:.06em;color:rgba(244,241,234,.6)}
.case .who .st::before{content:"● ";color:#3DFF8C}
.case h3{font-size:clamp(34px,3.6vw,52px)}
.case dl{margin:auto 0 0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;border-top:1px solid rgba(244,241,234,.18);padding-top:16px}
.case dt{font:500 11px/1.9 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:rgba(244,241,234,.6)}
.case dd{margin:0}.case dd.res{color:var(--sig);font-weight:700}
.case a{color:var(--sig);font-weight:700;text-decoration:none;border-bottom:2px solid var(--sig);align-self:flex-start;padding-bottom:2px}
@media(max-width:960px){.cases{grid-template-columns:1fr}}

/* parts */
.parts{border-top:3px solid var(--fg)}
.part{display:grid;grid-template-columns:80px minmax(0,1fr) minmax(0,1.1fr) 60px;gap:24px;align-items:center;padding:30px 0;border-bottom:1px solid var(--line);text-decoration:none}
.part .n{font:500 13px var(--mono);color:var(--sig)}
.part h3{font-size:clamp(26px,3.2vw,44px)}
.part p{color:var(--muted);font-size:16px}
.part .go{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:20px;justify-self:end}
@media(max-width:860px){.part{grid-template-columns:50px minmax(0,1fr);row-gap:10px}.part p{grid-column:2}.part .go{display:none}}

/* contact */
.contact{background:var(--sig);color:var(--sig-ink);position:relative;overflow:hidden}
.contact .wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(32px,6vw,96px);align-items:start;position:relative}
.contact h2{font-size:clamp(48px,8vw,132px);line-height:.85}
.contact .sub{margin-top:28px;max-width:26em;font-size:18px;font-weight:600}
.contact ul{list-style:none;margin:24px 0 0;padding:0;display:grid;gap:8px;font-weight:600}
.contact li::before{content:"→ "}
.contact .alt{margin-top:28px;font:500 14px var(--mono)}
.contact .alt b{user-select:all;font-weight:700}
form{background:var(--cream-ink);color:var(--cream);border-radius:18px;padding:30px;display:grid;gap:16px}
form label{display:grid;gap:6px;font:600 13px var(--body);color:rgba(244,241,234,.7)}
form input,form select{font:500 16px var(--body);padding:14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
form .err{color:#FF7A6B;font-size:13px;min-height:1.2em;font-weight:500}
form .fine{font-size:13px;color:rgba(244,241,234,.6)}
#sent{display:none;border:1px solid var(--sig);border-radius:8px;padding:14px;font-size:15px}
#sent.on{display:block}
@media(max-width:860px){.contact .wrap{grid-template-columns:1fr}}

footer{background:var(--bg);padding-block:50px;color:var(--muted);font-size:14px}
footer .wrap{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr 1fr;gap:30px}
footer h4{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg);margin:0 0 14px}
footer ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
footer a{text-decoration:none}footer a:hover{color:var(--sig)}
footer .brand{color:var(--fg);margin-bottom:12px}
footer .legal{grid-column:1/-1;border-top:1px solid var(--line);padding-top:20px;display:flex;flex-wrap:wrap;gap:8px 24px;font:500 12px var(--mono)}
@media(max-width:1000px){footer .wrap{grid-template-columns:1fr 1fr 1fr}}@media(max-width:860px){footer .wrap{grid-template-columns:1fr 1fr}}
@media(max-width:520px){footer .wrap{grid-template-columns:1fr}}

.reveal-word{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.08em;margin-bottom:-.08em}
.reveal-word>span{display:inline-block}

/* ===== pagina's ===== */
.page-hero{position:relative;padding:150px 0 70px;overflow:hidden;isolation:isolate;min-height:72svh;display:flex;align-items:flex-end}
.page-hero .bgimg{position:absolute;inset:0;z-index:-2}
.page-hero .bgimg img{width:100%;height:100%;object-fit:cover}
.page-hero.has-img::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(7,7,7,.6),rgba(7,7,7,.35) 45%,rgba(7,7,7,.9))}
.page-hero h1{font-size:clamp(34px,5.2vw,80px);max-width:12em}
.page-hero .def{max-width:38em;margin-top:26px;font-size:clamp(17px,1.4vw,20px);color:rgba(244,241,234,.85)}
.page-hero .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.page-hero .crumbs{display:flex;gap:10px;font:500 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:22px}
.page-hero .crumbs a{text-decoration:none}.page-hero .crumbs a:hover{color:var(--sig)}
.page-hero .bigword{position:absolute;right:-2vw;bottom:-.1em;font:900 clamp(90px,22vw,340px)/.8 var(--display);font-stretch:125%;text-transform:uppercase;color:transparent;-webkit-text-stroke:2px rgba(244,241,234,.14);z-index:-1;white-space:nowrap;pointer-events:none}
.editorial{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(30px,6vw,90px)}
.editorial .lead{font:700 clamp(20px,2vw,27px)/1.35 var(--body)}
.editorial .ed-intro p+p{margin-top:16px}
.editorial .ed-intro{font-size:18px;color:var(--muted)}
.cream .editorial .ed-intro{color:var(--cream-muted)}
.secs{display:grid;gap:0;margin-top:40px;border-top:3px solid currentColor}
.sec{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:24px;padding:28px 0;border-bottom:1px solid var(--line)}
.cream .sec{border-color:var(--cream-line)}
.sec h2{font-size:clamp(22px,2.2vw,32px)}
.sec p{color:var(--muted);font-size:16px}
.cream .sec p{color:var(--cream-muted)}
@media(max-width:860px){.editorial,.sec{grid-template-columns:1fr}}
.feat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.feat div{border:1px solid var(--line);border-radius:14px;padding:22px;background:var(--bg-2)}
.feat b{display:block;font:900 20px var(--display);font-stretch:125%;text-transform:uppercase;margin-bottom:8px}
.feat p{color:var(--muted);font-size:15px}
.cream .feat div{background:#fff;border-color:var(--cream-line)}.cream .feat p{color:var(--cream-muted)}
@media(max-width:860px){.feat{grid-template-columns:1fr 1fr}}@media(max-width:520px){.feat{grid-template-columns:1fr}}
.mods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.mod{border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px;min-height:150px;background:var(--bg-2)}
.mod .tag{align-self:flex-start;font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:5px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.mod .tag.extra{background:var(--sig);color:var(--sig-ink);border-color:var(--sig)}
.mod b{font:900 18px/1.05 var(--display);font-stretch:125%;text-transform:uppercase}
.mod p{color:var(--muted);font-size:14px}
@media(max-width:1000px){.mods{grid-template-columns:1fr 1fr}}@media(max-width:520px){.mods{grid-template-columns:1fr}}
.faqs details{border-top:1px solid var(--line)}.faqs details:last-child{border-bottom:1px solid var(--line)}
.faqs summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:20px;padding:20px 0;font:900 clamp(17px,1.5vw,22px)/1.1 var(--display);font-stretch:125%;text-transform:uppercase}
.faqs summary::-webkit-details-marker{display:none}.faqs summary::after{content:"+";color:var(--sig);font-size:26px;line-height:1}
.faqs details[open] summary::after{content:"–"}
.faqs details p{padding:0 0 22px;color:var(--muted);max-width:44em}
.cities{display:flex;flex-wrap:wrap;gap:8px}
.cities span{padding:9px 14px;border:1px solid var(--line);border-radius:999px;font:500 12.5px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.related{display:flex;flex-wrap:wrap;gap:10px}
.related a{text-decoration:none;border:1.5px solid var(--fg);border-radius:999px;padding:12px 20px;font:700 14px var(--body)}
.related a:hover{background:var(--sig);color:var(--sig-ink);border-color:var(--sig)}
.steps4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:3px solid var(--fg)}
.steps4 div{padding:26px 20px 26px 0;border-bottom:1px solid var(--line)}
.steps4 div+div{border-left:1px solid var(--line);padding-left:20px}
.steps4 .n{font:500 12px var(--mono);color:var(--sig)}
.steps4 b{display:block;font:900 24px var(--display);font-stretch:125%;text-transform:uppercase;margin:10px 0 8px}
.steps4 p{color:var(--muted);font-size:15px}
@media(max-width:900px){.steps4{grid-template-columns:1fr 1fr}.steps4 div:nth-child(3){border-left:0;padding-left:0}}
@media(max-width:520px){.steps4{grid-template-columns:1fr}.steps4 div+div{border-left:0;padding-left:0}}
.incl{columns:2;gap:40px}
.incl li{break-inside:avoid;padding:12px 0;border-bottom:1px solid var(--line);list-style:none;font-weight:600;display:flex;gap:12px}
.incl li::before{content:"✓";color:var(--sig);font-weight:900}
.incl{margin:0;padding:0}
@media(max-width:700px){.incl{columns:1}}
.bgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.bgrid a{position:relative;text-decoration:none;color:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;aspect-ratio:4/5;display:flex;flex-direction:column;justify-content:flex-end;background:var(--bg-2);isolation:isolate}
.bgrid a img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;transition:transform .6s ease}
.bgrid a::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.82) 100%)}
.bgrid a:hover img{transform:scale(1.05)}
.bgrid a .bt{padding:16px 16px 18px;display:flex;flex-direction:column;gap:6px}
.bgrid a b{font:900 clamp(16px,1.25vw,19px)/1.05 var(--display);font-stretch:125%;text-transform:uppercase;overflow-wrap:anywhere;color:#fff}
.bgrid a span{font:400 12.5px/1.4 var(--body);color:rgba(255,255,255,.78);text-transform:none;letter-spacing:0}
.bgrid a .go{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;background:var(--sig);color:var(--sig-ink);display:grid;place-items:center;font-weight:900}
@media(max-width:1000px){.bgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:600px){.bgrid{grid-template-columns:1fr 1fr}}
.proofrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.proofrow .pc{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--bg-2);text-decoration:none;color:var(--fg)}
.proofrow video,.proofrow img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;display:block}
.proofrow .vid{position:relative;aspect-ratio:16/10;overflow:hidden;background:#000}
.proofrow .vid .bg{position:absolute;inset:-10%;background-size:cover;background-position:center;filter:blur(30px) brightness(.45)}
.proofrow .vid video{position:relative;width:100%;height:100%;aspect-ratio:auto;object-fit:contain;object-position:center}
.proofrow .pm{padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.proofrow .pm b{font:900 16px var(--display);font-stretch:125%;text-transform:uppercase}
.proofrow .pm span{font:500 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:right}

/* ===== home, Mr Boost-opbouw ===== */
.hv{--acc:#BFEF3A;position:relative;min-height:100svh;overflow:hidden;background:#0A0A0A;color:#fff;display:flex;align-items:flex-end;isolation:isolate}
.hv .media{position:absolute;inset:0;z-index:0;background:#0A0A0A}
.hv .media video,.hv .media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 28%}
.hv .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.32) 0%,rgba(0,0,0,.08) 32%,rgba(0,0,0,.14) 58%,rgba(0,0,0,.72) 100%)}
.hv .shade2{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.18) 45%,rgba(0,0,0,0) 70%);transition:opacity .6s}
.hv .deco{position:absolute;left:0;right:0;top:9%;z-index:1;text-align:center;pointer-events:none;font:900 clamp(120px,26vw,420px)/.8 var(--display);font-stretch:125%;letter-spacing:-.02em;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.42);opacity:.9;will-change:transform;-webkit-mask-image:radial-gradient(ellipse 15% 70% at 50% 40%,transparent 0 55%,#000 100%);mask-image:radial-gradient(ellipse 15% 70% at 50% 40%,transparent 0 55%,#000 100%)}
.hv .deco b{color:transparent;-webkit-text-stroke:1.5px var(--acc)}
.hv .content{position:relative;z-index:3;width:100%;padding:150px 0 112px}
.hv .col{max-width:min(100%,12.5em);font-size:clamp(44px,6.2vw,104px)}
.hv h1{font-size:1em;line-height:.9;letter-spacing:-.035em;text-transform:uppercase;margin:0;text-shadow:0 6px 40px rgba(0,0,0,.45)}
.hv h1 .ln{display:block;white-space:nowrap}
.hv h1 .ch{display:inline-block;will-change:transform}
.hv h1 .sp{display:inline-block;width:.26em}
.hv h1 .dot{color:var(--acc);transition:color .6s}
.hv .lead{margin:22px 0 0;max-width:32em;font-size:clamp(15px,1.25vw,18px);line-height:1.55;color:rgba(255,255,255,.92);text-shadow:0 2px 18px rgba(0,0,0,.6)}
.hv .cta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:28px}
.hv .btn{position:relative;overflow:hidden;cursor:pointer;transition:transform .25s ease,box-shadow .25s ease,border-color .25s}
.hv .btn::after{content:"";position:absolute;top:-40%;bottom:-40%;left:-30%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-120%) skewX(-18deg);transition:transform .7s ease;pointer-events:none}
.hv .btn:hover::after,.hv .btn:focus-visible::after{transform:translateX(420%) skewX(-18deg)}
.hv .btn:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(0,0,0,.35)}
.hv .btn:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.hv .btn.glass{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.45);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hv .btn.glass::after{background:linear-gradient(100deg,transparent,rgba(255,255,255,.25),transparent)}
.hv .ctrl{position:absolute;right:max(24px,env(safe-area-inset-right,0px));bottom:max(24px,env(safe-area-inset-bottom,0px));z-index:4;display:flex;align-items:center;gap:12px}
.hv .pz{display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,.45);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:9px 14px;font:600 12px var(--body);cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hv .pz:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.hv .pz i{width:8px;height:8px;border-radius:50%;background:var(--acc);font-style:normal;transition:background .6s}
.hv .scenes{display:flex;gap:6px}
.hv .scenes span{width:22px;height:4px;border-radius:2px;background:rgba(255,255,255,.3);transition:background .4s}
.hv .scenes span.on{background:var(--acc)}
.hv .mono.tag{position:absolute;left:0;right:0;top:92px;z-index:3;text-align:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.75);pointer-events:none}
@media(max-width:700px){
  .hv{min-height:100svh}
  .hv .media{top:60px}.hv .media video,.hv .media img{object-position:50% 0%}
  .hv .shade{background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,.05) 28%,rgba(0,0,0,.25) 55%,rgba(0,0,0,.82) 100%)}
  .hv .shade2{display:none}
  .hv .deco{top:12%;font-size:30vw;-webkit-mask-image:radial-gradient(ellipse 30% 60% at 50% 45%,transparent 0 50%,#000 100%);mask-image:radial-gradient(ellipse 30% 60% at 50% 45%,transparent 0 50%,#000 100%)}
  .hv .content{padding:140px 0 118px}
  .hv .col{font-size:9vw;max-width:100%}
  .hv .lead{font-size:15px;max-width:28em}
  .hv .cta{gap:10px}.hv .cta .btn{padding:13px 20px;font-size:14px}
  .hv .ctrl{left:16px;right:auto;bottom:18px}
  .hv .scenes{display:none}
}
@media(prefers-reduced-motion:reduce){.hv .btn::after{display:none}.hv .btn:hover{transform:none}}
.btn.white{background:#fff;color:#0A0A0A;border-color:#fff;padding:14px 24px}
.play{display:inline-flex;align-items:center;gap:12px;text-decoration:none;font:500 14px var(--body);color:var(--fg);cursor:pointer;background:none;border:0}
.play i{width:40px;height:40px;border-radius:50%;background:var(--sig);display:grid;place-items:center;color:var(--sig-ink);font-size:13px;font-style:normal;box-shadow:0 0 0 0 rgba(255,196,0,.5);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,196,0,.45)}70%{box-shadow:0 0 0 16px rgba(255,196,0,0)}100%{box-shadow:0 0 0 0 rgba(255,196,0,0)}}
.showreel{padding:30px 0 0}
.panel{position:relative;border-radius:22px;overflow:hidden;background:#000;aspect-ratio:16/8.5;box-shadow:0 80px 120px -60px rgba(0,0,0,.9);display:grid;place-items:center}
.panel .blur{position:absolute;inset:-10%;background-size:cover;background-position:center;filter:blur(40px) brightness(.35);transform:scale(1.1)}
.panel .reel{position:relative;height:100%;aspect-ratio:9/16;object-fit:cover;border-radius:0}
.panel.tri{aspect-ratio:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;place-items:stretch;background:#0A0A0A}
.panel.tri .trc{position:relative;aspect-ratio:4/5;overflow:hidden;border-right:1px solid rgba(255,255,255,.08);background:#0A0A0A}
.panel.tri .trc:last-child{border-right:0}
.panel.tri .trc .bgp{position:absolute;inset:-12%;background-position:center;background-size:cover;filter:blur(34px) brightness(.55) saturate(1.1)}
.panel.tri .trc video{position:relative;width:100%;height:100%;object-fit:contain;display:block}

/* ---------- branchewerelden: elke branche een eigen hero en palet ---------- */

.wh{position:relative;overflow:hidden;isolation:isolate;padding:132px 0 70px;min-height:86svh;display:flex;align-items:center}

.wh .crumbs{display:flex;gap:10px;font:500 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}

.wh.serif h1 .sig{font-style:italic;font-weight:600}
.wh .def{max-width:34em;margin-top:22px;font-size:clamp(16px,1.3vw,19px);line-height:1.55;color:var(--muted)}

.wh .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.wh .chips span{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:8px 12px;border-radius:999px;border:1px solid var(--line);color:var(--fg);background:var(--bg-2)}

.wh.l-split .grid{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center}
.wh .mediacard{position:relative;border-radius:22px;overflow:hidden;background:var(--bg-2);border:1px solid var(--line);box-shadow:0 60px 100px -50px rgba(0,0,0,.8);aspect-ratio:16/10}
.wh .mediacard video,.wh .mediacard img{width:100%;height:100%;object-fit:cover;display:block}

.wh .tape span::after{content:"◆";padding-left:1.4em;opacity:.6}
.wh.l-full{min-height:92svh;align-items:flex-end;padding-bottom:90px}
.wh.l-full .bg{position:absolute;inset:0;z-index:0}
.wh.l-full .bg video,.wh.l-full .bg img{width:100%;height:100%;object-fit:cover}

.wh.l-full .def{color:rgba(255,255,255,.85)}

.wh.l-card{align-items:flex-start;padding-top:140px}

.wh .frame video,.wh .frame img{width:100%;height:100%;object-fit:cover;border-radius:32px;display:block}

.wh .kenteken{display:inline-flex;align-items:stretch;border-radius:8px;overflow:hidden;border:2px solid #0A0A0A;margin-top:26px;box-shadow:0 20px 40px -14px rgba(0,0,0,.8)}

@media(max-width:900px){

igurator voor te bouwen."}, {"q": "Moet ik alles tegelijk afnemen?", "a": "Nee. Je kiest wat je bedrijf nu nodig heeft: branding, een website, marketing of software. De onderdelen zijn los af te nemen en later aan te sluiten. Veel klanten starten met een website en voegen de configurator of het CRM toe zodra de aanvragen toenemen. Alles wat we bouwen blijft jouw eigendom."}, {"q": "Hoe snel kan Next Growth beginnen?", "a": "Laat je nummer achter en we bellen je dezelfde werkdag terug. Tien minuten is genoeg voor prijs en doorlooptijd. Je krijgt iemand aan de lijn die deze systemen zelf bouwt, geen callcenter. Een complete website staat daarna in twee weken live. Bel direct op 06 83 90 21 92 of mail info@nextgrowthdigital.nl."}], "cities": ["Den Bosch", "Nijmegen", "Arnhem", "Eindhoven", "Uden", "Veghel", "Cuijk", "Grave", "Vught", "Wijchen"], "proof": "Prefab Select (+212% aanvragen), Installatieplatform (offerte in 2 minuten) en Lucky Zonwering (5,0 op Google, 124 reviews) laten samen zien wat website, configurator en CRM als één systeem opleveren.", "internal_links": ["dienst-webdesign", "dienst-marketing", "branche-bouwbedrijven"], "jsonld": {"@context": "https://schema.org", "@graph": [{"@type": "WebSite", "@id": "https://nextgrowthdigital.nl/#website", "url": "https://nextgrowthdigital.nl", "name": "Next Growth Digital", "inLanguage": "nl-NL", "publisher": {"@id": "https://nextgrowthdigital.nl/#organization"}}, {"@type": "WebPage", "@id": "https://nextgrowthdigital.nl/home/#webpage", "url": "https://nextgrowthdigital.nl/home", "name": "Creatief groeibureau: branding, webdesign, marketing | Next Growth", "description": "Next Growth is een landelijk werkend creatief groeibureau voor branding, webdesign, marketing en configurators met CRM, voor bedrijven die maatwerk verkopen.", "inLanguage": "nl-NL", "isPartOf": {"@id": "https://nextgrowthdigital.nl/#website"}, "about": {"@id": "https://nextgrowthdigital.nl/#organization"}, "breadcrumb": {"@id": "https://nextgrow {"@type": "Question", "name": "Wat kost een website of configurator bij Next Growth?", "acceptedAnswer": {"@type": "Answer", "text": "Een website heeft een vaste prijs die we vooraf afspreken; een complete zakelijke website begint bij 2.995 euro en een website met CRM bij 6.995 euro. Een configurator wordt op maat begroot: het aantal keuzes in je product en het beeldwerk bepalen de prijs. In tien minuten aan de telefoon hoor je waar je aan toe bent."}}, {"@type": "Question", "name": "Werkt een configurator ook voor mijn branche?", "acceptedAnswer": {"@type": "Answer", "text": "Er draaien er nu tien, voor heel verschillende producten: dakopbouwen, aanbouwen, badkamers, zwembaden, overkappingen, poolhouses, kunstgras, pvc-vloeren en tegelvloeren. De aanpak is steeds dezelfde: je product opgedeeld in de keuzes die je klant echt maakt, met beeld per keuze. Verkoop je iets samenstelbaars, dan is er een configurator voor te bouwen."}}, {"@type": "Question", "name": "Moet ik alles tegelijk afnemen?", "acceptedAnswer": {"@type": "Answer", "text": "Nee. Je kiest wat je bedrijf nu nodig heeft: branding, een website, marketing of software. De onderdelen zijn los af te nemen en later aan te sluiten. Veel klanten starten met een website en voegen de configurator of het CRM toe zodra de aanvragen toenemen. Alles wat we bouwen blijft jouw eigendom."}}, {"@type": "Question", "name": "Hoe snel kan Next Growth beginnen?", "acceptedAnswer": {"@type": "Answer", "text": "Laat je nummer achter en we bellen je dezelfde werkdag terug. Tien minuten is genoeg voor prijs en doorlooptijd. Je krijgt iemand aan de lijn die deze systemen zelf bouwt, geen callcenter. Een complete website staat daarna in twee weken live. Bel direct op 06 83 90 21 92 of mail info@nextgrowthdigital.nl."}}]}, {"@type": "BreadcrumbList", "@id": "https://nextgrowthdigital.nl/home/#breadcrumb", "itemListElement": [{"@type": "ListItem", "position": 1, "name": "Home", "item": "https://nextgrowthdigital.nl/home"}]}]}}, "branche-bouwbedrijven": {"title": "Website voor aannemers en bouwbedrijven | Next Growth", "description": "Website en marketing voor bouwbedrijven en aannemers: projecten als bewijs, pagina per dienst en plaats, uitbouwconfigurator met richtprijs en CRM.", "h1": "Een website voor aannemers en bouwbedrijven die het werk binnenhaalt", "keywords": ["website voor aannemers", "website bouwbedrijf laten maken", "marketing bouwbedrijf", "uitbouw configurator", "website aannemer", "aannemer vindbaar in Google", "website bouwbedrijf Nijmegen", "CRM voor aannemers"], "definition": "Next Growth bouwt websites, marketing en verkoopsoftware voor aannemers en bouwbedrijven in Noord-Brabant, Gelderland en landelijk. Een aannemerssite van ons is een bewijsmachine: projectpagina's met voor en na, reviews met naam en plaats, een pagina per dienst en per werkgebied, en waar het past een uitbouwconfigurator met richtprijs die de aanvraag compleet in je CRM zet. Live in twee weken, vaste prijs, jouw eigendom. Case: Westrik Bouw & Installaties.", "intro": "De meeste aannemers krijgen hun werk via-via, totdat de mond-tot-mondreclame een keer stilvalt. Wie een uitbouw of verbouwing overweegt, googelt eerst weken rond: wat kost het ongeveer, wie doet dit in de buurt, hoe zien hun projecten eruit. Tegen de tijd dat er gebeld wordt, is de beslissing half genomen. Sta je in die oriëntatiefase nergens, dan besta je voor die klant niet. De lat ligt laag: in veel regio's is de nummer één positie voor 'aannemer + plaatsnaam' te winnen met een site die gewoon op orde is.\n\nEen goede aannemerssite is je tweede aanvoerlijn. Hij laat je vakwerk zien, wekt vertrouwen en levert aanvragen op van klanten die al weten wat je waard bent. Met een uitbouwconfigurator doet de klant thuis het voorwerk en praat jij alleen nog met mensen die de richtprijs al kennen en toch doorzetten. Bij Prefab Select leverde die aanpak 212 procent meer aanvragen op. Westrik Bouw & Installaties, Dakcentrale Holland en Heesbeen Dakwerken staan live als voorbeeld.", "sections": [{"h2": "Waarom leveren de meeste aannemerswebsites niets op?", "body": "Wanneer heb je voor het laatst een aanvraag gehad die aantoonbaar via je website binnenkwam? Bij de meeste bouwbedrijven is het antwoord 'geen idee'. De gemiddelde aannemerssite is jaren geleden gebouwd, toont drie verouderde projectfoto's, somt diensten op in één zin en eindigt met een contactformulier dat naar een mailbox stuurt die niemand dagelijks leest. De vijf fouten die we het vaakst zien: de site praat over het bedrijf in plaats van over de klant, het bewijs is verouderd, er staan geen prijsindicaties, de site is traag op mobiel terwijl twee derde van je bezoek op een telefoon zit, en er is geen vervolg na de aanvraag. Die laatste is de duurste, want hij kost de opdrachten die je site wél binnenhaalde."}, {"h2": "Wat doet een goede website voor een bouwbedrijf wél?", "body": "Vertrouwen is in de bouw alles; je vraagt mensen om tienduizenden euro's en wekenlang hun huis. Een goede aannemerssite is daarom vooral een bewijsmachine. Projectpagina's met voor- en nafoto's en een kort, eerlijk verhaal: wat was de vraag, wat deden we, wat kostte het ongeveer. Reviews met naam en woonplaats in plaats van anonieme sterren. Gezichten, want de klant wil weten wie er straks over de vloer komt. Daarnaast heeft elke dienst zijn eigen pagina. 'Wij doen aanbouw, verbouw en renovatie' op één pagina rankt nergens op. En elke pagina eindigt bij een volgende stap die past bij de fase van de klant: richtprijs berekenen, belafspraak of offerteaanvraag. Drie drempels in oplopende hoogte."}, {"h2": "Wat doet een uitbouwconfigurator voor een aannemer?", "body": "Elke aannemer kent de vraag 'wat kost een uitbouw ongeveer?'. Een eerlijke prijs noemen kan niet zonder maten en wensen, dus volgt een bezoek, een middag rekenen en een offerte, waarna de helft nooit meer iets laat horen. De configurator draait dat om. De klant stelt thuis zijn uitbouw samen: afmetingen, gevelafwerking, dakbedekking, kozijnen, afwerkingsniveau, en ziet direct een richtprijs. De aanvraag komt compleet binnen en daar maak je in een half uur een serieuze offerte van. Hij werkt dag en nacht, dus je vangt ook de aanvragen die 's avonds op de bank ontstaan. We leveren hem in jouw huisstijl, met jouw prijzen en bouwwijze, en hij werkt net zo goed op een bestaande site als op een nieuwe."}, {"h2": "Hoe word ik als aannemer beter gevonden in Google?", "body": "Lokaal en per dienst. Niemand zoekt landelijk naar een bouwbedrijf; men zoekt 'aannemer Nijmegen', 'uitbouw laten bouwen Den Bosch' of 'verbouwing Eindhoven'. Dat is goed nieuws, want lokaal ranken is te winnen: de concurrentie bestaat uit collega's die hun website net zo verwaarlozen. De aanpak is nuchter. Per werkgebied een eigen pagina met echte lokale inhoud: projecten uit die plaats, de wijken waar je werkt, wat daar speelt qua woningtypes. Per dienst een eigen pagina die de vragen beantwoordt die klanten echt stellen. En een Google Bedrijfsprofiel dat leeft: recente foto's, beantwoorde reviews, kloppende openingstijden. Anders dan advertenties stapelt dit zich op: een goede lokale positie blijft maanden en jaren aanvragen opleveren."}], "features": [{"t": "Projecten als bewijs", "d": "Voor- en nafoto's met een kort verhaal en de richtprijs, de sterkste overtuiging in de bouw."}, {"t": "Pagina per dienst en plaats", "d": "Aanbouw, verbouwing, renovatie en elk werkgebied krijgen een eigen vindbare pagina."}, {"t": "Uitbouwconfigurator", "d": "Klanten stellen thuis hun uitbouw samen en sturen een complete aanvraag met richtprijs."}, {"t": "Reviews met naam en plaats", "d": "Gekoppeld aan je Google Bedrijfsprofiel, zodat vertrouwen vanzelf meegroeit."}, {"t": "CRM met pijplijn", "d": "Elke aanvraag landt automatisch met specificaties; je ziet wie gebeld moet worden."}, {"t": "Sales op commissie", "d": "Wil je meer getekende opdrachten zonder verkoper in dienst, dan doen wij de sales op commissie."}], "faq": [{"q": "Wat kost een website voor een aannemersbedrijf?", "a": "We werken met een vaste prijs die we vooraf afspreken. Een website begint bij 2.995 euro en een website met CRM bij 6.995 euro; een uitbouwconfigurator wordt apart op maat begroot. Eén extra aanbouw of uitbouw, met een opdrachtwaarde van tienduizenden euro's, betaalt de complete investering doorgaans terug."}, {"q": "Ik heb mijn agenda al vol. Waarom zou ik dan investeren?", "a": "Een volle agenda is precies het moment. Een goede site trekt niet méér werk aan, maar béter werk: klanten die je prijsniveau al kennen, projecten die bij je specialiteit passen en opdrachten met marge in plaats van prijsvechterij. De bouw kent cycli; de site die je nu bouwt, vult je agenda in het seizoen waarin het stil wordt."}, {"q": "Werkt een uitbouwconfigurator ook voor mijn bedrijf?", "a": "Als je aanbouwen, uitbouwen, dakopbouwen of verbouwingen doet: ja. De configurator rekent met jouw prijzen en werkwijze. Klanten stellen thuis hun uitbouw samen en zien direct een richtprijs; jij ontvangt een complete aanvraag in plaats van 'wat kost een uitbouw?'. Er draaien er nu tien live, waaronder dakopbouw en aanbouw."}, {"q": "Kunnen jullie ook onze offerte-opvolging verbeteren?", "a": "Ja, dat is vaak de grootste winst. Aanvragen landen direct in een CRM met pijplijn, zodat je ziet welke offertes openstaan en wie een belletje nodig heeft. Aannemers verliezen zelden opdrachten door hun prijs, maar vaak doordat een concurrent net eerder terugbelde. Bij Installatieplatform ging de offerte van een avond naar twee minuten."}, {"q": "Wat moet ik zelf aanleveren?", "a": "Verrassend weinig: een uur voor het strategiegesprek, projectfoto's in telefoonkwaliteit en je prijslogica als je een configurator wilt. Teksten, structuur, techniek en vindbaarheid zijn ons werk. Na twee weken staat de site live. We werken voor bouwbedrijven door het hele land, van Noord-Brabant en Gelderland tot de Randstad en het noorden."}], "cities": ["Den Bosch", "Nijmegen", "Arnhem", "Eindhoven", "Uden", "Veghel", "Cuijk", "Grave", "Vught", "Wijchen"], "proof": "Westrik Bouw & Installaties (website, offerteaanvraag, SEO) staat live; Prefab Select haalde +212% aanvragen met site, vindbaarheid en configurator als één keten.", "internal_links": ["sales", "dienst-webdesign", "branche-overkapping-veranda"], "jsonld": {"@context": "https://schema.org", "@graph": [{"@type": "WebPage", "@id": "https://nextgrowthdigital.nl/branche-bouwbedrijven/#webpage", "url": "https://nextgrowthdigital.nl/branche-bouwbedrijven", "name": "Website voor aannemers en bouwbedrijven | Next Growth", "description": "Website en marketing voor bouwbedrijven en aannemers: projecten als bewijs, pagina per dienst en plaats, uitbouwconfigurator met richtprijs en CRM.", "inLanguage": "nl-NL", "isPartOf": {"@id": "https://nextgrowthdigital.nl/#website"}, "about": {"@id": "https://nextgrowthdigital.nl/#organization"}, "breadcrumb": {"@id": "https://nextgrowthdigital.nl/branche-bouwbedrijven/#breadcrumb"}}, {"@type": "Service", "@id": "https://nextgrowthdigital.nl/branche-bouwbedrijven/#service", "name": "Een website voor aannemers en bouwbedrijven die het werk binnenhaalt", "serviceType": "Website, marketing en configurator voor bouwbedrijven en aannemers", "description": "Next Growth bouwt websites, marketing en verkoopsoftware voor aannemers en bouwbedrijven in Noord-Brabant, Gelderland en landelijk. Een aannemerssite van ons is een bewijsmachine: projectpagina's met voor en na, reviews met naam en plaats, een pagina per dienst en per werkgebied, en waar het past een uitbouwconfigurator met richtprijs die de aanvraag compleet in je CRM zet. Live in twee weken, vaste prijs, jouw eigendom. Case: Westrik Bouw & Installaties.", "url": "https://nextgrowthdigital.nl/branche-bouwbedrijven", "provider": {"@id": "https://nextgrowthdigital.nl/#organization"}, "areaServed": [{"@type": "Country", "name": "Nederland"}, {"@type": "City", "name": "Den Bosch"}, {"@typ onze offerte-opvolging verbeteren?", "acceptedAnswer": {"@type": "Answer", "text": "Ja, dat is vaak de grootste winst. Aanvragen landen direct in een CRM met pijplijn, zodat je ziet welke offertes openstaan en wie een belletje nodig heeft. Aannemers verliezen zelden opdrachten door hun prijs, maar vaak doordat een concurrent net eerder terugbelde. Bij Installatieplatform ging de offerte van een avond naar twee minuten."}}, {"@type": "Question", "name": "Wat moet ik zelf aanleveren?", "acceptedAnswer": {"@type": "Answer", "text": "Verrassend weinig: een uur voor het strategiegesprek, projectfoto's in telefoonkwaliteit en je prijslogica als je een configurator wilt. Teksten, structuur, techniek en vindbaarheid zijn ons werk. Na twee weken staat de site live. We werken voor bouwbedrijven door het hele land, van Noord-Brabant en Gelderland tot de Randstad en het noorden."}}]}, {"@type": "BreadcrumbList", "@id": "https://nextgrowthdigital.nl/branche-bouwbedrijven/#breadcrumb", "itemListElement": [{"@type": "ListItem", "position": 1, "name": "Home", "item": "https://nextgrowthdigital.nl/home"}, {"@type": "ListItem", "position": 2, "name": "Branches", "item": "https://nextgrowthdigital.nl/home#branches"}, {"@type": "ListItem", "position": 3, "name": "Website & marketing voor bouwbedrijven en aannemers", "item": "https://nextgrowthdigital.nl/branche-bouwbedrijven"}]}]}}, "branche-overkapping-veranda": {"title": "Website voor verandabouwers met configurator | Next Growth", "description": "Website voor overkapping- en verandabouwers met configurator: klant kiest maat, kleur en dak, ziet live de richtprijs en stuurt een complete aanvraag.", "h1": "Een website voor overkapping- en verandabouwers die zelf verkoopt", "keywords": ["website voor verandabouwers", "veranda configurator", "overkapping configurator", "website overkappingen laten maken", "verandabouwer vindbaar Google", "overkapping op maat website", "website veranda Brabant", "marketing verandabouwer"], "definition": "Next Growth bouwt websites met veranda-configurator voor overkapping- en verandabouwers in Noord-Brabant, Gelderland en landelijk. De klant kiest materiaal, maat, daktype, RAL-kleur, schuifwanden en verlichting, ziet bij elke klik het beeld en de richtprijs, en stuurt een complete aanvraag die in je CRM landt. Site en configurator staan in twee weken live, in jouw huisstijl en met jouw assortiment. Er draaien tien configurators live, waaronder overkapping en poolhouse.", "intro": "Jouw klant wil maar twee dingen weten: hoe ziet mijn veranda eruit, en wat kost hij? De meeste veranda-websites beantwoorden geen van beide. Open tien sites van verandabouwers en je ziet tien keer hetzelfde: een fotoslider, een opsomming van merken en een knop 'vraag een offerte aan'. Voor de klant is er niets te kiezen, dus vergelijkt hij op wie het eerst en het goedkoopst reageert. Dat is een race naar de bodem die je niet wilt winnen.\n\nDe uitweg is de klant grip geven. Laat hem zelf spelen met maten, kleuren en daktypes en laat hem zien wat zijn keuzes doen met het beeld en met de prijs. Wie dat eenmaal op jouw site heeft gedaan, gaat niet terug naar de fotoslider van de concurrent. Veranda's lenen zich hier bij uitstek voor: de aankoop is emotioneel en configureerbaar tegelijk. Mensen dromen 's avonds over hun terras, en dromen wordt kiezen zodra je ze een werkende tool geeft. Lucky Zonwering zit het dichtst bij jouw werk: een product met maten en opties dat de klant zelf samenstelt voordat hij belt.", "sections": [{"h2": "Hoe werkt een veranda-configurator?", "body": "De klant kiest materiaal, afmeting, dakbedekking en opties zoals verlichting en glazen schuifwanden, en de richtprijs inclusief montage rekent live mee. Hout, aluminium of allebei zitten in één flow: de klant wisselt met één klik tussen douglas met rietlook en antraciet aluminium met lamellendak en ziet per uitvoering de juiste beelden, opties en prijzen. Maatwerkmaten kunnen binnen de grenzen die jij stelt; echte specials worden als maatwerkverzoek gemarkeerd. De klant kan een foto van zijn gevel of tuin uploaden en ziet de gekozen uitvoering er fotorealistisch op terug. Wat bij jou binnenkomt is geen 'ik wil graag informatie', maar 'ik wil deze veranda van 6 bij 3,5 in antraciet met glazen schuifwanden', compleet met richtprijs."}, {"h2": "Wat levert een configurator een verandabouwer op?", "body": "Minder rekenwerk, betere afspraken en hogere marge. Elke prijsaanvraag kost je nu, tussen telefoon, bezoek en calculatie, al snel twee tot drie uur. Bij tien aanvragen per week is dat een volledige werkdag rekenen voor mensen van wie de helft alleen nieuwsgierig is. De configurator neemt precies dat deel over: de nieuwsgierigen krijgen hun antwoord zonder jouw tijd, de serieuzen komen met samenstelling bij je binnen. Je zit niet meer aan tafel om uit te leggen wat een lamellendak kost, maar om een klant die zijn keuze al maakte over de streep te helpen. Er is minder prijsdruk, omdat hij zijn eigen samenstelling vergelijkt en niet vijf kale offertes. En hij werkt 's avonds en in het weekend, precies wanneer veranda-oriëntatie gebeurt."}, {"h2": "Hoe word ik gevonden op veranda-zoektermen in mijn regio?", "body": "'Veranda laten plaatsen', 'overkapping op maat', 'lamellendak prijs', 'glazen schuifwand kosten': er wordt enorm gezocht in deze markt en de zoekintentie is glashelder commercieel. De site krijgt per productgroep en per regio eigen pagina's die deze vragen echt beantwoorden, plus keuzehulpen: lamellendak, glas of polycarbonaat, hout of aluminium, hoe ver kun je overspannen zonder paal, wanneer is een overkapping vergunningsvrij. Geschreven vanuit de vakman en elk eindigend bij de configurator. De configurator helpt dubbel: niets houdt bezoekers langer vast dan zelf samenstellen, en Google meet dat. Combineer dat met een actueel Google Bedrijfsprofiel en advertenties in het seizoen van maart tot september, met de configurator als landingsplek."}, {"h2": "Wat doen de beste veranda-websites anders?", "body": "Ze tonen het product in context. Niet drie productfoto's uit de folder van de leverancier die elke dealer gebruikt, maar veranda's bij echte huizen, met echte tuinen en klanten die erover vertellen. Wie alleen leveranciersmateriaal gebruikt is inwisselbaar; wie eigen projecten toont is een bedrijf met bewijs. Ze maken kiezen makkelijk: RAL-kleuren naast elkaar, daktypes uitgelegd in mensentaal en een configurator om het zelf te ervaren. En ze reageren snel. De veranda-klant vraagt vrijwel altijd bij meerdere partijen tegelijk aan; wie binnen een uur reageert, staat op voorsprong. Daarom hoort achter de site een CRM met pijplijn dat opvolging afdwingt. De configurator levert de betere aanvraag; het systeem zorgt dat je hem verzilvert."}], "features": [{"t": "Configurator met live richtprijs", "d": "Maat, materiaal, dak, wanden en opties, met beeld en prijs die bij elke klik meebewegen."}, {"t": "Jouw RAL-kleuren en houtsoorten", "d": "Jouw profielen, kleuren, daktypes en actuele prijzen; voor de bezoeker voelt het als jouw tool."}, {"t": "Foto van eigen tuin", "d": "De klant uploadt zijn gevel en ziet de gekozen overkapping er fotorealistisch op terug."}, {"t": "Pagina per productgroep", "d": "Veranda, overkapping, schuifwanden, lamellendak en poolhouse elk vindbaar in je regio."}, {"t": "Keuzehulpen", "d": "Hout of aluminium, glas of polycarbonaat, vergunningsvrij of niet: uitgelegd en eindigend bij de configurator."}, {"t": "Complete aanvraag in CRM", "d": "Samenstelling en richtprijs staan direct in je pijplijn, met automatische bevestiging naar de klant."}], "faq": [{"q": "Waarom heeft een verandabouwer een configurator nodig?", "a": "Omdat je product er perfect voor is: een veranda bestaat uit keuzes, maat, RAL-kleur, daktype, wanden, verlichting, en elke keuze heeft een prijs. Een configurator laat de klant die keuzes zelf maken, toont live beeld en richtprijs en stuurt jou een complete aanvraag. Het is het verschil tussen 'wat kost een veranda?' en 'ik wil deze veranda'."}, {"q": "Wat kost een website met veranda-configurator?", "a": "Een vaste prijs die we vooraf afspreken. Een website begint bij 2.995 euro; de configurator wordt op maat begroot op basis van het aantal keuzes en het beeldmateriaal. Wij hebben de bouwstenen al staan en vullen ze met jouw modellen, kleuren en prijzen. Eén extra verkochte veranda per maand dekt de investering doorgaans ruimschoots."}, {"q": "Werkt dit ook voor dealers van grote merken?", "a": "Ja. Ook als je een bekend merk aluminium overkappingen voert, kan de configurator jouw assortiment en marges volgen. Je onderscheidt je daarmee van elke andere dealer van hetzelfde merk in je regio, want de klant configureert bij jou. Verkoop je ook zonwering, schuifwanden of poolhouses, dan groeit het systeem mee."}, {"q": "Hoe snel staat het live?", "a": "Twee weken voor site plus configurator, mits je prijslogica en beeldmateriaal aanleverbaar zijn. Heb je nog geen productbeelden per kleur en uitvoering, dan adviseren we hoe je die efficiënt laat maken. Tussentijds kijk je mee via een link; de prijs spreken we vooraf af en alles wat we bouwen is jouw eigendom."}, {"q": "Wat gebeurt er met aanvragen buiten kantoortijden?", "a": "Die komen gewoon binnen, en dat zijn er veel, want veranda-oriëntatie gebeurt vooral 's avonds en in het weekend. De klant krijgt direct een nette bevestiging met zijn samenstelling en jij vindt de aanvraag maandagochtend bovenaan je pijplijn. Geen voicemail, geen gemiste kans. We werken landelijk, met veel klanten in Brabant en Gelderland."}], "cities": ["Den Bosch", "Nijmegen", "Arnhem", "Eindhoven", "Uden", "Veghel", "Wijchen", "Cuijk", "Grave", "Vught"], "proof": "Lucky Zonwering (website, configurator en CRM, 5,0 op Google met 124 reviews) en de live overkapping- en poolhouse-configurators uit de tien die draaien.", "internal_links": ["branche-hoveniers", "branche-bouwbedrijven", "dienst-marketing"], "jsonld": {"@context": "https://sche ee via een link; de prijs spreken we vooraf af en alles wat we bouwen is jouw eigendom."}}, {"@type": "Question", "name": "Wat gebeurt er met aanvragen buiten kantoortijden?", "acceptedAnswer": {"@type": "Answer", "text": "Die komen gewoon binnen, en dat zijn er veel, want veranda-oriëntatie gebeurt vooral 's avonds en in het weekend. De klant krijgt direct een nette bevestiging met zijn samenstelling en jij vindt de aanvraag maandagochtend bovenaan je pijplijn. Geen voicemail, geen gemiste kans. We werken landelijk, met veel klanten in Brabant en Gelderland."}}]}, {"@type": "BreadcrumbList", "@id": "https://nextgrowthdigital.nl/branche-overkapping-veranda/#breadcrumb", "itemListElement": [{"@type": "ListItem", "position": 1, "name": "Home", "item": "https://nextgrowthdigital.nl/home"}, {"@type": "ListItem", "position": 2, "name": "Branches", "item": "https://nextgrowthdigital.nl/home#branches"}, {"@type": "ListItem", "position": 3, "name": "Overkapping- en verandabouwers", "item": "https://nextgrowthdigital.nl/branche-overkapping-veranda"}]}]}}, "branche-dakdekkers": {"title": "Website voor dakdekkers: spoed en renovatie | Next Growth", "description": "Website voor dakdekkers met spoedroute voor lekkages, pagina per klussoort en plaats, projecten met voor en na en reviews. Live in twee weken, vast bedrag.", "h1": "Een website voor dakdekkers, voor spoed én het grote werk", "keywords": ["website voor dakdekkers", "website dakdekker laten maken", "dakdekker vindbaar Google", "dakrenovatie configurator", "dakkapel configurator", "website dakdekkersbedrijf Brabant", "marketing dakdekker", "website dakdekker Nijmegen"], "definition": "Next Growth bouwt websites voor dakdekkers in Noord-Brabant, Gelderland en landelijk, gebouwd op twee soorten klanten: de spoedzoeker met een lekkage die binnen minuten belt, en de planner met een dakrenovatie die weken vergelijkt. Een dakdekkerssite van ons heeft een spoedroute met het nummer bovenaan, een pagina per klussoort en per plaats, projecten met voor en na en reviews. Live in twee weken, vast bedrag. Cases: Heesbeen Dakwerken, Dakcentrale Holland.", "intro": "Bij een lekkage googelt de klant in paniek en belt de eerste die er betrouwbaar uitziet. Bij een dakrenovatie vergelijkt hij weken, leest reviews en zoekt bewijs: projecten, garanties, certificaten. Een goede dakdekkerssite wint ze allebei. De meeste sites bedienen er geen van beide: één pagina, een stockfoto en een contactformulier dat bij spoed nutteloos is. Zeventig procent van je bezoek komt via een telefoon, en daar bouwen we op: bellen met één tik, reactietijd en werkgebied direct in beeld.\n\nDakwerk is het ultieme vertrouwensvak. De klant kan het resultaat niet zien en niet beoordelen; hij koopt op reputatie, en die reputatie is in deze branche belast door dakhaaien en aanbellers. Elke twijfel die je site wegneemt is direct concurrentievoordeel: foto's van je eigen team, projecten met het verhaal erbij en na elke klus automatisch een reviewverzoek richting je Google-profiel. Heesbeen Dakwerken en Dakcentrale Holland draaien op dezelfde opzet als wat we voor jou zouden bouwen.", "sections": [{"h2": "Wat moet er op een website voor een dakdekker staan?", "body": "Vier dingen moeten kloppen en meestal klopt er maar één. Gevonden worden: een eigen pagina per klussoort en per plaats, plus je Google Bedrijfsprofiel op orde; niet één pagina die alles probeert maar twintig die elk één vraag beantwoorden. Vertrouwen: echte foto's van eigen daken, reviews met naam en plaats, je gezicht erbij en je garanties in mensentaal. De aanvraag makkelijk maken: bellen met één tik, een formulier van drie velden en op elke pagina een aanleiding om contact op te nemen. En opvolging: elke aanvraag komt binnen op je mail én je telefoon, en na de klus gaat automatisch een reviewverzoek uit. Bezoekers zijn geen doel, aanvragen wel. Daarom meten we vanaf dag één hoeveel er binnenkomen."}, {"h2": "Waarom vragen spoed en planbaar werk elk een eigen route?", "body": "De spoedzoeker zoekt 'daklekkage + plaats', vaak 's avonds. Hij belt binnen minuten, vergelijkt nauwelijks, wil een nummer zien en geen formulier, en kijkt of je echt lokaal bent. Kleine omzet, grote deuropener. Wat wij bouwen: telefoon-eerst, reactietijd en werkgebied direct in beeld, foto's van herstelde stormschade. De planner zoekt 'plat dak vernieuwen' of 'dak isoleren subsidie'. Hij vergelijkt weken, leest reviews, wil weten wat het kost en wie het doet. Grote opdrachten, planbaar werk. Wat wij bouwen: inhoud-eerst, een pagina per klussoort met prijsindicatie per vierkante meter en eigen projecten als bewijs. De stilste omzet zit bij VvE's, beheerders en bedrijfspanden die planmatig onderhoud zoeken; daar heeft online bijna niemand een pagina voor."}, {"h2": "Wat kost een website voor een dakdekkersbedrijf?", "body": "Eén vast bedrag dat je hoort voordat je iets tekent. Een website begint bij 2.995 euro; wat het bij jou wordt, hangt af van hoe groot je hem maakt: hoeveel klussoorten, hoeveel plaatsen, wel of geen rekentool. Doe je alleen plat dak in twee gemeenten, dan is dat een kleine site. Wil je hellend dak, plat dak, goten, isolatie en dakkapellen in acht plaatsen, dan zijn dat al gauw twintig pagina's die elk hun eigen tekst nodig hebben. Teksten, opbouw en meting zitten erin, geen uurtarief en geen meerwerk achteraf. De site is jouw eigendom, ook als je later weggaat. Hosting en onderhoud staan apart, dus je zit nergens aan vast."}, {"h2": "Wat kan een dakrenovatie- of dakkapelconfigurator toevoegen?", "body": "Als de site loopt en je merkt dat je dezelfde prijsvraag tien keer per week beantwoordt, is een rekentool het antwoord. De klant stelt zijn dakrenovatie zelf samen: wat er moet gebeuren, welke pan, welke goot, of er zonnepanelen op komen. Het dak op het scherm verandert mee en de prijs rekent live door, per vierkante meter, inclusief en exclusief btw. Bij de dakkapelconfigurator kiest de bezoeker indeling, gevelafwerking, kozijnkleur en opties en ziet precies die dakkapel op het dak staan. Wat bij jou binnenkomt is een complete samenstelling met materiaalstaat en offerteblad uit dezelfde bron. Jouw logo, jouw prijzen, in één instellingenbestand. Een rekentool is apart werk met een eigen prijs; de meeste dakdekkers beginnen met de site."}], "features": [{"t": "Spoedroute voor lekkages", "d": "Nummer bovenaan, reactietijd zichtbaar, werkt ook 's nachts op een telefoon."}, {"t": "Pagina per klussoort en plaats", "d": "Hellend dak, plat dak, goten, isolatie en dakkapel, per gemeente vindbaar."}, {"t": "Projecten met voor en na", "d": "Eigen foto's met het verhaal erbij: wat er aan de hand was, wat je deed, wat het kostte."}, {"t": "Reviews gekoppeld aan Google", "d": "Na elke klus automatisch een reviewverzoek, zodat je vindbaarheid vanzelf meegroeit."}, {"t": "Zakelijk en VvE apart", "d": "Een pagina voor planmatig onderhoud van beheerders en bedrijfspanden."}, {"t": "Dakrenovatie- en dakkapelconfigurator", "d": "Optioneel: de klant stelt samen en ziet de richtprijs per m² inclusief plaatsing."}], "faq": [{"q": "Dakdekkers hebben toch werk genoeg, waarom een website?", "a": "Omdat spoed je binnenhaalt en planbaar werk je verdient. De klant wiens lekkage je vandaag oplost, is over drie jaar de vanzelfsprekende partij voor de dakrenovatie, maar alleen als hij je terug kan vinden. Spoedwerk is grillig; een site die ook op renovatie, isolatie en VvE-onderhoud wordt gevonden, vult de maanden waarin de telefoon stiller is."}, {"q": "Hoe belangrijk zijn reviews voor een dakdekker?", "a": "Doorslaggevend, omdat de klant het resultaat niet kan beoordelen en volledig op reputatie koopt. Na elke klus gaat er automatisch een verzoek uit richting je Google-profiel. Dakdekkers vergeten dat structureel; twintig echte reviews in je gemeente en het kaartblok is praktisch van jou. De reviews lopen ook mee op je site."}, {"q": "Ik doe ook zink, goten, isolatie en gevelwerk. Komt dat op de site?", "a": "Ja. Elke klussoort krijgt een eigen pagina met eigen uitleg, prijsindicatie en zoekwoorden, omdat 'dakdekker + plaats' niet is waar de omzet zit; die zit in de vragen daaronder. Gevelreiniging en voegherstel kunnen in een configurator met vier reinigingsmethodes en prijs per vierkante meter."}, {"q": "Hoe lang duurt het en hoeveel tijd kost het mij?", "a": "Twee weken, en je bent er zelf een halve dag mee kwijt. Tien minuten aan de telefoon voor de opzet, een half uur foto's zoeken, en één controleronde op dag tien waarin je alles aanwijst wat niet klopt. Wij schrijven, bouwen en zetten hem live. Vanaf dag veertien staat de meting aan."}, {"q": "Werkt dit ook voor VvE- en zakelijk werk?", "a": "Ja, en dat is het stilste goud in het vak. VvE's, beheerders en bedrijfspanden zoeken planmatig onderhoud; de opdrachten zijn groot en planbaar en er speelt online nauwelijks iemand op in. Een aparte zakelijke pagina met contractvormen, inspecties en reactietijden bedient die markt. We bouwen voor dakdekkers door heel Nederland, met veel klanten in Brabant en Gelderland."}], "cities": ["Nijmegen", "Arnhem", "Den Bosch", "Uden", "Veghel", "Wijchen", "Vught", "Cuijk", "Grave", "Eindhoven"], "proof": "Heesbeen Dakwerken (website, dakinspectie-aanvraag, lokale SEO) en Dakcentrale Holland (website, CRM, offertesjablonen) staan live op dezelfde opzet.", "internal_links": ["branche-bouwbedrijven", "branche-installatiebedrijven", "dienst-webdesign"], "jsonld": {"@context": "https://schema.org", "@graph": [{"@type": "WebPage", "@id": "https://nextgrowthdigital.nl/branche-dakdekkers/#webpage", "url": "https://nextgrowthdigital.nl/branche-dakdekkers", "name": "Website voor dakdekkers: spoed en renovatie | Next Growth", "description": "Website voor dakdekkers met spoedroute voor lekkages, pagina per klussoort en plaats, projecten met voor en na en reviews. Live in twee weken, vast bedrag.", "inLanguage": "nl-NL", "isPartOf": {"@id": "https://nextgrowthdigital.nl/#website"}, "about": {"@id": "https://nex
